# Classification configuration for AI-based issue/PR labeling.
#
# Each description is used as input to a sentence embedding model.
# The model computes cosine similarity between the issue text and each description.
# Better descriptions = better classification. Include keywords, synonyms, and
# phrases that typically appear in issues for that area.
#
# To tune accuracy:
#   - Edit descriptions to include terms from misclassified issues
#   - Adjust thresholds (lower = more labels assigned, higher = fewer but more precise)
#   - Run the test script to measure impact: python test_classify.py --repo OWNER/REPO
#
# Labels nest by name: area/storage/sql is a child of area/storage because that
# is the longest configured label its name extends. There is no `parent:` key to
# keep in sync — the name is the hierarchy, exactly as it reads on GitHub.
#
# Nesting shapes selection in two ways (see classify_area_labels):
#   - A selected label always brings its ancestors along, free of the
#     max_labels budget.
#   - The more nested label wins. When a parent and its child both clear their
#     thresholds, the child takes the slot and the parent is implied — so a
#     parent's description should hold the terms that are common to the whole
#     family, and anything specific to one child belongs in that child.
#
# Every label here must exist on GitHub under exactly this name: the classifier
# applies them with `gh ... --add-label`, which fails on an unknown label.

