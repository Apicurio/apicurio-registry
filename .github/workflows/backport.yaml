name: Backport

# Automatically cherry-picks merged PRs to maintenance branches when labeled.
# Add the "backport/3.3.x" label to a PR before or after merging to trigger a
# cherry-pick PR against the 3.3.x LTS branch. This fires both when a labeled,
# already-merged PR is closed, and when the label is added to a PR that was
# merged before the label existed.
#
# If a backport branch for the PR already exists (e.g. the label was added,
# removed, and re-added), the run is skipped instead of failing or duplicating
# the backport PR.
#
# On conflict, the action opens a draft PR with conflict markers for manual
# resolution. Uses the apicurio-ci PAT so the backport PR triggers CI workflows
# (PRs created by GITHUB_TOKEN do not trigger other workflows).

on:
  pull_request_target:
    types: [closed, labeled]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  backport-3-3-x:
    name: Backport to 3.3.x
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.merged == true &&
      (github.event.action != 'labeled' || github.event.label.name == 'backport/3.3.x') &&
      contains(github.event.pull_request.labels.*.name, 'backport/3.3.x')
    steps:
      - name: Check for existing backport
        id: check-existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="backport/${{ github.event.pull_request.number }}-to-3.3.x"
          ENCODED_BRANCH="${BRANCH/\//%2F}"
          if gh api "repos/${{ github.repository }}/branches/${ENCODED_BRANCH}" >/dev/null 2>&1; then
            echo "Backport branch $BRANCH already exists, skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Backport
        if: steps.check-existing.outputs.exists == 'false'
        uses: kiegroup/git-backporting@v4
        with:
          target-branch: 3.3.x
          pull-request: ${{ github.event.pull_request.html_url }}
          auth: ${{ secrets.ACCESS_TOKEN }}
          title: "[backport 3.3.x] ${{ github.event.pull_request.title }}"
          body: |
            Backport of #${{ github.event.pull_request.number }} to `3.3.x`.

            Original PR: ${{ github.event.pull_request.html_url }}
          labels: backported
          bp-branch-name: backport/${{ github.event.pull_request.number }}-to-3.3.x
