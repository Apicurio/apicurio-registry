name: CI

# The PR-iteration workflow.
#
# Two tiers in one workflow:
#   1. Quick Verify — the fast gate (<= 5 min) on every PR push. See the job
#      below for its philosophy and budget.
#   2. The full unit-tier suite (lint, unit-test shards, Scalpel, CLI, SDKs,
#      console plugin) — gated by Decide on lifecycle/ready-to-merge and pushes
#      to main. Integration tests and extra tests live in their own top-level
#      workflows (integration-tests.yaml, extras.yaml); operator tests and image
#      publishing stay in verify.yaml.
#
# Merge gating: the Verification Gate in verify.yaml waits for this workflow's run
# on the same SHA; the orchestrator (pr-lifecycle) aggregates all full-suite
# workflows before applying lifecycle/full-verified.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # actions:write lets the dispatch-integration-and-extras job trigger the
  # downstream workflows that consume this workflow's Build artifact.
  actions: write

jobs:
  # ==========================================================================
  # QUICK VERIFY: the fast PR gate. Target: <= 5 minutes.
  #
  # Philosophy: PR iteration (opened / synchronize / draft pushes) gets ONE job
  # that answers "does it compile and do the core smoke tests pass".
  #
  # What this job deliberately does NOT do:
  #   - no docker image builds or loads (the Build job alone costs ~5 min)
  #   - no testcontainers / minikube / keycloak
  #   - no matrix, no sharding, no artifact upload/download between jobs
  #   - no javadoc/source/assembly/checkstyle (the -Dlocal tier skips them)
  #
  # What it DOES do:
  #   1. repo file lint (~10 s)
  #   2. full compile of the local tier incl. test sources (~2-3 min with warm cache)
  #   3. all non-app unit tests (plain JUnit, no Quarkus boot) (~1 min)
  #   4. a curated app smoke set: profile-free @QuarkusTest classes that share a
  #      single Quarkus boot (in-memory storage, random port) (~1 min)
  #
  # If this job exceeds its budget the lever is the smoke list below, not new jobs.
  # ==========================================================================
  quick-verify:
    name: Quick Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PR iteration only: not on push (the full tier below covers main), and not
    # on label events (the synchronize/opened run on the same SHA already ran it).
    if: github.event_name == 'pull_request' && github.event.action != 'labeled'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Restore Maven cache
        uses: ./.github/actions/setup-maven-cache

      - name: Lint files
        run: ./scripts/validate-files.sh

      - name: Build (local tier, tests compiled but not run)
        run: |
          # -Dlocal skips javadoc, source JARs, checkstyle and assembly.
          # -DskipTests still compiles test sources, so a PR that breaks test
          # compilation fails here.
          ./mvnw install -Dlocal -DskipTests --no-transfer-progress \
            -s ${{ github.workspace }}/.github/ci-settings.xml \
            -DskipCommitIdPlugin=true \
            -Daether.syncContext.named.factory=noop \
            -Dmaven.wagon.httpconnectionManager.maxTotal=30 \
            -Dmaven.wagon.http.retryHandler.count=5

      - name: Non-app unit tests
        run: |
          # Plain JUnit modules (schema-utils, serdes, SDKs, common): no Quarkus
          # boot, no containers. -Dlocal already excludes distro/docs from the
          # reactor, so only app needs excluding here.
          #
          # utils/protobuf-schema-utilities is excluded: FileDescriptorUtilsTest
          # fails in fresh environments (missing google well-known .proto
          # resources) — a pre-existing issue on main, tracked separately.
          ./mvnw test --no-transfer-progress \
            -s ${{ github.workspace }}/.github/ci-settings.xml \
            -Dlocal -pl '!app,!utils/protobuf-schema-utilities' \
            -DskipCommitIdPlugin=true \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Daether.syncContext.named.factory=noop

      - name: App smoke tests
        run: |
          # Curated smoke set. Every class here is free of @TestProfile and
          # @QuarkusTestResource, so the whole list boots Quarkus exactly once.
          # When adding a class, verify it stays profile-free:
          #   grep -L "@TestProfile\|QuarkusTestResource" <file>
          ./mvnw surefire:test --no-transfer-progress \
            -s ${{ github.workspace }}/.github/ci-settings.xml \
            -Pprod -pl app \
            -Dtest='io.apicurio.registry.noprofile.rest.v3.BranchesTest,io.apicurio.registry.noprofile.rest.v3.ContentResourceTest,io.apicurio.registry.noprofile.rest.v3.SearchArtifactsTest,io.apicurio.registry.noprofile.rest.v3.ImportExportTest,io.apicurio.registry.noprofile.rest.v3.SystemResourceTest,io.apicurio.registry.noprofile.ArtifactTypeTest' \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Daether.syncContext.named.factory=noop

  # ==========================================================================
  # FULL UNIT-TIER SUITE (pre-merge gate / main pushes)
  #
  # Everything below is gated by the shared Decide job: it runs at
  # lifecycle/ready-to-merge and on pushes to main, and is skipped during PR
  # review (Quick Verify owns that phase).
  # ==========================================================================
  decide:
    name: Decide
    uses: ./.github/workflows/verify-decide.yaml

  lint-and-validate:
    name: Lint and Validate
    runs-on: ubuntu-latest
    needs: decide
    if: needs.decide.outputs.lifecycle-ready == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run linter
        run: ./scripts/validate-files.sh

      # Fails if any app/ test class is claimed by zero shards (it would never run in CI, and
      # -Dsurefire.failIfNoSpecifiedTests=false means no shard would complain) or by more than
      # one (wasted runner time). Runs here rather than in verify-unit-tests.yaml so it is checked
      # once instead of once per shard, and so it fails fast. See issue #9265.
      - name: Verify unit test shard partition
        run: python3 .github/scripts/verify-test-shards.py

      # Orchestrator scripts run with repo write permissions under
      # pull_request_target — their logic must be tested before merge.
      - name: Test PR lifecycle scripts
        run: node --test .github/scripts/pr-lifecycle.test.js

      - name: Verify docs generation
        run: |
          if [ -n "$(git status --untracked-files=no --porcelain docs)" ]; then
            echo "Docs needs to be regenerated. Run 'mvn clean install -pl docs -am -DskipTests' and commit the resulting files in the 'docs' folder."
            git --no-pager diff docs
            exit 1
          fi

  build:
    name: Build
    needs: [decide, lint-and-validate]
    if: needs.decide.outputs.run-build == 'true'
    uses: ./.github/workflows/verify-build.yaml

  # After the shared Build job completes, trigger the downstream workflows that
  # consume its artifact instead of building again (single build per SHA).
  # Verify.yaml keeps its own Decide+operator; Integration Tests and Extra Tests
  # are dispatched on this workflow's head SHA.
  dispatch-integration-and-extras:
    name: Dispatch Integration and Extra Tests
    runs-on: ubuntu-latest
    needs: [decide, build]
    if: needs.build.result == 'success' && (needs.decide.outputs.run-integration == 'true' || needs.decide.outputs.run-extras == 'true')
    steps:
      - name: Dispatch Integration Tests
        if: needs.decide.outputs.run-integration == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/workflows/integration-tests.yaml/dispatches \
            -f ref=${{ github.event.pull_request.head.ref || github.ref_name }} \
            -f "inputs[pr-number]=${{ github.event.pull_request.number || '' }}" || echo "::warning::Integration Tests dispatch failed"

      - name: Dispatch Extra Tests
        if: needs.decide.outputs.run-extras == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/workflows/extras.yaml/dispatches \
            -f ref=${{ github.event.pull_request.head.ref || github.ref_name }} \
            -f "inputs[pr-number]=${{ github.event.pull_request.number || '' }}" || echo "::warning::Extra Tests dispatch failed"

  unit-tests:
    name: Unit Tests
    needs: [decide, build]
    if: needs.decide.outputs.run-unit-tests == 'true'
    uses: ./.github/workflows/verify-unit-tests.yaml
    with:
      image-tag: ${{ github.sha }}

  # Scalpel Report (affected-module detection, data collection only).
  # Not in the CI Gate: a failure here never blocks a PR.
  # See Discussion #8364 for the evaluation results that led to this change.
  scalpel-report:
    name: Scalpel Report
    needs: [decide]
    if: >-
      github.event_name == 'pull_request'
      && needs.decide.outputs.run-scalpel-report == 'true'
      && needs.decide.outputs.scalpel-enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: Scalpel diffs against the base branch (GITHUB_BASE_REF)
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Restore Maven cache
        uses: ./.github/actions/setup-maven-cache

      - name: Generate Scalpel report
        run: |
          # CLI flags win over .mvn/maven.config (scalpel.enabled=false there).
          # reportFile restates the documented default so the upload path
          # below cannot drift if upstream changes it.
          # wagon flags: same transient-failure hardening as the other CI jobs.
          ./mvnw validate --no-transfer-progress \
            -s ${{ github.workspace }}/.github/ci-settings.xml \
            -Dscalpel.enabled=true \
            -Dscalpel.mode=report \
            -Dscalpel.reportFile=target/scalpel-report.json \
            -Dmaven.wagon.httpconnectionManager.maxTotal=30 \
            -Dmaven.wagon.http.retryHandler.count=5

      - name: Upload Scalpel report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scalpel-report-pr${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: target/scalpel-report.json
          retention-days: 30
          if-no-files-found: warn

  cli-verify:
    name: CLI Verification
    needs: [decide, build]
    if: needs.decide.outputs.run-cli == 'true'
    uses: ./.github/workflows/verify-cli.yaml
    with:
      image-tag: ${{ github.sha }}

  go-sdk-freshness:
    name: Go SDK Freshness
    runs-on: ubuntu-latest
    needs: [decide]
    if: needs.decide.outputs.run-go-sdk-freshness == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.0'

      - name: Regenerate Go SDK
        run: |
          cd go-sdk
          make generate format

      - name: Check for drift
        run: |
          if ! git diff --exit-code go-sdk/pkg/; then
            echo "::error::Go SDK is out of date. Run 'cd go-sdk && make generate format' and commit the changes."
            exit 1
          fi

  sdk:
    name: SDK Verification
    needs: [decide, build]
    if: needs.decide.outputs.run-sdk == 'true'
    uses: ./.github/workflows/verify-sdk.yaml
    with:
      image-tag: ${{ github.sha }}

  console-plugin:
    name: Console Plugin
    needs: [decide]
    if: needs.decide.outputs.run-console-plugin == 'true'
    uses: ./.github/workflows/verify-console-plugin.yaml
    secrets: inherit

  # Terminal gate so this workflow has a single check summarizing its jobs.
  # Passes when every job succeeded or was appropriately skipped by Decide
  # (e.g. during PR review, when the full tier does not run). Scalpel Report
  # is intentionally excluded: it is data collection only.
  gate:
    name: CI Gate
    if: always()
    needs: [quick-verify, decide, lint-and-validate, build, unit-tests,
            cli-verify, go-sdk-freshness, sdk, console-plugin]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate gate
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Job results: $RESULTS"
          FAILED=$(echo "$RESULTS" | jq '[.[] | select(. != "success" and . != "skipped")] | length')
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::One or more CI jobs failed or were cancelled"
            exit 1
          fi
          echo "All checks passed"
