name: Extra Tests

# Top-level workflow for additional checks that do not fit the unit or integration
# tiers (currently: the examples HTTP-caching test). Triggers directly on
# pull_request/push, same as ci.yaml/verify.yaml — NOT via workflow_dispatch.
#
# workflow_dispatch was tried and reverted: a dispatched run can never be
# natively associated with the PR that triggered it (GitHub computes that
# association from the event's own (repository, head_branch) tuple against
# open PRs' heads; a dispatch's head_branch is whatever ref it was pointed at,
# never the PR's actual branch, which for a fork PR does not even exist on
# this repo) — confirmed empirically. That made Extra Tests invisible as a
# real, natively-grouped check on the PR page no matter how correctly the
# dispatch threaded through the PR's SHA. Triggering on pull_request directly
# avoids the problem entirely: Decide only lets the real jobs below run once
# the PR reaches lifecycle/ready-to-merge (immediately for a trusted-author
# PR, or once reviewed for anyone else), exactly like ci.yaml's full tier;
# until then this run is just Decide + Gate, seconds of overhead. The
# orchestrator's existing force-rerun of every full-suite workflow file
# (already used for ci.yaml/verify.yaml, since a bot-applied label does not
# itself fire a new event) re-runs this one too once it exists, with no
# dispatch-specific code needed.
#
# The Java/Docker build itself lives solely in quick-check.yaml now — this
# workflow waits for its run (verify-await-build.yaml) and downloads its
# build-artifacts/Docker images across runs instead of rebuilding.
#
# Merge gating: the Verification Gate in verify.yaml waits for this workflow's run
# on the same SHA; the orchestrator (pr-lifecycle) aggregates all full-suite
# workflows before applying lifecycle/full-verified.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # actions: read is needed for await-build's cross-run artifact download
  # (quick-check.yaml's Build job runs in a separate workflow run) — a
  # reusable workflow's own permissions are capped by what the caller grants.
  actions: read

jobs:
  decide:
    name: Decide
    uses: ./.github/workflows/verify-decide.yaml

  await-build:
    name: Await Build
    needs: [decide]
    if: needs.decide.outputs.run-extras == 'true'
    uses: ./.github/workflows/verify-await-build.yaml

  extras:
    name: Extra Tests
    needs: [decide, await-build]
    if: needs.decide.outputs.run-extras == 'true'
    uses: ./.github/workflows/verify-extras.yaml
    with:
      image-tag: ${{ github.sha }}
      build-run-id: ${{ needs.await-build.outputs.run-id }}

  # Terminal gate so this workflow has a single check summarizing its jobs.
  # Passes when every job succeeded or was appropriately skipped by Decide
  # (e.g. during PR review, when the full suite does not run).
  gate:
    name: Extra Tests Gate
    if: always()
    needs: [decide, await-build, extras]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate gate
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Job results: $RESULTS"
          FAILED=$(echo "$RESULTS" | jq '[.[] | select(. != "success" and . != "skipped")] | length')
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::One or more extra test jobs failed or were cancelled"
            exit 1
          fi
          echo "All checks passed"
