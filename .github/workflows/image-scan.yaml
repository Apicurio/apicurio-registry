name: Trivy Image Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read
  security-events: write

jobs:
  vulnerability-scan:
    name: Container vulnerability scan (${{ matrix.snapshot-tag }})
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Apicurio'
    strategy:
      matrix:
        snapshot-tag: ['latest-snapshot', '3.3.x-snapshot']
    steps:
      - name: Checkout "${{ github.ref }}"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: quay.io/apicurio/apicurio-registry:${{ matrix.snapshot-tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os,library'
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-${{ matrix.snapshot-tag }}'

      - name: Run Trivy vulnerability scanner (mutable image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: quay.io/apicurio/apicurio-registry:${{ matrix.snapshot-tag }}-mutable
          format: 'sarif'
          output: 'trivy-results-mutable.sarif'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os,library'
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab (mutable image)
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: 'trivy-results-mutable.sarif'
          category: 'trivy-${{ matrix.snapshot-tag }}-mutable'
