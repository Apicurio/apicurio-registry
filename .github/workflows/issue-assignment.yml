name: Issue Assignment

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-assignment-user-${{ github.event.comment.user.login }}
  cancel-in-progress: false

jobs:
  assign:
    name: Issue Assignment
    runs-on: ubuntu-latest
    # Fail fast at the job level: an edit only proceeds when it *introduces* the
    # command. Editing a comment that already began with '/' was handled on
    # creation, and edits to ordinary comments never reach the handler at all,
    # so routine editing costs a skipped job and no runner time.
    if: |
      github.repository_owner == 'Apicurio' &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/') &&
      (github.event.action == 'created' ||
       !startsWith(github.event.changes.body.from, '/'))
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The maintainers list is shared with the PR lifecycle orchestrator; the
      # handler reads it to exempt maintainers from the maintainer-only labels.
      - name: Convert config to JSON
        run: yq -o json .github/pr-lifecycle.yml > .github/pr-lifecycle.json

      - name: Handle issue assignment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const handler = require('./.github/scripts/issue-assignment.js');
            await handler.handleIssueComment({ github, context, core });

