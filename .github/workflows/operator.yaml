name: Operator Test Workflow
on:
  workflow_call:
    inputs:
      publish:
        description: Whether to publish operator images (only on push to main)
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Operator/operand/gitops-sync: saved as artifacts, pushed to localhost:5000 in test shards.
  # Bundle/catalog: pushed to ttl.sh by build job (opm requires HTTPS for catalog-build).
  REGISTRY_APP_IMAGE: localhost:5000/apicurio-registry:${{ github.sha }}
  REGISTRY_GITOPS_SYNC_IMAGE: localhost:5000/apicurio-registry-gitops-sync:${{ github.sha }}
  IMAGE: localhost:5000/apicurio-registry-3-operator:${{ github.sha }}
  BUNDLE_IMAGE: ttl.sh/apicurio-registry-3-operator-bundle-${{ github.sha }}:8h
  CATALOG_IMAGE: ttl.sh/apicurio-registry-3-operator-catalog-${{ github.sha }}:8h

jobs:

  operator-build:
    name: Build Operator
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Apicurio' && !contains(github.event.*.labels.*.name, 'DO NOT MERGE')
    steps:

      - name: Checkout ${{ github.ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Build operand (app + docker) and operator OLM tests, so downstream tests reflect changes in the current PR.
      # -Dfull: include all optional modules needed for the Docker image
      # -Daether.syncContext.named.factory=noop: prevent Maven 3.9+ resolver lock deadlocks under -T
      - name: Build
        run: ./mvnw -s ${{ github.workspace }}/.github/ci-settings.xml -B clean package -Dfull -pl app,distro/docker,operator/olm-tests -am -Pprod -DskipTests -Dmaven.javadoc.skip -Daether.syncContext.named.factory=noop

      - name: Build operand image
        run: |
          docker build -f ./distro/docker/target/docker/Dockerfile.jvm -t "$REGISTRY_APP_IMAGE" ./distro/docker/target/docker

      - name: Build GitOps sync sidecar image
        run: |
          docker build -t "$REGISTRY_GITOPS_SYNC_IMAGE" ./distro/gitops

      - name: Build operator image
        working-directory: operator
        run: |
          make image-build

      # OLM bundle and catalog: opm requires an HTTPS registry to pull the bundle
      # image during catalog-build. We use ttl.sh for the build step only (opm needs
      # it), then save the final images as artifacts for test shards.
      - name: Build and push OLM bundle
        working-directory: operator
        run: |
          ROLLING_CHANNEL_ARG=""
          # base_ref is empty on pull_request_review events; check the PR payload's base
          # ref too so review-triggered runs still include the rolling (3.x) channel.
          if [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.base_ref }}" = "main" ] \
             || [ "${{ github.event.pull_request.base.ref }}" = "main" ]; then
            ROLLING_CHANNEL_ARG="ROLLING_CHANNEL=3.x"
          fi
          make $ROLLING_CHANNEL_ARG bundle

      - name: Build and push OLM catalog
        working-directory: operator
        run: |
          ROLLING_CHANNEL_ARG=""
          # base_ref is empty on pull_request_review events; check the PR payload's base
          # ref too so review-triggered runs still include the rolling (3.x) channel.
          if [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.base_ref }}" = "main" ] \
             || [ "${{ github.event.pull_request.base.ref }}" = "main" ]; then
            ROLLING_CHANNEL_ARG="ROLLING_CHANNEL=3.x"
          fi
          make $ROLLING_CHANNEL_ARG catalog

      - name: Generate install file for tests
        working-directory: operator
        run: |
          make INSTALL_FILE=controller/target/test-install.yaml dist-install-file

      # Save operator/operand/gitops-sync images as artifacts for test shards.
      # Bundle/catalog are already on ttl.sh (pushed by make bundle/catalog above).
      - name: Save Docker images
        run: |
          docker save "$REGISTRY_APP_IMAGE" -o /tmp/operator-test-registry-app.tar
          docker save "$REGISTRY_GITOPS_SYNC_IMAGE" -o /tmp/operator-test-gitops-sync.tar
          docker save "$IMAGE" -o /tmp/operator-test-operator.tar

      - name: Upload Docker images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: operator-test-images
          path: /tmp/operator-test-*.tar
          retention-days: 1

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: operator-build-artifacts
          path: |
            operator/controller/target/
            operator/model/target/
            operator/olm-tests/target/
          retention-days: 1

  operator-test-local:
    name: Local Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: operator-build
    # Same JUnit @Tag groups as Remote Tests below, minus the OLM ones — OLM
    # install/upgrade is a remote-cluster-only concept (subscribing to a
    # catalog), not applicable to the in-process "local" operator. Sharded
    # into separate jobs/runners/Minikube instances rather than JVM-level
    # parallelism: the Makefile deliberately forces -T1 because @QuarkusTest
    # local-mode instances cannot safely share one JVM, but separate jobs
    # have no such restriction — each gets its own JVM and its own cluster.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: smoke
            groups: "smoke"
          - name: kafka
            groups: "kafka"
          - name: auth
            groups: "auth"
            excluded-groups: "kafka"
          - name: database
            groups: "database"
          - name: feature-a
            groups: "feature-a"
            excluded-groups: "feature-setup"
          - name: feature-b
            groups: "feature-b"
            excluded-groups: "feature-setup"
          - name: feature-setup
            groups: "feature-setup"
    steps:

      - name: Checkout ${{ github.ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: operator-build-artifacts
          path: operator/

      - name: Download Docker images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: operator-test-images
          path: /tmp/



      - uses: apicurio/apicurio-github-actions/setup-minikube@ecae58cc1a9b5eeb810b90f8a9e15d2266a371d3 # v2
        id: minikube-setup
        continue-on-error: true
        timeout-minutes: 10
        with:
          driver: 'none'
          ingress-enable: 'true'
          olm-enable: 'false'
          olm-v1-enable: 'false'

      # medyagh/setup-minikube (invoked by the composite action) intermittently
      # fails with transient HTTP 504s while downloading; one retry absorbs it
      # instead of failing the whole job.
      - uses: apicurio/apicurio-github-actions/setup-minikube@ecae58cc1a9b5eeb810b90f8a9e15d2266a371d3 # v2
        if: steps.minikube-setup.outcome == 'failure'
        timeout-minutes: 10
        with:
          driver: 'none'
          ingress-enable: 'true'
          olm-enable: 'false'
          olm-v1-enable: 'false'

      - name: Start local registry
        run: |
          docker run -d -p 5000:5000 --restart=always ghcr.io/distribution/distribution:3.0
          for i in $(seq 1 20); do
            curl -sf http://localhost:5000/v2/ >/dev/null 2>&1 && break
            echo "Waiting for registry... ($i/20)"
            sleep 0.5
          done
          curl -sf http://localhost:5000/v2/ || (echo "Registry not ready after 10s"; exit 1)

      - name: Load and push images to local registry
        run: |
          docker load -i /tmp/operator-test-operator.tar
          docker load -i /tmp/operator-test-registry-app.tar
          docker load -i /tmp/operator-test-gitops-sync.tar
          docker push "$REGISTRY_APP_IMAGE"
          docker push "$REGISTRY_GITOPS_SYNC_IMAGE"
          docker push "$IMAGE"

      # -Daether.syncContext.named.factory=noop: prevent Maven 3.9+ resolver lock deadlocks under -T
      # -Dfailsafe.rerunFailingTestsCount=1: retry failed tests once as a safety net for
      #   transient resource-related flakes, same as Remote Tests below.
      - name: Run ${{ matrix.name }} local tests on Minikube
        working-directory: operator
        run: |
          make BUILD_OPTS="--no-transfer-progress -Daether.syncContext.named.factory=noop -Dfailsafe.rerunFailingTestsCount=1" \
            GROUPS="${{ matrix.groups }}" \
            EXCLUDED_GROUPS="${{ matrix.excluded-groups }}" \
            test-local-group

      - name: Parse Flaky Tests
        if: always()
        run: |
          python3 .github/scripts/parse-flaky-tests.py --reports-dir . --output-file flaky-tests-operator-local-${{ matrix.name }}.json

      - name: Upload Flaky Tests Artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flaky-tests-operator-local-${{ matrix.name }}
          path: flaky-tests-operator-local-${{ matrix.name }}.json

  operator-test:
    name: Remote Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: operator-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: smoke
            groups: "smoke"
            olm-enable: "false"
            olm-v1-enable: "false"
            extra-build-opts: ""
          - name: kafka
            groups: "kafka"
            olm-enable: "false"
            olm-v1-enable: "false"
            extra-build-opts: ""
          - name: auth
            groups: "auth"
            excluded-groups: "kafka"
            olm-enable: "false"
            olm-v1-enable: "false"
            extra-build-opts: ""
          - name: database
            groups: "database"
            olm-enable: "false"
            olm-v1-enable: "false"
            extra-build-opts: ""
          - name: feature-a
            groups: "feature-a"
            excluded-groups: "feature-setup"
            olm-enable: "false"
            olm-v1-enable: "false"
            extra-build-opts: ""
          - name: feature-b
            groups: "feature-b"
            excluded-groups: "feature-setup"
            olm-enable: "false"
            olm-v1-enable: "false"
            extra-build-opts: ""
          - name: feature-setup
            groups: "feature-setup"
            olm-enable: "false"
            olm-v1-enable: "false"
            extra-build-opts: ""
          - name: olm-v1
            groups: "OLM"
            olm-enable: "true"
            olm-v1-enable: "true"
            extra-build-opts: "-Dtest.operator.olm-version=1"
          - name: olm-v0
            groups: "OLM"
            olm-enable: "true"
            olm-v1-enable: "false"
            extra-build-opts: ""
    steps:

      - name: Checkout ${{ github.ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: operator-build-artifacts
          path: operator/

      - name: Download Docker images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: operator-test-images
          path: /tmp/



      # driver=none: Kubernetes runs directly on the host, sharing all runner
      # resources (4 vCPU / 16 GB) and the host network (localhost:5000 registry).
      - uses: apicurio/apicurio-github-actions/setup-minikube@ecae58cc1a9b5eeb810b90f8a9e15d2266a371d3 # v2
        id: minikube-setup
        continue-on-error: true
        timeout-minutes: 10
        with:
          driver: 'none'
          ingress-enable: 'true'
          olm-enable: ${{ matrix.olm-enable }}
          olm-v1-enable: ${{ matrix.olm-v1-enable }}
          start-args: '--alsologtostderr --v=2'

      # medyagh/setup-minikube (invoked by the composite action) intermittently
      # fails with transient HTTP 504s while downloading; one retry absorbs it
      # instead of failing the whole job.
      - uses: apicurio/apicurio-github-actions/setup-minikube@ecae58cc1a9b5eeb810b90f8a9e15d2266a371d3 # v2
        if: steps.minikube-setup.outcome == 'failure'
        timeout-minutes: 10
        with:
          driver: 'none'
          ingress-enable: 'true'
          olm-enable: ${{ matrix.olm-enable }}
          olm-v1-enable: ${{ matrix.olm-v1-enable }}
          start-args: '--alsologtostderr --v=2'

      # Start a local registry AFTER Minikube setup. The services: block doesn't
      # survive Minikube's Docker reconfiguration with driver: none.
      - name: Start local registry
        run: |
          docker run -d -p 5000:5000 --restart=always ghcr.io/distribution/distribution:3.0
          for i in $(seq 1 20); do
            curl -sf http://localhost:5000/v2/ >/dev/null 2>&1 && break
            echo "Waiting for registry... ($i/20)"
            sleep 0.5
          done
          curl -sf http://localhost:5000/v2/ || (echo "Registry not ready after 10s"; exit 1)

      # Load pre-built images into Docker, then push to the local registry.
      # Operator/operand/gitops-sync use localhost:5000; bundle/catalog use ttl.sh.
      - name: Load and push images to local registry
        run: |
          docker load -i /tmp/operator-test-operator.tar
          docker load -i /tmp/operator-test-registry-app.tar
          docker load -i /tmp/operator-test-gitops-sync.tar
          docker push "$REGISTRY_APP_IMAGE"
          docker push "$REGISTRY_GITOPS_SYNC_IMAGE"
          docker push "$IMAGE"

      - name: Pre-pull OLM bundle and catalog images
        run: |
          # ttl.sh pulls occasionally stall for 10+ minutes mid-test (catalog pod stuck
          # Pending until the setup timeout). Pull once up front with retries; with
          # driver=none the kubelet shares the host docker image store, so pods using
          # these (non-:latest) images get IfNotPresent semantics and never pull during
          # tests.
          for img in "$BUNDLE_IMAGE" "$CATALOG_IMAGE"; do
            for i in 1 2 3; do
              docker pull "$img" && break
              echo "Pull failed for $img (attempt $i/3), retrying..."
              sleep 5
            done
            docker image inspect "$img" > /dev/null || { echo "Could not pull $img"; exit 1; }
          done

      # -Dtest.operator.timeout.long=600: extend default Awaitility timeout from 420s (7 min)
      #   to 600s (10 min) for slow Kafka/OLM startups on shared runners. This is read by
      #   ITBase.LONG_DURATION via Integer.getInteger().
      # -Dfailsafe.rerunFailingTestsCount=1: retry failed tests once as a safety net for
      #   transient resource-related flakes.
      - name: Run ${{ matrix.name }} tests on Minikube
        working-directory: operator
        run: |
          make BUILD_OPTS="--no-transfer-progress -Daether.syncContext.named.factory=noop -Dtest.operator.deployment-target=minikube -Dtest.operator.timeout.long=600 -Dfailsafe.rerunFailingTestsCount=1 ${{ matrix.extra-build-opts }}" \
            REMOTE_TESTS_ALL_INSTALL_FILE=controller/target/test-install.yaml \
            GROUPS="${{ matrix.groups }}" \
            EXCLUDED_GROUPS="${{ matrix.excluded-groups }}" \
            test-remote-group

      - name: Parse Flaky Tests
        if: always()
        run: |
          python3 .github/scripts/parse-flaky-tests.py --reports-dir . --output-file flaky-tests-operator-${{ matrix.name }}.json

      - name: Upload Flaky Tests Artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flaky-tests-operator-${{ matrix.name }}
          path: flaky-tests-operator-${{ matrix.name }}.json
          retention-days: 1


  operator-check-install:
    name: Check Install File
    runs-on: ubuntu-latest
    needs: operator-build
    steps:

      - name: Checkout ${{ github.ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Rebuild operator controller to generate the install file, then verify it matches the committed version.
      # -Dfull: include all optional modules needed for a complete operator build
      # -Daether.syncContext.named.factory=noop: prevent Maven 3.9+ resolver lock deadlocks under -T
      - name: Build for install file generation
        run: ./mvnw -s ${{ github.workspace }}/.github/ci-settings.xml -B clean package -Dfull -pl operator/controller -am -Pprod -DskipTests -Dmaven.javadoc.skip -Daether.syncContext.named.factory=noop

      - name: Update install file
        working-directory: operator
        run: |
          # We need to unset the variables to generate a clean install file.
          # See https://github.com/actions/runner/issues/1126
          unset REGISTRY_APP_IMAGE
          unset REGISTRY_GITOPS_SYNC_IMAGE
          unset IMAGE
          unset BUNDLE_IMAGE
          unset CATALOG_IMAGE
          make IMAGE_TAG=latest-snapshot INSTALL_FILE=install/install.yaml dist-install-file
          make IMAGE_TAG=latest-snapshot INSTALL_NAMESPACED_FILE=install/install-namespaced.yaml dist-install-file-namespaced

      - name: Check install file
        run: |
          git add operator/install/install.yaml operator/install/install-namespaced.yaml || true
          if ! git diff --staged --exit-code; then
            echo 'Install file needs to be updated. Please run `pushd operator; make SKIP_TESTS=true build IMAGE_TAG=latest-snapshot INSTALL_FILE=install/install.yaml dist-install-file dist-install-file-namespaced INSTALL_NAMESPACED_FILE=install/install-namespaced.yaml; popd` and commit the result.';
            exit 1;
          else
            echo "No changes to the install file.";
          fi

  operator-publish:
    name: Publish Operator
    runs-on: ubuntu-latest
    needs: [operator-test, operator-check-install]
    if: inputs.publish
    steps:

      - name: Configure env. variables
        run: |
          # We want to use latest-snapshot instead of x.y.z-snapshot
          echo "IMAGE_TAG=latest-snapshot" >> $GITHUB_ENV
          echo "BUNDLE_IMAGE_TAG=latest-snapshot" >> $GITHUB_ENV
          echo "CATALOG_IMAGE_TAG=latest-snapshot" >> $GITHUB_ENV

      - name: Checkout ${{ github.ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build
        working-directory: operator
        run: |
          unset IMAGE REGISTRY_APP_IMAGE REGISTRY_GITOPS_SYNC_IMAGE BUNDLE_IMAGE CATALOG_IMAGE
          make BUILD_OPTS="--no-transfer-progress -Daether.syncContext.named.factory=noop" SKIP_TESTS=true build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to quay.io registry
        run: |
          docker login -u "${{ secrets.QUAY_USERNAME }}" -p "${{ secrets.QUAY_PASSWORD }}" quay.io

      # TODO: Also push to DockerHub Registry
      - name: Build and publish operator image
        working-directory: operator
        run: |
          unset IMAGE REGISTRY_APP_IMAGE REGISTRY_GITOPS_SYNC_IMAGE BUNDLE_IMAGE CATALOG_IMAGE
          make image-buildx-push

      - name: Build and publish operator bundle
        working-directory: operator
        run: |
          unset IMAGE REGISTRY_APP_IMAGE REGISTRY_GITOPS_SYNC_IMAGE BUNDLE_IMAGE CATALOG_IMAGE
          make bundle

      - name: Build and publish operator catalog
        working-directory: operator
        run: |
          unset IMAGE REGISTRY_APP_IMAGE REGISTRY_GITOPS_SYNC_IMAGE BUNDLE_IMAGE CATALOG_IMAGE
          make catalog

  # Slack notification using reusable workflow
  notify-slack:
    name: Slack Notification
    needs: operator-publish
    if: always() && inputs.publish
    uses: ./.github/workflows/reusable-notify-slack.yaml
    with:
      workflow-name: ${{ github.workflow }}
      job-name: 'operator-publish'
      job-status: ${{ needs.operator-publish.result }}
    secrets:
      SLACK_NOTIFICATION_WEBHOOK: ${{ secrets.SLACK_NOTIFICATION_WEBHOOK }}
      SLACK_ERROR_WEBHOOK: ${{ secrets.SLACK_ERROR_WEBHOOK }}
