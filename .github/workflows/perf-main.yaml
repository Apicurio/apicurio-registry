name: Performance Tests (main)

# Runs performance tests against a topology that resembles a real installation: registry deployed
# via the operator, secured with Keycloak (OAuth2 client-credentials), backed by PostgreSQL, with
# a separate Kafka client (using the Avro serde) driving realistic produce/consume traffic
# alongside a Gatling-driven REST load test. See perf-tests/README.md for details.
#
# Deliberately scoped to push-to-main only (not PRs): standing up this topology (cluster, operator
# install, Keycloak, Kafka, sustained load run) is too slow/expensive to run per-PR, and the goal
# here is trend/regression detection over time, not gating individual changes.
#
# Regressions are surfaced via the job summary and a Slack notification, not as a hard failure of
# this workflow, unless the load itself fails outright (Gatling assertion / excessive Kafka
# produce failures) - see perf-tests/scripts/check-thresholds.py for the rationale.

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY_APP_IMAGE: localhost:5000/apicurio-registry:${{ github.sha }}
  OPERATOR_IMAGE: localhost:5000/apicurio-registry-3-operator:${{ github.sha }}
  PERF_TEST_IMAGE: localhost:5000/apicurio-registry-perf-tests:${{ github.sha }}

jobs:
  perf-test:
    name: Run Performance Tests
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Apicurio'
    timeout-minutes: 90
    steps:
      - name: Checkout ${{ github.ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # -Dfull: include the operator module needed for the operator image build.
      - name: Build app, operator, and perf-tests artifacts
        run: |
          ./mvnw -s ${{ github.workspace }}/.github/ci-settings.xml -B clean package -Dfull -Dperf-tests \
            -pl app,distro/docker,operator,perf-tests -am -Pprod -DskipTests -Dmaven.javadoc.skip \
            -Daether.syncContext.named.factory=noop

      - name: Build app image
        run: |
          docker build -f ./distro/docker/target/docker/Dockerfile.jvm -t "$REGISTRY_APP_IMAGE" ./distro/docker/target/docker

      - name: Build operator image
        working-directory: operator
        run: make IMAGE="$OPERATOR_IMAGE" image-build

      - name: Build perf-tests runner image
        working-directory: perf-tests
        run: docker build -t "$PERF_TEST_IMAGE" .

      - uses: apicurio/apicurio-github-actions/setup-minikube@ecae58cc1a9b5eeb810b90f8a9e15d2266a371d3 # v2
        id: minikube-setup
        continue-on-error: true
        timeout-minutes: 10
        with:
          driver: 'none'
          ingress-enable: 'false'
          olm-enable: 'false'
          olm-v1-enable: 'false'

      - uses: apicurio/apicurio-github-actions/setup-minikube@ecae58cc1a9b5eeb810b90f8a9e15d2266a371d3 # v2
        if: steps.minikube-setup.outcome == 'failure'
        timeout-minutes: 10
        with:
          driver: 'none'
          ingress-enable: 'false'
          olm-enable: 'false'
          olm-v1-enable: 'false'

      - name: Start local registry and push images
        run: |
          docker run -d -p 5000:5000 --restart=always ghcr.io/distribution/distribution:3.0
          for i in $(seq 1 20); do
            curl -sf http://localhost:5000/v2/ >/dev/null 2>&1 && break
            sleep 0.5
          done
          docker push "$REGISTRY_APP_IMAGE"
          docker push "$OPERATOR_IMAGE"
          docker push "$PERF_TEST_IMAGE"

      - name: Deploy the operator
        working-directory: operator
        run: |
          make IMAGE="$OPERATOR_IMAGE" REGISTRY_APP_IMAGE="$REGISTRY_APP_IMAGE" NAMESPACE=default deploy
          # The operator Deployment name is version-suffixed by kustomize
          # (apicurio-registry-operator-v<version>), so select by label instead of a fixed name.
          kubectl -n default wait --for=condition=Available deployment \
            -l app.kubernetes.io/name=apicurio-registry-operator --timeout=5m

      - name: Deploy PostgreSQL, Kafka, and Keycloak
        working-directory: perf-tests/k8s
        run: |
          kubectl -n default apply -f postgresql.yaml
          kubectl -n default apply -f kafka.yaml
          kubectl -n default create configmap keycloak-realm-import --from-file=realm.json=realm-import.json
          kubectl -n default apply -f keycloak.yaml
          kubectl -n default rollout status deployment/postgresql --timeout=5m
          kubectl -n default rollout status deployment/kafka --timeout=5m
          kubectl -n default rollout status deployment/keycloak --timeout=5m

      - name: Deploy the registry (ApicurioRegistry3 CR)
        working-directory: perf-tests/k8s
        run: |
          kubectl -n default apply -f registry-cr.yaml
          kubectl -n default rollout status deployment/perf-test-app-deployment --timeout=10m

      - name: Run the performance test Job
        working-directory: perf-tests/k8s
        run: |
          sed "s|\${PERF_TEST_IMAGE}|$PERF_TEST_IMAGE|" perf-job.yaml | kubectl -n default apply -f -
          kubectl -n default wait --for=condition=complete --timeout=45m job/perf-test-runner || true
          kubectl -n default logs job/perf-test-runner --tail=-1 > /tmp/perf-test-runner.log || true
          # Fail the step (and therefore the workflow) if the Job itself did not report success -
          # this is the "did the load run at all / stay under the error-rate assertion" signal.
          kubectl -n default get job perf-test-runner -o jsonpath='{.status.succeeded}' | grep -q 1

      - name: Copy results out of the cluster
        if: always()
        working-directory: perf-tests/k8s
        run: |
          POD=$(kubectl -n default get pods -l job-name=perf-test-runner -o jsonpath='{.items[0].metadata.name}')
          mkdir -p /tmp/perf-results
          kubectl -n default cp "$POD:/results" /tmp/perf-results || true
          cp /tmp/perf-test-runner.log /tmp/perf-results/ || true

      - name: Check results against baseline
        if: always()
        run: |
          STATS_FILE=$(find /tmp/perf-results -path '*/js/stats.js' | head -1)
          if [ -n "$STATS_FILE" ]; then
            python3 perf-tests/scripts/check-thresholds.py "$STATS_FILE" perf-tests/baseline.json || true
          else
            echo "No Gatling js/stats.js found under /tmp/perf-results - skipping threshold check." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload performance test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-test-results-${{ github.sha }}
          path: /tmp/perf-results
          retention-days: 90

  notify:
    name: Notify on failure
    needs: perf-test
    if: failure()
    uses: ./.github/workflows/reusable-notify-slack.yaml
    with:
      workflow-name: "Performance Tests (main)"
      job-name: "perf-test"
      job-status: "failure"
    secrets: inherit
