name: Post-Merge

# Confirms a failed Verify push run on main by re-running its failed jobs once,
# keeps a tracking issue open while main is broken, and posts the transitions
# to Slack: broken (important), green again and flakes (general). The logic is
# in .github/scripts/post-merge.js; see "Post-merge verification" in
# .github/workflows/README.md (#10380).
#
# workflow_run runs this file from the default branch, never from a PR, and the
# script checks the run is a push run of this repository's verify.yaml: the
# branches filter below also matches a PR whose head branch is called main.

on:
  workflow_run:
    workflows: ["Verify"]
    types: [completed]
    branches: [main]

# One event at a time, so two completed runs can't both find no issue and open
# one each. queue: max keeps every waiting event: with the default queue of
# one, a third event would cancel the one waiting, and its transition would be
# lost.
concurrency:
  group: post-merge
  cancel-in-progress: false
  queue: max

permissions:
  actions: write   # re-run failed jobs
  contents: read   # compare commits
  issues: write    # tracking issue

jobs:
  handle:
    name: Handle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository_owner == 'Apicurio'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/scripts

      - name: Handle
        id: handle
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const handler = require('./.github/scripts/post-merge.js');
            await handler.handle({ github, context, core });

      # Slack: see "Notifications" in .github/workflows/README.md.
      - name: Notify
        if: steps.handle.outputs.level != ''
        uses: Apicurio/apicurio-github-actions/notify-slack@7d4b3b7b40dd45ac1ad2a725eedb565063366c28 # v2.3.0
        with:
          level: ${{ steps.handle.outputs.level }}
          text: ${{ steps.handle.outputs.text }}
          link: ${{ steps.handle.outputs.link }}
          mention: ${{ steps.handle.outputs.mention }}
          user-map: ${{ secrets.SLACK_USER_MAP }}
          important-webhook: ${{ secrets.SLACK_IMPORTANT_NOTIFICATION_WEBHOOK }}
          general-webhook: ${{ secrets.SLACK_GENERAL_NOTIFICATION_WEBHOOK }}
