name: PR Lifecycle

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, labeled, unlabeled]
    branches: [main, '3.3.x']
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  workflow_run:
    # Review Relay (review-relay.yaml) is only for the review-relay job.
    workflows: ["Verify", "Quick Check", "Review Relay"]
    # requested and in_progress are only for the gate-status job, so the
    # Verification Gate goes pending as soon as a Verify run exists and again
    # when an attempt actually starts. in_progress is what catches a re-run
    # attempt and a fork run that was waiting for approval, neither of which
    # is a newly requested run. test-result handles completed only.
    types: [requested, in_progress, completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to reconcile
        required: true
        type: number
  schedule:
    - cron: '17 */6 * * *'

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pr-lifecycle-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  # ==========================================================================
  # PR Opened / Reopened
  # ==========================================================================
  pr-opened:
    name: PR Opened
    runs-on: ubuntu-latest
    if: |
      github.repository_owner == 'Apicurio' &&
      github.event_name == 'pull_request_target' &&
      (github.event.action == 'opened' || github.event.action == 'reopened') &&
      !contains(github.event.pull_request.labels.*.name, 'orchestrator/disabled')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Convert config to JSON
        run: yq -o json .github/pr-lifecycle.yml > .github/pr-lifecycle.json

      - name: Handle PR opened
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const handler = require('./.github/scripts/pr-lifecycle.js');
            await handler.handlePrOpened({ github, context, core });

  # ==========================================================================
  # PR Synchronize (new push)
  # ==========================================================================
  pr-synchronize:
    name: PR Push
    runs-on: ubuntu-latest
    if: |
      github.repository_owner == 'Apicurio' &&
      github.event_name == 'pull_request_target' &&
      github.event.action == 'synchronize' &&
      !contains(github.event.pull_request.labels.*.name, 'orchestrator/disabled')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Convert config to JSON
        run: yq -o json .github/pr-lifecycle.yml > .github/pr-lifecycle.json

      - name: Handle push
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const handler = require('./.github/scripts/pr-lifecycle.js');
            await handler.handlePrSynchronize({ github, context, core });

  # ==========================================================================
  # Draft -> Ready
  # ==========================================================================
  pr-ready-for-review:
    name: Draft to Ready
    runs-on: ubuntu-latest
    if: |
      github.repository_owner == 'Apicurio' &&
      github.event_name == 'pull_request_target' &&
      github.event.action == 'ready_for_review' &&
      !contains(github.event.pull_request.labels.*.name, 'orchestrator/disabled')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Convert config to JSON
        run: yq -o json .github/pr-lifecycle.yml > .github/pr-lifecycle.json

      - name: Handle ready for review
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const handler = require('./.github/scripts/pr-lifecycle.js');
            await handler.handlePrReadyForReview({ github, context, core });

  # ==========================================================================
  # PR Converted Back to Draft
  # ==========================================================================
  pr-converted-to-draft:
    name: Ready to Draft
    runs-on: ubuntu-latest
    if: |
      github.repository_owner == 'Apicurio' &&
      github.event_name == 'pull_request_target' &&
      github.event.action == 'converted_to_draft' &&
      !contains(github.event.pull_request.labels.*.name, 'orchestrator/disabled')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Handle converted to draft
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const handler = require('./.github/scripts/pr-lifecycle.js');
            await handler.handlePrConvertedToDraft({ github, context, core });

  # ==========================================================================
  # Review Submitted
  # ==========================================================================
  # Same-repo PRs only: pull_request_review gives GITHUB_TOKEN the same
  # restricted, secret-less, read-only token for fork PRs that pull_request
  # does. This job needs write access to update labels, so fork PR reviews are
  # left to the slower but still-correct path: the review-relay job below
  # starts the full suite once it is required, and that run's completion
  # reconciles labels via test-result. Starting the suite is also done only by
  # review-relay, for fork and same-repo PRs alike, so there is one path.
  pr-review-submitted:
    name: Review Submitted
    runs-on: ubuntu-latest
    if: |
      github.repository_owner == 'Apicurio' &&
      github.event_name == 'pull_request_review' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'orchestrator/disabled')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Convert config to JSON
        run: yq -o json .github/pr-lifecycle.yml > .github/pr-lifecycle.json

      - name: Handle review submitted
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const handler = require('./.github/scripts/pr-lifecycle.js');
            await handler.handlePrReviewSubmitted({ github, context, core });

  # ==========================================================================
  # Comment Commands
  # ==========================================================================
  command:
    name: Command
    runs-on: ubuntu-latest
    if: |
      github.repository_owner == 'Apicurio' &&
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/') &&
      !contains(github.event.issue.labels.*.name, 'orchestrator/disabled')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Convert config to JSON
        run: yq -o json .github/pr-lifecycle.yml > .github/pr-lifecycle.json

      - name: Handle command
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const handler = require('./.github/scripts/pr-lifecycle.js');
            await handler.handleComment({ github, context, core });

  # ==========================================================================
  # Label Protection
  # ==========================================================================
  label-guard:
    name: Label Guard
    runs-on: ubuntu-latest
    if: |
      github.repository_owner == 'Apicurio' &&
      github.event_name == 'pull_request_target' &&
      (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
      github.event.sender.login != 'github-actions[bot]' &&
      (startsWith(github.event.label.name, 'lifecycle/') || startsWith(github.event.label.name, 'orchestrator/'))
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Convert config to JSON
        run: yq -o json .github/pr-lifecycle.yml > .github/pr-lifecycle.json

      - name: Handle label change
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const handler = require('./.github/scripts/pr-lifecycle.js');
            await handler.handleLabelChange({ github, context, core });

  # ==========================================================================
  # Test Results (Verify workflow completed)
  # ==========================================================================
  test-result:
    name: Test Result
    runs-on: ubuntu-latest
    if: |
      github.repository_owner == 'Apicurio' &&
      github.event_name == 'workflow_run' &&
      github.event.action == 'completed' &&
      github.event.workflow_run.name != 'Review Relay'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # workflow_run handlers must NOT check out the run's head SHA: GitHub refuses
        # fork pull_request code in a workflow_run context, and the checkout fails the
        # whole orchestrator. The orchestrator's dispatch logic lives on main once
        # merged; for the rollout PR itself, the dispatch is bootstrapped manually.

      - name: Convert config to JSON
        run: yq -o json .github/pr-lifecycle.yml > .github/pr-lifecycle.json

      - name: Handle test result
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const handler = require('./.github/scripts/pr-lifecycle.js');
            await handler.handleTestResult({ github, context, core });

  # ==========================================================================
  # Verification Gate status (Verify workflow requested/in_progress/completed)
  # ==========================================================================
  # Posts the "Verification Gate" commit status (the required check) on the
  # run's head commit, from the newest Verify run for that commit. Runs in the
  # privileged workflow_run context, which is what lets it post for fork PRs;
  # so, like test-result, it never checks out or executes the run's code, and
  # handleGateStatus looks runs up by workflow file through the API instead of
  # trusting the triggering payload (a PR can add a workflow named "Verify").
  #
  # Not filtered on orchestrator/disabled: branch protection requires the
  # status on every PR.
  #
  # Serialized per commit. Each run recomputes from the current state of all
  # Verify runs for the commit, so a queued job superseded (and cancelled) by
  # a newer one for the same commit loses nothing.
  gate-status:
    name: Verification Gate Status
    runs-on: ubuntu-latest
    if: |
      github.repository_owner == 'Apicurio' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'Verify'
    concurrency:
      group: verification-gate-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # Base branch only, never the run's head SHA (see test-result).

      - name: Post Verification Gate status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const handler = require('./.github/scripts/pr-lifecycle.js');
            await handler.handleGateStatus({ github, context, core });

  # ==========================================================================
  # Review Relay (a review was submitted or dismissed)
  # ==========================================================================
  # Re-runs the PR head commit's Verify run when the review made the full
  # suite required and that run skipped it (handleReviewRelay /
  # maybeRunFullSuite). The relay workflow exists only to get the review here,
  # into a privileged context that can re-run a workflow for fork PRs too.
  # Like test-result, it never checks out or executes the triggering run's
  # code, and it takes only the commit from the event: the PR, its review
  # decision and its Verify runs are read back through the API.
  review-relay:
    name: Review Relay
    runs-on: ubuntu-latest
    if: |
      github.repository_owner == 'Apicurio' &&
      github.event_name == 'workflow_run' &&
      github.event.action == 'completed' &&
      github.event.workflow_run.name == 'Review Relay'
    # Serialized per commit, so two reviews in quick succession don't both
    # re-run the same run. Each recomputes from the current state, so a queued
    # one superseded (and cancelled) by a newer one loses nothing.
    concurrency:
      group: review-relay-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # Base branch only, never the run's head SHA (see test-result).

      - name: Convert config to JSON
        run: yq -o json .github/pr-lifecycle.yml > .github/pr-lifecycle.json

      - name: Start the full suite if now required
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const handler = require('./.github/scripts/pr-lifecycle.js');
            await handler.handleReviewRelay({ github, context, core });

  # ==========================================================================
  # Failure Notification
  # ==========================================================================
  failure-notify:
    name: Failure Notification
    runs-on: ubuntu-latest
    if: >-
      github.repository_owner == 'Apicurio' &&
      failure() &&
      github.event_name != 'schedule'
    needs: [pr-opened, pr-synchronize, pr-ready-for-review, pr-converted-to-draft, pr-review-submitted, command, label-guard, test-result, gate-status, review-relay, reconcile]
    steps:
      - name: Post warning comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { owner, repo } = context.repo;
            let prNumber = context.payload.pull_request?.number || context.payload.issue?.number;

            // For workflow_run events, resolve PR from the triggering run
            if (!prNumber && context.payload.workflow_run) {
              const run = context.payload.workflow_run;
              let prs = run.pull_requests || [];
              if (!prs.length) {
                const headOwner = run.head_repository?.owner?.login || owner;
                const { data: found } = await github.rest.pulls.list({
                  owner, repo, state: 'open',
                  head: `${headOwner}:${run.head_branch}`, per_page: 5,
                });
                prs = found.filter(p => p.head.sha === run.head_sha);
              }
              if (prs.length) prNumber = prs[0].number;
            }

            if (!prNumber) return;
            await github.rest.issues.createComment({
              owner, repo, issue_number: prNumber,
              body: `**Warning:** The PR lifecycle orchestrator encountered an error while processing ` +
                `an event for this PR. Some labels or state transitions may be incorrect.\n\n` +
                `A maintainer or the PR author can use \`/retry\` to re-run the orchestrator.`
            });

  # ==========================================================================
  # Manual Reconciliation (workflow_dispatch)
  # ==========================================================================
  reconcile:
    name: Reconcile
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Apicurio' && github.event_name == 'workflow_dispatch'
    # The workflow-level permissions plus statuses: write, to re-sync the
    # Verification Gate status (job-level permissions replace, not extend).
    permissions:
      actions: write
      contents: write
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Convert config to JSON
        run: yq -o json .github/pr-lifecycle.yml > .github/pr-lifecycle.json

      - name: Reconcile PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const handler = require('./.github/scripts/pr-lifecycle.js');
            await handler.handleReconcile({ github, context, core, prNumber: ${{ inputs.pr_number }} });

  # ==========================================================================
  # Stale Detection and Reconciliation (every 6 hours)
  # ==========================================================================
  stale:
    name: Stale Detection
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Apicurio' && github.event_name == 'schedule'
    # As reconcile: the sweep re-syncs every open PR's Verification Gate.
    permissions:
      actions: write
      contents: write
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Convert config to JSON
        run: yq -o json .github/pr-lifecycle.yml > .github/pr-lifecycle.json

      - name: Check for stale PRs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const handler = require('./.github/scripts/pr-lifecycle.js');
            await handler.handleStale({ github, context, core });
