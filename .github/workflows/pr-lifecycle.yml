name: PR Lifecycle

# Background PR and issue automation: comment commands, workflow_run handlers
# (test results, Verification Gate status, review relay), issue classification
# and PR revalidation on issue edits, manual reconciliation, and stale sweeps.
#
# None of the triggers here are pull_request / pull_request_target /
# pull_request_review, so none of these jobs appear as skipped checks on PRs.
# PR-event triggers live in pr-lifecycle-events.yml (a single dispatcher job).

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, edited, milestoned, demilestoned, closed, reopened]
  workflow_run:
    # Review Relay (review-relay.yaml) is only for the review-relay job.
    workflows: ["Verify", "Quick Check", "Review Relay"]
    # requested and in_progress are only for the gate-status job, so the
    # Verification Gate goes pending as soon as a Verify run exists and again
    # when an attempt actually starts. in_progress is what catches a re-run
    # attempt and a fork run that was waiting for approval, neither of which
    # is a newly requested run. test-result handles completed only.
    types: [requested, in_progress, completed]
  workflow_dispatch:
    inputs:
      # Typed as string rather than number so "not supplied" is unambiguously
      # the empty string (and callers like docs-auto-approve.js pass strings).
      pr_number:
        description: PR number to reconcile (leave empty when classifying an issue)
        required: false
        default: ''
        type: string
      issue:
        description: Issue number to classify (leave empty when reconciling a PR)
        required: false
        default: ''
        type: string
      dry_run:
        description: Print classification scores without applying labels (only for issue)
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  # ==========================================================================
  # Comment Commands
  # ==========================================================================
  command:
    name: Command
    runs-on: ubuntu-latest
    if: |
      github.repository_owner == 'Apicurio' &&
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/') &&
      !contains(github.event.issue.labels.*.name, 'orchestrator/disabled')
    concurrency:
      group: pr-lifecycle-pr-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Convert config to JSON
        run: yq -o json .github/pr-lifecycle.yml > .github/pr-lifecycle.json

      - name: Handle command
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const handler = require('./.github/scripts/pr-lifecycle.js');
            await handler.handleComment({ github, context, core });

  # ==========================================================================
  # Test Results (Verify / Quick Check completed)
  # ==========================================================================
  test-result:
    name: Test Result
    runs-on: ubuntu-latest
    if: |
      github.repository_owner == 'Apicurio' &&
      github.event_name == 'workflow_run' &&
      github.event.action == 'completed' &&
      github.event.workflow_run.name != 'Review Relay'
    concurrency:
      group: pr-lifecycle-test-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # workflow_run handlers must NOT check out the run's head SHA: GitHub refuses
        # fork pull_request code in a workflow_run context, and the checkout fails the
        # whole orchestrator.

      - name: Convert config to JSON
        run: yq -o json .github/pr-lifecycle.yml > .github/pr-lifecycle.json

      - name: Handle test result
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const handler = require('./.github/scripts/pr-lifecycle.js');
            await handler.handleTestResult({ github, context, core });

  # ==========================================================================
  # Verification Gate status (Verify workflow requested/in_progress/completed)
  # ==========================================================================
  # Posts the "Verification Gate" commit status (the required check) on the
  # run's head commit, from the newest Verify run for that commit. Runs in the
  # privileged workflow_run context, which is what lets it post for fork PRs;
  # so, like test-result, it never checks out or executes the run's code, and
  # handleGateStatus looks runs up by workflow file through the API instead of
  # trusting the triggering payload (a PR can add a workflow named "Verify").
  #
  # Not filtered on orchestrator/disabled: branch protection requires the
  # status on every PR.
  gate-status:
    name: Sync Gate Status
    runs-on: ubuntu-latest
    if: |
      github.repository_owner == 'Apicurio' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'Verify'
    concurrency:
      group: verification-gate-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # Base branch only, never the run's head SHA (see test-result).

      - name: Post Verification Gate status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const handler = require('./.github/scripts/pr-lifecycle.js');
            await handler.handleGateStatus({ github, context, core });

  # ==========================================================================
  # Review Relay (a review was submitted or dismissed)
  # ==========================================================================
  # Re-runs the PR head commit's Verify run when the review made the full
  # suite required and that run skipped it (handleReviewRelay /
  # maybeRunFullSuite), and reconciles lifecycle display labels for both fork
  # and same-repo PRs. The relay workflow exists to bring the review into a
  # privileged workflow_run context where GITHUB_TOKEN can re-run workflows and
  # update labels on fork PRs too.
  review-relay:
    name: Review Relay
    runs-on: ubuntu-latest
    if: |
      github.repository_owner == 'Apicurio' &&
      github.event_name == 'workflow_run' &&
      github.event.action == 'completed' &&
      github.event.workflow_run.name == 'Review Relay'
    concurrency:
      group: review-relay-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # Base branch only, never the run's head SHA (see test-result).

      - name: Convert config to JSON
        run: yq -o json .github/pr-lifecycle.yml > .github/pr-lifecycle.json

      - name: Start the full suite if now required and reconcile labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const handler = require('./.github/scripts/pr-lifecycle.js');
            await handler.handleReviewRelay({ github, context, core });

  # ==========================================================================
  # Issue Classification (opened/edited or manual dispatch)
  # ==========================================================================
  classify-issue:
    name: Classify Issue
    runs-on: ubuntu-latest
    if: |
      github.repository_owner == 'Apicurio' &&
      ((github.event_name == 'issues' && (github.event.action == 'opened' || github.event.action == 'edited')) ||
       (github.event_name == 'workflow_dispatch' && inputs.issue != ''))
    concurrency:
      group: classify-issue-${{ github.event.issue.number || inputs.issue }}
      cancel-in-progress: true
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up classifier
        uses: ./.github/actions/setup-classifier

      - name: Classify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || inputs.issue }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          case "$NUMBER" in
            ''|*[!0-9]*) echo "::error::Issue number must be digits, got '$NUMBER'."; exit 1 ;;
          esac
          args=(--repo "$REPO" --issue "$NUMBER")
          if [ "${DRY_RUN:-}" = "true" ]; then args+=(--dry-run); fi
          python .github/scripts/label-classification/classify.py "${args[@]}"

  # ==========================================================================
  # Revalidate PRs Closing an Issue (milestone/state changed on an issue)
  # ==========================================================================
  # PR Validation checks every open issue a PR closes; setting that issue's
  # milestone or closing/reopening it is an issues event, so this re-runs
  # pr-validation.yml for each open PR closing the issue.
  revalidate:
    name: Revalidate PRs closing the issue
    runs-on: ubuntu-latest
    if: |
      github.repository_owner == 'Apicurio' &&
      github.event_name == 'issues' &&
      (github.event.action == 'milestoned' || github.event.action == 'demilestoned' ||
       github.event.action == 'closed' || github.event.action == 'reopened')
    concurrency:
      group: pr-validation-issue-${{ github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      actions: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Convert config to JSON
        run: yq -o json .github/pr-lifecycle.yml > .github/pr-lifecycle.json

      - name: Re-run validation for PRs closing this issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const handler = require('./.github/scripts/pr-validation.js');
            await handler.revalidateForIssue({ github, context, core });

  # ==========================================================================
  # Manual Reconciliation (workflow_dispatch)
  # ==========================================================================
  reconcile:
    name: Reconcile
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Apicurio' && github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
    concurrency:
      group: pr-lifecycle-pr-${{ inputs.pr_number }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Convert config to JSON
        run: yq -o json .github/pr-lifecycle.yml > .github/pr-lifecycle.json

      - name: Reconcile PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed(`PR number must be a positive integer, got '${process.env.PR_NUMBER}'.`);
              return;
            }
            const handler = require('./.github/scripts/pr-lifecycle.js');
            await handler.handleReconcile({ github, context, core, prNumber });

  # ==========================================================================
  # Failure Notification
  # ==========================================================================
  failure-notify:
    name: Failure Notification
    runs-on: ubuntu-latest
    if: >-
      github.repository_owner == 'Apicurio' &&
      failure() &&
      github.event_name != 'schedule' &&
      github.event_name != 'issues'
    needs: [command, test-result, gate-status, review-relay, reconcile]
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Post warning comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const { owner, repo } = context.repo;
            let prNumber = context.payload.issue?.number || Number(process.env.INPUT_PR_NUMBER) || null;

            // For workflow_run events, resolve PR from the triggering run
            if (!prNumber && context.payload.workflow_run) {
              const run = context.payload.workflow_run;
              let prs = run.pull_requests || [];
              if (!prs.length) {
                const headOwner = run.head_repository?.owner?.login || owner;
                const { data: found } = await github.rest.pulls.list({
                  owner, repo, state: 'open',
                  head: `${headOwner}:${run.head_branch}`, per_page: 5,
                });
                prs = found.filter(p => p.head.sha === run.head_sha);
              }
              if (prs.length) prNumber = prs[0].number;
            }

            if (!prNumber) return;
            await github.rest.issues.createComment({
              owner, repo, issue_number: prNumber,
              body: `**Warning:** The PR lifecycle orchestrator encountered an error while processing ` +
                `an event for this PR. Some labels or state transitions may be incorrect.\n\n` +
                `A maintainer or the PR author can use \`/retry\` to re-run the orchestrator.`
            });

  # ==========================================================================
  # Stale Detection and Reconciliation (every 6 hours)
  # ==========================================================================
  stale:
    name: Stale Detection
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Apicurio' && github.event_name == 'schedule'
    concurrency:
      group: pr-lifecycle-stale
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Convert config to JSON
        run: yq -o json .github/pr-lifecycle.yml > .github/pr-lifecycle.json

      - name: Check for stale PRs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const handler = require('./.github/scripts/pr-lifecycle.js');
            await handler.handleStale({ github, context, core });
