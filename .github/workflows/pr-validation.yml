name: PR Validation

# Validates submission quality (issue link, DCO sign-off, milestone) and flags
# duplicate PRs. Independent of the lifecycle state machine: this runs on every
# PR regardless of lifecycle state.
#
# pull_request_target rather than pull_request: the job has to add a label and
# post a comment, and a pull_request run from a fork gets a read-only token, so
# both would fail for exactly the contributors this is meant to help. The usual
# pull_request_target hazard is executing PR code with a write token; the
# checkout step below avoids that by never fetching the PR head.

on:
  pull_request_target:
    # milestoned/demilestoned matter because the milestone check is the one
    # blocking check the PR author cannot clear: without them the check would
    # stay red until an unrelated push after a maintainer sets the milestone.
    types: [opened, reopened, synchronize, edited, milestoned, demilestoned]
    branches: [main, '3.3.x']
  # The milestone check also covers every open issue a PR closes, and setting
  # that issue's milestone is an issues event, not a PR event: without this the
  # PR stayed red until an unrelated push. closed/reopened because only open
  # issues are checked. The revalidate job re-runs the validation of each open
  # PR that closes the issue.
  issues:
    types: [milestoned, demilestoned, closed, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  # Issue events have no PR number; without their own group they would all
  # share one and cancel each other.
  group: pr-validation-${{ github.event.pull_request.number || format('issue-{0}', github.event.issue.number) }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Apicurio' && github.event_name == 'pull_request_target'
    steps:
      # The default branch's current head, never the PR head. Not the event's
      # own commit (the default when no ref is given): a re-run replays the
      # original event, and re-runs are how a milestone set on a linked issue,
      # or /retry, reaches this check (revalidateForIssue). Each should run
      # the validator as it is now, not as it was when the PR last changed.
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0

      - name: Run unit tests
        run: node --test .github/scripts/pr-validation.test.js

      - name: Convert config to JSON
        run: yq -o json .github/pr-lifecycle.yml > .github/pr-lifecycle.json

      - name: Run validation checks
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const handler = require('./.github/scripts/pr-validation.js');
            await handler.validate({ github, context, core });

  # A separate job, so an issue event doesn't create a "Validate PR" check on
  # the default branch's head commit. Like validate, it never checks out or
  # runs PR code.
  revalidate:
    name: Revalidate PRs closing the issue
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Apicurio' && github.event_name == 'issues'
    permissions:
      contents: read
      actions: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Convert config to JSON
        run: yq -o json .github/pr-lifecycle.yml > .github/pr-lifecycle.json

      - name: Re-run validation for PRs closing this issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const handler = require('./.github/scripts/pr-validation.js');
            await handler.revalidateForIssue({ github, context, core });
