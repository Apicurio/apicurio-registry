name: Publish Documentation
on:
  workflow_dispatch: {}
  push:
    paths:
      - 'docs/**'
    branches: [main, '3.3.x']

permissions:
  contents: read

jobs:
  publish-docs:
    if: github.repository_owner == 'Apicurio'
    runs-on: ubuntu-latest
    steps:

      - name: Apicurio Website Checkout
        run: |
          mkdir website
          cd website
          git init
          git config --global user.name "apicurio-ci"
          git config --global user.email "apicurio.ci@gmail.com"
          git remote add origin "https://apicurio-ci:${{ secrets.ACCESS_TOKEN }}@github.com/Apicurio/apicurio.github.io.git"
          git fetch
          git checkout main
          git branch --set-upstream-to=origin/main
          git pull

      - name: Apicurio Registry Checkout
        run: |
          mkdir registry
          cd registry
          git init
          git config --global user.name "apicurio-ci"
          git config --global user.email "apicurio.ci@gmail.com"
          git remote add origin "https://apicurio-ci:${{ secrets.ACCESS_TOKEN }}@github.com/Apicurio/apicurio-registry.git"
          git fetch
          git checkout ${{ github.ref_name }}
          git branch --set-upstream-to=origin/${{ github.ref_name }}
          git pull

      - name: Generate Documentation
        run: |
          cd registry/docs-playbook
          ./_build-all.sh

      - name: Copy Documentation to Website
        run: |
          rm -rf website/registry/docs
          cp -rf registry/docs-playbook/target/dist website/registry/docs

      - name: Commit Documentation to Website
        run: |
          cd website
          git add .
          git commit -m "Automated Publishing of Documentation for Apicurio Registry"
          git pull origin main
          git push

      # Slack: see "Notifications" in .github/workflows/README.md.
      - name: Notify failure
        if: failure()
        uses: Apicurio/apicurio-github-actions/notify-slack@7d4b3b7b40dd45ac1ad2a725eedb565063366c28 # v2.3.0
        with:
          level: important
          text: ":x: ${{ github.workflow }} failed for ${{ github.ref_name }}"
          link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          mention: ${{ github.triggering_actor }}
          user-map: ${{ secrets.SLACK_USER_MAP }}
          important-webhook: ${{ secrets.SLACK_IMPORTANT_NOTIFICATION_WEBHOOK }}
