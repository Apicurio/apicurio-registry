name: Quick Check

# The PR-iteration fast gate, split out of ci.yaml so it is a workflow of its own
# (distinct from CI's full unit tier) — same event coverage as ci.yaml/verify.yaml.
#
# Two things happen here:
#   1. Quick Verify — the fast gate (<= 5 min) on every PR push. See the job
#      below for its philosophy and budget.
#   2. The real Build (Java app + Docker images) — gated by Decide the same way
#      as before, at lifecycle/ready-to-merge and on pushes to main. This is now
#      the SOLE build for a given SHA: ci.yaml's Unit Tests/SDK/CLI Verification,
#      integration-tests.yaml and extras.yaml all wait for this job's run (see
#      verify-await-build.yaml) and download its artifacts/Docker images via a
#      cross-run actions/download-artifact instead of each rebuilding the same
#      commit from scratch.
#
# Merge gating: the Verification Gate in verify.yaml waits for this workflow's run
# on the same SHA; the orchestrator (pr-lifecycle) aggregates all full-suite
# workflows before applying lifecycle/full-verified.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  decide:
    name: Decide
    uses: ./.github/workflows/verify-decide.yaml

  # ==========================================================================
  # QUICK VERIFY: the fast PR gate. Target: <= 5 minutes.
  #
  # Philosophy: PR iteration (opened / synchronize / draft pushes) gets ONE job
  # that answers "does it compile and do the core smoke tests pass".
  #
  # What this job deliberately does NOT do:
  #   - no docker image builds or loads (the Build job alone costs ~5 min)
  #   - no testcontainers / minikube / keycloak
  #   - no matrix, no sharding, no artifact upload/download between jobs
  #   - no javadoc/source/assembly/checkstyle (the -Dlocal tier skips them)
  #
  # What it DOES do:
  #   1. repo file lint (~10 s)
  #   2. full compile of the local tier incl. test sources (~2-3 min with warm cache)
  #   3. all non-app unit tests (plain JUnit, no Quarkus boot) (~1 min)
  #   4. a curated app smoke set: profile-free @QuarkusTest classes that share a
  #      single Quarkus boot (in-memory storage, random port) (~1 min)
  #
  # If this job exceeds its budget the lever is the smoke list below, not new jobs.
  # ==========================================================================
  quick-verify:
    name: Quick Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PR iteration only: not on push (the Build job below covers main), and not
    # on label events (the synchronize/opened run on the same SHA already ran it).
    if: github.event_name == 'pull_request' && github.event.action != 'labeled'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Restore Maven cache
        uses: ./.github/actions/setup-maven-cache

      - name: Lint files
        run: ./scripts/validate-files.sh

      - name: Build (local tier, tests compiled but not run)
        run: |
          # -Dlocal skips javadoc, source JARs, checkstyle and assembly.
          # -DskipTests still compiles test sources, so a PR that breaks test
          # compilation fails here.
          ./mvnw install -Dlocal -DskipTests --no-transfer-progress \
            -s ${{ github.workspace }}/.github/ci-settings.xml \
            -DskipCommitIdPlugin=true \
            -Daether.syncContext.named.factory=noop \
            -Dmaven.wagon.httpconnectionManager.maxTotal=30 \
            -Dmaven.wagon.http.retryHandler.count=5

      - name: Non-app unit tests
        run: |
          # Plain JUnit modules (schema-utils, serdes, SDKs, common): no Quarkus
          # boot, no containers. -Dlocal already excludes distro/docs from the
          # reactor, so only app needs excluding here.
          #
          # utils/protobuf-schema-utilities is excluded: FileDescriptorUtilsTest
          # fails in fresh environments (missing google well-known .proto
          # resources) — a pre-existing issue on main, tracked separately.
          ./mvnw test --no-transfer-progress \
            -s ${{ github.workspace }}/.github/ci-settings.xml \
            -Dlocal -pl '!app,!utils/protobuf-schema-utilities' \
            -DskipCommitIdPlugin=true \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Daether.syncContext.named.factory=noop

      - name: App smoke tests
        run: |
          # Curated smoke set. Every class here is free of @TestProfile and
          # @QuarkusTestResource, so the whole list boots Quarkus exactly once.
          # When adding a class, verify it stays profile-free:
          #   grep -L "@TestProfile\|QuarkusTestResource" <file>
          ./mvnw surefire:test --no-transfer-progress \
            -s ${{ github.workspace }}/.github/ci-settings.xml \
            -Pprod -pl app \
            -Dtest='io.apicurio.registry.noprofile.rest.v3.BranchesTest,io.apicurio.registry.noprofile.rest.v3.ContentResourceTest,io.apicurio.registry.noprofile.rest.v3.SearchArtifactsTest,io.apicurio.registry.noprofile.rest.v3.ImportExportTest,io.apicurio.registry.noprofile.rest.v3.SystemResourceTest,io.apicurio.registry.noprofile.ArtifactTypeTest' \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Daether.syncContext.named.factory=noop

  # Fast UI build for PR iteration: install, lint, test, build — no docker image.
  # Runs on every PR push alongside Quick Verify so UI breakage is caught early.
  # The full UI build (with the docker image) runs in the Build job below at
  # ready-to-merge.
  build-ui-fast:
    name: Build UI (fast)
    # PR iteration only: not on push (the Build job below covers main), not on
    # label events (the synchronize/opened run on the same SHA already ran it).
    # verify-build.yaml's build-ui-fast has no needs and always runs when called.
    if: github.event_name == 'pull_request' && github.event.action != 'labeled'
    uses: ./.github/workflows/verify-build.yaml
    with:
      fast: true

  # The one real Build for this SHA: Java app + Docker images (app, UI). Every
  # other top-level workflow that needs them (ci.yaml's Unit Tests/SDK/CLI
  # Verification, integration-tests.yaml, extras.yaml) waits for this job's run
  # (verify-await-build.yaml) and downloads its artifacts across runs instead of
  # rebuilding.
  build:
    name: Build
    needs: [decide]
    if: needs.decide.outputs.run-build == 'true'
    uses: ./.github/workflows/verify-build.yaml

  # Terminal gate so this workflow has a single check summarizing its jobs.
  gate:
    name: Quick Check Gate
    if: always()
    needs: [decide, quick-verify, build-ui-fast, build]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate gate
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Job results: $RESULTS"
          FAILED=$(echo "$RESULTS" | jq '[.[] | select(. != "success" and . != "skipped")] | length')
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::One or more Quick Check jobs failed or were cancelled"
            exit 1
          fi
          echo "All checks passed"
