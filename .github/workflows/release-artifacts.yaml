name: Release Artifacts (Maven, SBOMs, Site, NPM Builtins)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name'
        required: true
      artifacts:
        description: 'Artifacts to release (comma-separated: maven,sboms,site,all)'
        required: true
        default: 'all'
  release:
    types: [released]

permissions:
  id-token: write
  contents: read

# Serialize runs for a given release so a re-trigger of the same version cannot
# race itself when pushing to the shared apicurio-sboms and apicurio.github.io
# repos. Races *between* different versions are handled by the rebase-and-retry
# push in the publishing steps, since those runs land in different groups.
concurrency:
  group: release-artifacts-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ github.event.release.name }}
  BRANCH: ${{ github.event.release.target_commitish }}

jobs:
  # Prepare release details
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Apicurio' && (github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, '3.'))
    outputs:
      release-version: ${{ steps.version.outputs.version }}
      release-maven: ${{ steps.artifacts.outputs.maven }}
      release-sboms: ${{ steps.artifacts.outputs.sboms }}
      release-site: ${{ steps.artifacts.outputs.site }}
    steps:
      - name: Fetch Release Details
        if: github.event_name == 'workflow_dispatch'
        run: |
          touch release.json && curl https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${{ github.event.inputs.tag }} > release.json
          echo "RELEASE_VERSION=$(cat release.json | jq -r '.name')" >> $GITHUB_ENV
          echo "BRANCH=$(cat release.json | jq -r '.target_commitish')" >> $GITHUB_ENV

      - name: Set version output
        id: version
        run: echo "version=${{ env.RELEASE_VERSION }}" >> $GITHUB_OUTPUT

      - name: Determine artifacts to release
        id: artifacts
        run: |
          ARTIFACTS="${{ github.event.inputs.artifacts || 'all' }}"
          if [[ "$ARTIFACTS" == "all" ]] || [[ "$ARTIFACTS" == *"maven"* ]]; then
            echo "maven=true" >> $GITHUB_OUTPUT
          else
            echo "maven=false" >> $GITHUB_OUTPUT
          fi
          if [[ "$ARTIFACTS" == "all" ]] || [[ "$ARTIFACTS" == *"sboms"* ]]; then
            echo "sboms=true" >> $GITHUB_OUTPUT
          else
            echo "sboms=false" >> $GITHUB_OUTPUT
          fi
          if [[ "$ARTIFACTS" == "all" ]] || [[ "$ARTIFACTS" == *"site"* ]]; then
            echo "site=true" >> $GITHUB_OUTPUT
          else
            echo "site=false" >> $GITHUB_OUTPUT
          fi

  # Maven Central Release
  release-maven:
    name: Release Maven Artifacts
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.release-maven == 'true'
    timeout-minutes: 90
    env:
      MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - name: Download Source Code
        run: |
          git config --global user.name "apicurio-ci"
          git config --global user.email "apicurio.ci@gmail.com"
          git clone --branch ${{ needs.prepare.outputs.release-version }} --single-branch https://apicurio-ci:${{ secrets.ACCESS_TOKEN }}@github.com/Apicurio/apicurio-registry.git registry

      # Backward compatibility: ci-settings.xml was added after 3.3.1 (#8556) and may not
      # exist in older release tags. Remove this guard once all supported tags include the file.
      - name: Resolve Maven settings
        run: |
          SETTINGS_FILE="${{ github.workspace }}/registry/.github/ci-settings.xml"
          if [ -f "$SETTINGS_FILE" ]; then
            echo "MVN_SETTINGS=-s $SETTINGS_FILE" >> $GITHUB_ENV
          else
            echo "MVN_SETTINGS=" >> $GITHUB_ENV
          fi

      - name: Verify Project Version
        run: |
          cd registry
          PROJECT_VERSION=$(mvn $MVN_SETTINGS help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [[ $PROJECT_VERSION != ${{ needs.prepare.outputs.release-version }} ]]; then
            echo "ERROR: Project Version '${PROJECT_VERSION}' does not match"
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up settings.xml
        run: |
          mkdir -p /home/runner/.m2
          chmod 755 /home/runner/.m2
          echo "<settings><servers><server><id>central</id><username>${{ secrets.CENTRAL_USERNAME }}</username><password>${{ secrets.CENTRAL_TOKEN }}</password></server></servers><profiles><profile><id>central</id><activation><activeByDefault>true</activeByDefault></activation><properties><gpg.executable>gpg</gpg.executable></properties></profile></profiles></settings>" > /home/runner/.m2/settings.xml

      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Download macOS and Windows CLI ZIPs from GitHub Release
        working-directory: registry
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          RELEASE_VERSION=${{ needs.prepare.outputs.release-version }}
          gh release download "${RELEASE_VERSION}" \
            --pattern "apicurio-registry-cli-${RELEASE_VERSION}-osx-aarch_64.zip" \
            --dir cli/target/
          gh release download "${RELEASE_VERSION}" \
            --pattern "apicurio-registry-cli-${RELEASE_VERSION}-windows-x86_64.zip" \
            --dir cli/target/

      - name: Maven Deploy
        working-directory: registry
        run: |
          mvn -B --settings /home/runner/.m2/settings.xml deploy -T 1 \
            -Pprod -Prelease -Dfull -DskipTests -DcliAttachArtifacts

  # SBOMs Generation
  release-sboms:
    name: Release SBOMs
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.release-sboms == 'true'
    # Raised from 30: the Maven install now covers cli, mcp and operator/controller in
    # addition to app (48 -> 53 reactor modules), and the operator pulls the
    # operator-sdk and Fabric8 trees on a cold CI cache.
    timeout-minutes: 45
    steps:
      - name: Download Source Code
        run: |
          git config --global user.name "apicurio-ci"
          git config --global user.email "apicurio.ci@gmail.com"
          git clone --branch ${{ needs.prepare.outputs.release-version }} --single-branch https://apicurio-ci:${{ secrets.ACCESS_TOKEN }}@github.com/Apicurio/apicurio-registry.git registry

      # Backward compatibility: ci-settings.xml was added after 3.3.1 (#8556) and may not
      # exist in older release tags. Remove this guard once all supported tags include the file.
      - name: Resolve Maven settings
        run: |
          SETTINGS_FILE="${{ github.workspace }}/registry/.github/ci-settings.xml"
          if [ -f "$SETTINGS_FILE" ]; then
            echo "MVN_SETTINGS=-s $SETTINGS_FILE" >> $GITHUB_ENV
          else
            echo "MVN_SETTINGS=" >> $GITHUB_ENV
          fi

      - name: Checkout SBOMs Repo
        run: |
          git clone --branch main --single-branch https://apicurio-ci:${{ secrets.ACCESS_TOKEN }}@github.com/Apicurio/apicurio-sboms.git sboms
          cd sboms
          echo "SBOM_OUTPUT_DIR=$(pwd)/apicurio-registry/${{ needs.prepare.outputs.release-version }}" >> $GITHUB_ENV

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.2

      # `-Dfull` is required because the `mcp` and `operator` modules exist only in that
      # profile (see the `full` profile in the root pom.xml); `-pl ... -am` still limits
      # the build to the selected modules and their upstream dependencies, so the other
      # full-only modules are not built. `-Dquarkus.native.enabled=false` overrides the
      # property set in cli/pom.xml so the CLI builds as a plain JVM module here instead
      # of invoking a GraalVM native build, which this job neither needs nor has.
      - name: Maven Install
        run: |
          cd registry
          mvn $MVN_SETTINGS install -pl app,cli,mcp,operator/controller -am -Pprod -Dfull -DskipTests \
            -Dquarkus.native.enabled=false -Dmaven.javadoc.skip=true --no-transfer-progress

      # One tree per shipped component, each generated from its own module POM so it
      # reflects that module's own dependency resolution. The operator targets
      # `operator/controller` (what the operator image runs) rather than the aggregator
      # POM: the controller's runtime tree already includes `operator/model`
      # transitively, and a single `dependency:tree -DoutputFile=...` over an aggregator
      # has each module overwrite the previous one. `olm-tests` is test-only, so it is
      # deliberately excluded.
      - name: Generate Maven SBOMs
        run: |
          mkdir -p $SBOM_OUTPUT_DIR
          cd registry
          VERSION="${{ needs.prepare.outputs.release-version }}"

          generate_sbom() {
            POM="$1"
            OUT="$SBOM_OUTPUT_DIR/apicurio-registry-$2-$VERSION.runtime.sbom.dot"
            mvn $MVN_SETTINGS -f "$POM" dependency:tree -DoutputType=dot -Dscope=runtime \
              -DoutputFile="$OUT" --no-transfer-progress
            # dependency:tree can exit 0 having written nothing useful, so confirm the
            # output is a real graph before it reaches the publishing step.
            if [ ! -s "$OUT" ] || ! grep -q '^digraph' "$OUT"; then
              echo "ERROR: $OUT is missing, empty, or not a Graphviz digraph."
              exit 1
            fi
            echo "Generated $(basename "$OUT") ($(wc -c < "$OUT") bytes)"
          }

          generate_sbom app/pom.xml                   app
          generate_sbom cli/pom.xml                   cli
          generate_sbom mcp/pom.xml                   mcp-server
          generate_sbom operator/controller/pom.xml   operator

      - name: Generate npm SBOMs
        run: |
          cd registry/ui
          npm install

          # The clone is pristine, so any lockfile modified by the install above was
          # resolved outside its committed pins, meaning the SBOM below describes a
          # tree that may differ from the one the released images were built from.
          # Surfaced as a warning rather than a failure so it cannot block a release.
          DRIFT=$(git -C "${{ github.workspace }}/registry" status --porcelain | grep 'package-lock\.json' || true)
          if [ -n "$DRIFT" ]; then
            echo "::warning::npm install modified package-lock.json files; the generated npm SBOMs may not match the committed dependency pins."
            echo "$DRIFT"
          fi

          VERSION="${{ needs.prepare.outputs.release-version }}"
          for dir in ui-app ui-docs ui-editors; do
            OUT="$SBOM_OUTPUT_DIR/apicurio-registry-$dir-$VERSION.sbom.npm"
            # `npm ls` exits non-zero on any tree problem (ELSPROBLEMS - e.g. an unmet
            # peer dep) while still writing a complete tree to stdout, so the exit code
            # is deliberately ignored and the output is validated instead. `--all`
            # replaces the arbitrary `-depth 10` cap, which silently truncated anything
            # deeper; `--omit=dev` replaces the deprecated `-prod`.
            ( cd "$dir" && npm ls --omit=dev --all --json ) > "$OUT" || true
            if ! jq -e . "$OUT" > /dev/null 2>&1; then
              echo "ERROR: $OUT is missing or is not valid JSON."
              exit 1
            fi
          done

      - name: Commit SBOMs to Repo
        run: |
          cd sboms
          git add .

          # Re-running the workflow for a version whose SBOMs are unchanged leaves
          # nothing staged, and `git commit` treats that as an error. Exit cleanly
          # instead of failing the job.
          if git diff --cached --quiet; then
            echo "No SBOM changes to commit for ${{ needs.prepare.outputs.release-version }}; nothing to push."
            exit 0
          fi

          git commit -m "Generated SBOMs for release ${{ needs.prepare.outputs.release-version }}"

          # A concurrent release may have pushed to the same repo since it was cloned,
          # which would reject this push as a non-fast-forward. Rebase and retry.
          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              echo "Pushed SBOMs on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto origin/main and retrying."
            git pull --rebase origin main
          done

          echo "ERROR: failed to push SBOMs after 5 attempts."
          exit 1

  # Maven Site Generation
  release-site:
    name: Release Maven Site
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.release-site == 'true'
    timeout-minutes: 30
    steps:
      - name: Download Source Code
        run: |
          git config --global user.name "apicurio-ci"
          git config --global user.email "apicurio.ci@gmail.com"
          git clone --branch ${{ needs.prepare.outputs.release-version }} --single-branch https://apicurio-ci:${{ secrets.ACCESS_TOKEN }}@github.com/Apicurio/apicurio-registry.git registry

      # Backward compatibility: ci-settings.xml was added after 3.3.1 (#8556) and may not
      # exist in older release tags. Remove this guard once all supported tags include the file.
      - name: Resolve Maven settings
        run: |
          SETTINGS_FILE="${{ github.workspace }}/registry/.github/ci-settings.xml"
          if [ -f "$SETTINGS_FILE" ]; then
            echo "MVN_SETTINGS=-s $SETTINGS_FILE" >> $GITHUB_ENV
          else
            echo "MVN_SETTINGS=" >> $GITHUB_ENV
          fi

      - name: Verify Project Version
        run: |
          cd registry
          PROJECT_VERSION=$(mvn $MVN_SETTINGS help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [[ $PROJECT_VERSION != ${{ needs.prepare.outputs.release-version }} ]]; then
            echo "ERROR: Project Version '${PROJECT_VERSION}' does not match"
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Generate Maven Site
        run: |
          cd registry
          mvn $MVN_SETTINGS clean install -pl utils/maven-plugin -am -DskipTests -Dmaven.javadoc.skip=true --no-transfer-progress
          cd utils/maven-plugin
          mvn $MVN_SETTINGS site --no-transfer-progress

      - name: Apicurio Website Checkout
        run: |
          mkdir website
          cd website
          git init
          git config --global user.name "apicurio-ci"
          git config --global user.email "apicurio.ci@gmail.com"
          git remote add origin "https://apicurio-ci:${{ secrets.ACCESS_TOKEN }}@github.com/Apicurio/apicurio.github.io.git"
          git fetch
          git checkout main
          git branch --set-upstream-to=origin/main
          git pull

      - name: Copy Maven Site to Website
        run: |
          mkdir -p website/registry/maven-plugin/${{ needs.prepare.outputs.release-version }}
          cp -rf registry/utils/maven-plugin/target/site/* website/registry/maven-plugin/${{ needs.prepare.outputs.release-version }}

      - name: Commit Maven Site to Website
        run: |
          cd website
          git add .
          git commit -m "Automated Publishing of Maven Site for release ${{ needs.prepare.outputs.release-version }}"
          git pull origin main
          git push

  # Slack: see "Notifications" in .github/workflows/README.md.
  notify:
    name: Notify
    needs: [prepare, release-maven, release-sboms, release-site]
    if: "!cancelled() && github.repository_owner == 'Apicurio'"
    permissions:
      actions: read
    uses: ./.github/workflows/reusable-notify.yaml
    with:
      results: ${{ toJSON(needs) }}
      version: ${{ github.event.release.tag_name || inputs.tag }}
    secrets:
      SLACK_USER_MAP: ${{ secrets.SLACK_USER_MAP }}
      SLACK_IMPORTANT_NOTIFICATION_WEBHOOK: ${{ secrets.SLACK_IMPORTANT_NOTIFICATION_WEBHOOK }}
      SLACK_GENERAL_NOTIFICATION_WEBHOOK: ${{ secrets.SLACK_GENERAL_NOTIFICATION_WEBHOOK }}
