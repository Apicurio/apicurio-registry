name: Release Operator
# Triggered by Release Images workflow after all operand images are pushed,
# ensuring correct ordering without a polling loop. Can also be dispatched
# manually for re-runs.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag name
        required: true
      run_tests:
        description: Run tests using the release artifacts
        type: boolean
        default: true

permissions:
  contents: read

jobs:

  release-build:
    name: Build & Publish
    if: github.repository_owner == 'Apicurio'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    outputs:
      release-version: ${{ steps.config.outputs.release-version }}
      branch: ${{ steps.config.outputs.branch }}
      run-tests: ${{ steps.config.outputs.run-tests }}
      package-version: ${{ steps.config.outputs.package-version }}
      previous-version: ${{ steps.config.outputs.previous-version }}
      rolling: ${{ steps.config.outputs.rolling }}
    steps:

      - name: Fetch Release Details
        run: |
          touch release.json && curl "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/${{ github.event.inputs.tag }}" > release.json
          echo "RELEASE_VERSION=$(cat release.json | jq -r '.name')" >> $GITHUB_ENV
          echo "BRANCH=$(cat release.json | jq -r '.target_commitish')" >> $GITHUB_ENV
          echo "RUN_TESTS=${{ github.event.inputs.run_tests }}" >> $GITHUB_ENV

      - name: Download Source Code
        run: |
          git config --global user.name apicurio-ci
          git config --global user.email apicurio.ci@gmail.com
          git clone "https://apicurio-ci:${{ secrets.ACCESS_TOKEN }}@github.com/Apicurio/apicurio-registry.git" registry
          cd registry && git checkout "$RELEASE_VERSION"
          # Resolve BRANCH if it's a commit SHA (happens when releasing from non-default branches)
          if [[ "$BRANCH" =~ ^[0-9a-f]{40}$ ]]; then
            # Prefer maintenance branches (X.Y.x) over main to avoid resolving
            # maintenance releases to main (the SHA may exist on both after post-release sync).
            # Feature branches are ignored — only main and X.Y.x patterns are considered.
            ALL_BRANCHES=$(git branch -r --contains "$BRANCH" | grep -v HEAD | sed 's|.*origin/||' | tr -d ' ')
            RESOLVED=$(echo "$ALL_BRANCHES" | grep -E '^[0-9]+\.[0-9]+\.x$' | head -1)
            if [ -z "$RESOLVED" ]; then
              RESOLVED="main"
            fi
            if [ -n "$RESOLVED" ]; then
              echo "Resolved branch SHA $BRANCH to $RESOLVED (candidates: $(echo $ALL_BRANCHES | tr '\n' ', '))"
              echo "BRANCH=$RESOLVED" >> $GITHUB_ENV
            else
              echo "ERROR: Could not resolve commit $BRANCH to a branch name"
              exit 1
            fi
          fi

      # Backward compatibility: ci-settings.xml was added after 3.3.1 (#8556) and may not
      # exist in older release tags. Remove this guard once all supported tags include the file.
      - name: Resolve Maven settings
        run: |
          SETTINGS_FILE="${{ github.workspace }}/registry/.github/ci-settings.xml"
          if [ -f "$SETTINGS_FILE" ]; then
            echo "MVN_SETTINGS=-s $SETTINGS_FILE" >> $GITHUB_ENV
          else
            echo "MVN_SETTINGS=" >> $GITHUB_ENV
          fi

      - name: Verify Project Version
        working-directory: registry
        run: |
          PROJECT_VERSION="$(mvn $MVN_SETTINGS help:evaluate -Dexpression=project.version -q -DforceStdout)"
          if [[ "$PROJECT_VERSION" != "$RELEASE_VERSION" ]]
          then
              echo "ERROR: Project version $PROJECT_VERSION does not match released version $RELEASE_VERSION"
              exit 1
          fi

      # Derive the upgrade path from the released tags rather than from the branch or the
      # Makefile: a maintenance branch's Makefile can be stale when the previous patch
      # was released from main (3.3.4 replaced 3.3.2 instead of 3.3.3), and a maintenance
      # release can still be the newest release, which must also go to the rolling channel.
      - name: Determine upgrade path and channels
        working-directory: registry
        run: |
          MAJOR="${RELEASE_VERSION%%.*}"
          RELEASES=$( (git tag -l "$MAJOR.*"; echo "$RELEASE_VERSION") | grep -E "^$MAJOR\.[0-9]+\.[0-9]+$" | sort -Vu)
          if ! grep -qx "$RELEASE_VERSION" <<< "$RELEASES"; then
            echo "ERROR: Release version $RELEASE_VERSION is not of the form $MAJOR.Y.Z"
            exit 1
          fi
          PREVIOUS=$(awk -v r="$RELEASE_VERSION" '$0 == r { exit } { p = $0 } END { print p }' <<< "$RELEASES")
          if [ -z "$PREVIOUS" ]; then
            echo "ERROR: No release before $RELEASE_VERSION found in the tags"
            exit 1
          fi
          NEWEST=$(tail -1 <<< "$RELEASES")
          ROLLING=false
          if [ "$NEWEST" = "$RELEASE_VERSION" ]; then
            ROLLING=true
          fi
          echo "Previous release: $PREVIOUS, newest release: $NEWEST, rolling channel: $ROLLING"
          # make reads PREVIOUS_PACKAGE_VERSION from the environment (the Makefile uses ?=).
          echo "PREVIOUS_PACKAGE_VERSION=$PREVIOUS" >> $GITHUB_ENV
          echo "ROLLING=$ROLLING" >> $GITHUB_ENV

      - name: Configure outputs
        id: config
        working-directory: registry/operator
        run: |
          echo "release-version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "run-tests=$RUN_TESTS" >> $GITHUB_OUTPUT
          echo "package-version=$(make VAR=LC_VERSION variable-get)" >> $GITHUB_OUTPUT
          echo "previous-version=$PREVIOUS_PACKAGE_VERSION" >> $GITHUB_OUTPUT
          echo "rolling=$ROLLING" >> $GITHUB_OUTPUT

      - name: Show make configuration
        working-directory: registry/operator
        run: |
          make OPERAND_IMAGE_TAG=$RELEASE_VERSION config-show

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Build the operator
        working-directory: registry/operator
        run: |
          make BUILD_OPTS=--no-transfer-progress SKIP_TESTS=true build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Quay.io Registry
        run: docker login -u "${{ secrets.QUAY_USERNAME }}" -p "${{ secrets.QUAY_PASSWORD }}" quay.io

      - name: Build and push operator image
        working-directory: registry/operator
        run: |
          make OPERAND_IMAGE_TAG=$RELEASE_VERSION ADDITIONAL_IMAGE_TAG=latest image-buildx-push

      - name: Build operator bundle
        working-directory: registry/operator
        run: |
          ROLLING_CHANNEL_ARG=""
          if [ "$ROLLING" = "true" ]; then
            ROLLING_CHANNEL_ARG="ROLLING_CHANNEL=3.x"
          fi
          make OPERAND_IMAGE_TAG=$RELEASE_VERSION $ROLLING_CHANNEL_ARG bundle

      - name: Build operator catalog
        working-directory: registry/operator
        run: |
          ROLLING_CHANNEL_ARG=""
          if [ "$ROLLING" = "true" ]; then
            ROLLING_CHANNEL_ARG="ROLLING_CHANNEL=3.x"
          fi
          make OPERAND_IMAGE_TAG=$RELEASE_VERSION ADDITIONAL_CATALOG_IMAGE_TAG=latest $ROLLING_CHANNEL_ARG catalog

      - name: Generate install file for tests
        working-directory: registry/operator
        run: |
          make OPERAND_IMAGE_TAG=$RELEASE_VERSION INSTALL_FILE=controller/target/test-install.yaml dist-install-file

      - name: Upload test artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: operator-test-artifacts
          path: |
            registry/operator/controller/target/
            registry/operator/model/target/
            registry/operator/olm-tests/target/
          retention-days: 1

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: operator-bundle-artifacts
          path: |
            registry/operator/target/bundle/
          retention-days: 1

  release-test:
    name: Test (${{ matrix.name }})
    needs: release-build
    if: needs.release-build.outputs.run-tests == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: smoke
            groups: "smoke"
            olm-enable: "false"
            olm-v1-enable: "false"
            extra-build-opts: ""
          - name: kafka
            groups: "kafka"
            olm-enable: "false"
            olm-v1-enable: "false"
            extra-build-opts: ""
          - name: auth
            groups: "auth"
            excluded-groups: "kafka"
            olm-enable: "false"
            olm-v1-enable: "false"
            extra-build-opts: ""
          - name: database
            groups: "database"
            olm-enable: "false"
            olm-v1-enable: "false"
            extra-build-opts: ""
          - name: feature
            groups: "feature"
            excluded-groups: "feature-setup"
            olm-enable: "false"
            olm-v1-enable: "false"
            extra-build-opts: ""
          - name: feature-setup
            groups: "feature-setup"
            olm-enable: "false"
            olm-v1-enable: "false"
            extra-build-opts: ""
          - name: olm-v1
            groups: "OLM"
            olm-enable: "true"
            olm-v1-enable: "true"
            extra-build-opts: "-Dtest.operator.olm-version=1"
          - name: olm-v0
            groups: "OLM"
            olm-enable: "true"
            olm-v1-enable: "false"
            extra-build-opts: ""
    steps:

      - name: Download Source Code
        run: |
          git clone https://github.com/Apicurio/apicurio-registry.git registry
          cd registry && git checkout "${{ needs.release-build.outputs.release-version }}"

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Download test artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: operator-test-artifacts
          path: registry/operator/



      - uses: apicurio/apicurio-github-actions/setup-minikube@bd19cbe33797325a571cd7ffd58f639b62e128a2 # v2
        with:
          driver: 'none'
          ingress-enable: 'true'
          olm-enable: ${{ matrix.olm-enable }}
          olm-v1-enable: ${{ matrix.olm-v1-enable }}
          start-args: '--alsologtostderr --v=2'

      - name: Run ${{ matrix.name }} tests on Minikube
        working-directory: registry/operator
        run: |
          make BUILD_OPTS="--no-transfer-progress ${{ matrix.extra-build-opts }}" \
            OPERAND_IMAGE_TAG="${{ needs.release-build.outputs.release-version }}" \
            REMOTE_TESTS_ALL_INSTALL_FILE=controller/target/test-install.yaml \
            GROUPS="${{ matrix.groups }}" \
            EXCLUDED_GROUPS="${{ matrix.excluded-groups }}" \
            test-remote-group

  # Keeps the branch's install files tracking the version bump release.yaml
  # already pushed, independent of whether release-test passes. Split out
  # from release-post (#10841): that job gates everything on release-test, so
  # a test failure — unrelated to whether this housekeeping itself would
  # succeed — used to skip it entirely, leaving install.yaml and
  # install-namespaced.yaml silently out of date on the branch (and, for a
  # maintenance release, un-synced to main) until Verify went red from the
  # drift and someone noticed and fixed it by hand (#10837).
  #
  # The Makefile's PREVIOUS_PACKAGE_VERSION bump and the catalog template
  # update are NOT here: they record the upgrade graph of what has actually
  # been published (the next bundle's `replaces` comes from
  # PREVIOUS_PACKAGE_VERSION), so they stay gated on release-test passing, in
  # release-post below — otherwise a release abandoned after a test failure
  # would still advance the catalog graph past a version nothing ever
  # published to Community Operators.
  #
  # `if: !cancelled()` rather than `always()`: a cancelled run should not
  # still push housekeeping changes.
  release-post-sync:
    name: Post-Release Housekeeping
    needs: [release-build]
    if: "!cancelled() && needs.release-build.result == 'success'"
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    # Read by the notify job, which leaves out a failure already reported here.
    outputs:
      notified: ${{ steps.notify.outcome }}
    env:
      RELEASE_VERSION: ${{ needs.release-build.outputs.release-version }}
      BRANCH: ${{ needs.release-build.outputs.branch }}
      PACKAGE_VERSION: ${{ needs.release-build.outputs.package-version }}
    steps:

      - name: Configure env. variables
        run: |
          echo "GH_TOKEN=${{ secrets.ACCESS_TOKEN }}" >> "$GITHUB_ENV"

      - name: Download Source Code
        run: |
          git config --global user.name apicurio-ci
          git config --global user.email apicurio.ci@gmail.com
          git clone "https://apicurio-ci:${{ secrets.ACCESS_TOKEN }}@github.com/Apicurio/apicurio-registry.git" registry
          cd registry && git checkout "$RELEASE_VERSION"

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      # Generates install/apicurio-registry-operator-$RELEASE_VERSION.yaml and its
      # namespaced counterpart as untracked files in this checkout, from the release
      # tag (VERSION is read from pom.xml). They used to be a side effect of the old
      # release-post job's own `make dist`, done in the same job/workspace that later
      # committed install files; now that this is a separate job, generate them here,
      # before switching to $BRANCH below — "Sync install files to main" and the
      # branch commit both expect them to already be on disk.
      #
      # `build` has to run first: dist-install-file's kustomization reads the CRD at
      # controller/src/main/deploy/crd/apicurioregistries3.registry.apicur.io-v1.yml,
      # which is gitignored and only exists after copy-crd (controller/pom.xml) runs
      # as part of `mvn install`. Without it this step fails on every release, on a
      # fresh clone of the tag — the exact "housekeeping silently skipped" failure
      # mode #10841 exists to fix. `dist` itself isn't needed here (it also builds the
      # tar.gz archive, which only release-post uses), just the two install targets.
      - name: Generate versioned install files
        working-directory: registry/operator
        run: |
          make BUILD_OPTS=--no-transfer-progress SKIP_TESTS=true OPERAND_IMAGE_TAG=$RELEASE_VERSION build dist-install-file dist-install-file-namespaced

      - name: Prepare post-release changes
        working-directory: registry/operator
        run: |
          # This job now starts right after release-build, not after release-test, so
          # there's less time for release.yaml's own snapshot-bump commit (a
          # monorepo-wide mvn versions:set + npm version, which can take a few
          # minutes) to have landed on $BRANCH by the time we get here. Poll for it
          # instead of checking once: wait up to 10 minutes (20 x 30s), then fail
          # loudly rather than silently regenerate install files against the
          # just-released (non-snapshot) version if it still hasn't shown up.
          MAX_ATTEMPTS=20
          SLEEP_SECONDS=30
          for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do
            # Switch to the branch and pull latest to pick up the snapshot version
            # update by release.yaml . It could have been pushed after the initial
            # clone, or even after a previous attempt in this loop.
            git fetch origin
            git checkout "$BRANCH"
            git pull origin "$BRANCH"

            CURRENT_VERSION=$(make VAR=VERSION variable-get)
            case "$CURRENT_VERSION" in
              *-SNAPSHOT)
                if [ "$CURRENT_VERSION" != "$RELEASE_VERSION-SNAPSHOT" ]; then
                  echo "$BRANCH is at $CURRENT_VERSION; the post-release bump has landed."
                  exit 0
                fi
                ;;
            esac

            if [ "$ATTEMPT" -eq "$MAX_ATTEMPTS" ]; then
              echo "::error::$BRANCH's version ($CURRENT_VERSION) still isn't a -SNAPSHOT past the release's own snapshot name ($RELEASE_VERSION-SNAPSHOT) after $((MAX_ATTEMPTS * SLEEP_SECONDS / 60)) minutes; release.yaml's post-release bump hasn't landed, or landed with an unexpected version."
              exit 1
            fi
            echo "$BRANCH is still at $CURRENT_VERSION (attempt $ATTEMPT/$MAX_ATTEMPTS); waiting ${SLEEP_SECONDS}s for release.yaml's snapshot-bump commit..."
            sleep "$SLEEP_SECONDS"
          done

      - name: Update install file
        working-directory: registry/operator
        run: |
          make IMAGE_TAG=latest-snapshot OPERAND_IMAGE_TAG=latest-snapshot SKIP_TESTS=true build INSTALL_FILE=install/install.yaml dist-install-file
          make IMAGE_TAG=latest-snapshot OPERAND_IMAGE_TAG=latest-snapshot SKIP_TESTS=true INSTALL_NAMESPACED_FILE=install/install-namespaced.yaml dist-install-file-namespaced
          git add install/*

      - name: Commit & push post-release changes
        working-directory: registry/operator
        run: |
          git commit -m "ci(operator): post-release install files for $RELEASE_VERSION"
          # Rebase in case somebody else pushed to the branch
          git fetch origin
          git rebase "origin/$BRANCH"
          git push origin "$BRANCH"

      - name: Sync install files to main
        if: env.BRANCH != 'main'
        working-directory: registry
        run: |
          # Save the versioned install files before switching branches
          INSTALL_FILE="operator/install/apicurio-registry-operator-$RELEASE_VERSION.yaml"
          INSTALL_NAMESPACED_FILE="operator/install/apicurio-registry-operator-namespaced-$RELEASE_VERSION.yaml"
          cp "$INSTALL_FILE" /tmp/install-file.yaml
          cp "$INSTALL_NAMESPACED_FILE" /tmp/install-file-namespaced.yaml

          # Switch to main
          git checkout main
          git pull origin main

          # Copy the versioned install files
          cp /tmp/install-file.yaml "$INSTALL_FILE"
          cp /tmp/install-file-namespaced.yaml "$INSTALL_NAMESPACED_FILE"

          git add "$INSTALL_FILE" "$INSTALL_NAMESPACED_FILE"
          git commit -m "ci(operator): sync $RELEASE_VERSION install files from $BRANCH to main"
          git rebase origin/main
          git push origin main

      # Before tmate, which holds the job open until it times out, so whoever is
      # notified can still connect. tmate lets in only github.actor's SSH keys,
      # and apicurio-ci (which dispatches this workflow from release-images)
      # has none: then there is no session, and the notify job reports the
      # failure, mentioning whoever ran the release.
      - name: Notify failure
        id: notify
        if: failure() && github.actor != 'apicurio-ci'
        uses: Apicurio/apicurio-github-actions/notify-slack@bd19cbe33797325a571cd7ffd58f639b62e128a2 # v2.4.0
        with:
          level: important
          text: ":x: ${{ github.workflow }} failed for ${{ inputs.tag }} in release-post-sync. :mag: Debug it on the runner: @${{ github.actor }} can SSH in with tmate until the job times out. The ssh command is in the job log."
          link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          mention: ${{ github.actor }},${{ github.triggering_actor }}
          user-map: ${{ secrets.SLACK_USER_MAP }}
          important-webhook: ${{ secrets.SLACK_IMPORTANT_NOTIFICATION_WEBHOOK }}

      - name: Setup tmate session on failure
        if: failure() && github.actor != 'apicurio-ci'
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3
        with:
          limit-access-to-actor: true

  release-post:
    name: Post-Release
    needs: [release-build, release-test]
    if: always() && needs.release-build.result == 'success' && (needs.release-test.result == 'success' || needs.release-test.result == 'skipped')
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    # Read by the notify job, which leaves out a failure already reported here.
    outputs:
      notified: ${{ steps.notify.outcome }}
    env:
      RELEASE_VERSION: ${{ needs.release-build.outputs.release-version }}
      BRANCH: ${{ needs.release-build.outputs.branch }}
      PACKAGE_VERSION: ${{ needs.release-build.outputs.package-version }}
      ROLLING: ${{ needs.release-build.outputs.rolling }}
    steps:

      - name: Configure env. variables
        run: |
          echo "GH_TOKEN=${{ secrets.ACCESS_TOKEN }}" >> "$GITHUB_ENV"
          echo "RELEASE_BRANCH=release-$PACKAGE_VERSION" >> "$GITHUB_ENV"

      - name: Download Source Code
        run: |
          git config --global user.name apicurio-ci
          git config --global user.email apicurio.ci@gmail.com
          git clone "https://apicurio-ci:${{ secrets.ACCESS_TOKEN }}@github.com/Apicurio/apicurio-registry.git" registry
          cd registry && git checkout "$RELEASE_VERSION"

      # The release tag may predate operator/scripts (e.g. 3.3.x), so take the
      # helper scripts from the commit this workflow runs from instead.
      - name: Checkout workflow helper scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: workflow-scripts
          sparse-checkout: operator/scripts
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Build operator
        working-directory: registry/operator
        run: |
          make BUILD_OPTS=--no-transfer-progress SKIP_TESTS=true OPERAND_IMAGE_TAG=$RELEASE_VERSION build

      - name: Download bundle artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: operator-bundle-artifacts
          path: registry/operator/target/bundle/

      - name: Build dist archive and attach to the release
        working-directory: registry/operator
        run: |
          make OPERAND_IMAGE_TAG=$RELEASE_VERSION dist
          DIST_FILE="target/apicurio-registry-operator-$RELEASE_VERSION.tar.gz"
          gh release upload "$RELEASE_VERSION" "$DIST_FILE"

      - name: Checkout the Community Operators repository
        run: |
          mkdir community-operators
          cd community-operators
          git init
          git remote add origin https://github.com/k8s-operatorhub/community-operators.git
          git remote add source "https://apicurio-ci:${{ secrets.ACCESS_TOKEN }}@github.com/Apicurio/community-operators.git"
          git fetch
          git checkout --track origin/main
          git push -f source main

      - name: Create the Community Operators PR
        id: community-operators-pr
        continue-on-error: true
        working-directory: community-operators
        run: |
          git checkout -b "$RELEASE_BRANCH"
          TITLE="Release Apicurio Registry Operator $PACKAGE_VERSION"
          BODY="$(curl -s https://raw.githubusercontent.com/k8s-operatorhub/community-operators/main/docs/pull_request_template.md)"
          cp -r "../registry/operator/target/bundle/apicurio-registry-3/$PACKAGE_VERSION" operators/apicurio-registry-3
          git add .
          git commit -s -m "$TITLE"
          git push -f source "$RELEASE_BRANCH"
          gh repo set-default k8s-operatorhub/community-operators
          gh pr create --title "$TITLE" --body "$BODY" --base main --head "Apicurio:$RELEASE_BRANCH"

      - name: Warn if Community Operators PR failed
        if: steps.community-operators-pr.outcome == 'failure'
        run: echo "::warning::Failed to create Community Operators PR. Please create it manually."

      - name: Checkout the Openshift Community Operators repository
        run: |
          mkdir openshift-community-operators
          cd openshift-community-operators
          git init
          git remote add origin https://github.com/redhat-openshift-ecosystem/community-operators-prod.git
          git remote add source "https://apicurio-ci:${{ secrets.ACCESS_TOKEN }}@github.com/Apicurio/community-operators-prod.git"
          git fetch
          git checkout --track origin/main
          git push -f source main

      - name: Create the Openshift Community Operators Bundle PR
        id: openshift-community-operators-bundle-pr
        continue-on-error: true
        working-directory: openshift-community-operators
        run: |
          git checkout -b "${RELEASE_BRANCH}-bundle"
          TITLE="Release Apicurio Registry Operator $PACKAGE_VERSION"
          BODY="$(curl -s https://raw.githubusercontent.com/redhat-openshift-ecosystem/community-operators-prod/main/docs/pull_request_template.md)"
          cp -r "../registry/operator/target/bundle/apicurio-registry-3/$PACKAGE_VERSION" operators/apicurio-registry-3
          git add .
          git commit -s -m "$TITLE"
          git push -f source "${RELEASE_BRANCH}-bundle"
          gh repo set-default redhat-openshift-ecosystem/community-operators-prod
          gh pr create --title "$TITLE" --body "$BODY" --base main --head "Apicurio:${RELEASE_BRANCH}-bundle"

      - name: Warn if Openshift Community Operators Bundle PR failed
        if: steps.openshift-community-operators-bundle-pr.outcome == 'failure'
        run: echo "::warning::Failed to create Openshift Community Operators Bundle PR. Please create it manually."

      - name: Create the Openshift Community Operators Catalog PR
        id: openshift-community-operators-catalog-pr
        if: steps.openshift-community-operators-bundle-pr.outcome == 'success'
        continue-on-error: true
        working-directory: openshift-community-operators
        run: |
          PKG_NAME="apicurio-registry-3"
          FBC_ENABLED=$(cd "operators/$PKG_NAME" && cat ci.yaml | grep -c "fbc:" || true)
          if [ "$FBC_ENABLED" -eq 0 ]; then
            echo "FBC is not enabled — skipping catalog PR"
            exit 0
          fi

          # Wait for the pipeline-built bundle, then refresh catalog history in
          # case a preceding catalog submission merged while we were waiting.
          BUNDLE_IMG=$(bash ../workflow-scripts/operator/scripts/published-bundle.sh "$PACKAGE_VERSION")
          git fetch origin main
          git checkout -B main origin/main
          git checkout -b "${RELEASE_BRANCH}-catalog"
          TITLE="Update FBC catalogs for Apicurio Registry Operator $PACKAGE_VERSION"

          MINOR_CHANNEL=$(echo "$PACKAGE_VERSION" | sed 's/\([0-9]*\.[0-9]*\)\..*/\1.x/')
          CSV_NAME="$PKG_NAME.v$PACKAGE_VERSION"

          if [ "$ROLLING" = "true" ]; then
            CHANNELS="3.x $MINOR_CHANNEL"
          else
            CHANNELS="$MINOR_CHANNEL"
          fi

          cd "operators/$PKG_NAME"

          if [ ! -f ../../bin/yq ]; then
            mkdir -p ../../bin
            curl -sLo ../../bin/yq "https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64"
            chmod +x ../../bin/yq
          fi
          YQ="../../bin/yq"
          PREVIOUS_CSV=$($YQ '.spec.replaces // ""' "../../../registry/operator/target/bundle/$PKG_NAME/$PACKAGE_VERSION/manifests/$PKG_NAME.clusterserviceversion.yaml")

          for tpl in catalog-templates/v4.*.yaml; do
            echo "  Updating $tpl"
            for CH in $CHANNELS; do
              CH_EXISTS=$($YQ ".entries[] | select(.schema == \"olm.channel\") | select(.name == \"$CH\") | .name" "$tpl" 2>/dev/null || true)
              CH_HEAD=$($YQ ".entries[] | select(.schema == \"olm.channel\") | select(.name == \"$CH\") | .entries[0].name" "$tpl" 2>/dev/null || true)

              if [ "$CH_HEAD" = "$CSV_NAME" ]; then
                echo "    $CH already contains $CSV_NAME as its head"
              elif [ -z "$CH_EXISTS" ] || [ "$CH_EXISTS" = "null" ]; then
                echo "    Creating new channel $CH"
                $YQ -i ".entries |= . + [{\"schema\": \"olm.channel\", \"package\": \"$PKG_NAME\", \"name\": \"$CH\", \"entries\": [{\"name\": \"$CSV_NAME\"}]}]" "$tpl"
                if [ -n "$PREVIOUS_CSV" ]; then
                  $YQ -i "(.entries[] | select(.schema == \"olm.channel\" and .name == \"$CH\") | .entries[0].replaces) = \"$PREVIOUS_CSV\"" "$tpl"
                fi
              elif [ -n "$CH_HEAD" ] && [ "$CH_HEAD" != "null" ]; then
                $YQ -i "(.entries[] | select(.schema == \"olm.channel\") | select(.name == \"$CH\") | .entries) |= [{\"name\": \"$CSV_NAME\", \"replaces\": \"$CH_HEAD\"}] + ." "$tpl"
              else
                $YQ -i "(.entries[] | select(.schema == \"olm.channel\") | select(.name == \"$CH\") | .entries) |= [{\"name\": \"$CSV_NAME\"}]" "$tpl"
                if [ -n "$PREVIOUS_CSV" ]; then
                  $YQ -i "(.entries[] | select(.schema == \"olm.channel\" and .name == \"$CH\") | .entries[0].replaces) = \"$PREVIOUS_CSV\"" "$tpl"
                fi
              fi
            done
            if ! $YQ -e ".entries[] | select(.schema == \"olm.bundle\" and .image == \"$BUNDLE_IMG\")" "$tpl" >/dev/null 2>&1; then
              $YQ -i ".entries |= . + [{\"schema\": \"olm.bundle\", \"image\": \"$BUNDLE_IMG\"}]" "$tpl"
            fi
          done

          make catalogs
          make validate-catalogs
          echo "FBC catalog update complete"
          cd ../..

          git add .
          git commit -s -m "$TITLE"
          git push -f source "${RELEASE_BRANCH}-catalog"
          gh repo set-default redhat-openshift-ecosystem/community-operators-prod
          gh pr create --title "$TITLE" --body "FBC catalog update for $PACKAGE_VERSION." --base main --head "Apicurio:${RELEASE_BRANCH}-catalog"

      - name: Warn if Openshift Community Operators Catalog PR failed
        if: steps.openshift-community-operators-catalog-pr.outcome == 'failure'
        run: echo "::warning::Failed to create Openshift Community Operators Catalog PR. Please create it manually."

      # The Makefile's PREVIOUS_PACKAGE_VERSION and the catalog template record the
      # upgrade graph of what has actually been published — this job's own gate
      # (release-test passing or skipped) is what makes it safe to advance them here,
      # rather than in release-post-sync, which runs independent of test results.
      - name: Update Makefile and catalog template
        working-directory: registry/operator
        run: |
          git fetch origin
          git checkout "$BRANCH"
          git pull origin "$BRANCH"
          make VAR=PREVIOUS_PACKAGE_VERSION "VAL=$PACKAGE_VERSION" variable-set
          git add Makefile
          make release-catalog-template-update
          git add "$(make VAR=CATALOG_DIR variable-get)"

      - name: Commit & push catalog bookkeeping
        working-directory: registry/operator
        run: |
          git commit -m "ci(operator): post-release catalog bookkeeping for $RELEASE_VERSION"
          # Rebase in case somebody else pushed to the branch
          git fetch origin
          git rebase "origin/$BRANCH"
          git push origin "$BRANCH"

      - name: Sync catalog bookkeeping to main
        if: env.BRANCH != 'main'
        working-directory: registry
        run: |
          git checkout main
          git pull origin main

          RELEASE_CHANNEL=$(echo "$PACKAGE_VERSION" | sed 's/\([0-9]*\.[0-9]*\)\..*/\1.x/')
          MAIN_CHANNEL=$(cd operator && make VAR=CHANNEL variable-get)
          CATALOG_DIR=$(cd operator && make VAR=CATALOG_DIR variable-get)

          cd operator
          if [ "$RELEASE_CHANNEL" = "$MAIN_CHANNEL" ]; then
            # Same minor as main — full catalog update
            make VAR=PREVIOUS_PACKAGE_VERSION "VAL=$PACKAGE_VERSION" variable-set
            make release-catalog-template-update
          else
            # Maintenance release from an older minor — only update its channel (and the
            # rolling channel if it is the newest release) and add the bundle image.
            # Do NOT touch PREVIOUS_PACKAGE_VERSION or other minor channels on main.
            CATALOG_FILE="$CATALOG_DIR/catalog.template.yaml"
            PKG_NAME=$(make VAR=PACKAGE_NAME variable-get)
            LC_VERSION=$(echo "$PACKAGE_VERSION" | tr A-Z a-z)
            BUNDLE_IMG="$(make VAR=IMAGE_REGISTRY variable-get)/$(make VAR=BUNDLE_IMAGE_NAME variable-get):$LC_VERSION"
            # install-yq is also a dependency of release-catalog-template-update (the "if"
            # branch above), but that branch doesn't run here, so make sure it's present.
            make install-yq
            YQ=$(make VAR=YQ variable-get)

            SYNC_CHANNELS="$RELEASE_CHANNEL"
            if [ "$ROLLING" = "true" ]; then
              SYNC_CHANNELS="3.x $RELEASE_CHANNEL"
            fi
            echo "Syncing maintenance release $PACKAGE_VERSION to main (channels: $SYNC_CHANNELS)"

            # Add the new version as the head of each channel, replacing the current
            # released head. The development placeholder stays first.
            export PLACEHOLDER='${PLACEHOLDER_PACKAGE}' CSV_NAME="$PKG_NAME.v$PACKAGE_VERSION"
            for CH in $SYNC_CHANNELS; do
              export CH HEAD
              HEAD=$($YQ '.entries[] | select(.schema == "olm.channel" and .name == strenv(CH)) | [.entries[] | select(.name != strenv(PLACEHOLDER))] | .[0].name // ""' "$CATALOG_FILE")
              if [ -z "$HEAD" ] || [ "$HEAD" = "$CSV_NAME" ]; then
                echo "ERROR: Unexpected head '$HEAD' of channel $CH"
                exit 1
              fi
              $YQ -i '(.entries[] | select(.schema == "olm.channel" and .name == strenv(CH)) | .entries) |=
                ([.[] | select(.name == strenv(PLACEHOLDER))] + [{"name": strenv(CSV_NAME), "replaces": strenv(HEAD)}] + [.[] | select(.name != strenv(PLACEHOLDER))])' "$CATALOG_FILE"
            done

            # Add the bundle image
            $YQ -i ".entries |= . + [{\"schema\": \"olm.bundle\", \"image\": \"$BUNDLE_IMG\"}]" "$CATALOG_FILE"
          fi

          cd ..
          # Scoped, not `git add .`: this workspace's own `make dist` (in "Build dist
          # archive and attach to the release", above) leaves the versioned install
          # files untracked on disk here too. They're identical to what
          # release-post-sync already committed to main, so picking them up would be
          # benign, but this step is only meant to touch the Makefile/catalog bump.
          git add operator/Makefile "operator/$CATALOG_DIR"
          git commit -m "ci(operator): sync $RELEASE_VERSION catalog bookkeeping from $BRANCH to main"
          git rebase origin/main
          git push origin main

      # Before tmate, which holds the job open until it times out, so whoever is
      # notified can still connect. tmate lets in only github.actor's SSH keys,
      # and apicurio-ci (which dispatches this workflow from release-images)
      # has none: then there is no session, and the notify job reports the
      # failure, mentioning whoever ran the release.
      - name: Notify failure
        id: notify
        if: failure() && github.actor != 'apicurio-ci'
        uses: Apicurio/apicurio-github-actions/notify-slack@bd19cbe33797325a571cd7ffd58f639b62e128a2 # v2.4.0
        with:
          level: important
          text: ":x: ${{ github.workflow }} failed for ${{ inputs.tag }} in release-post. :mag: Debug it on the runner: @${{ github.actor }} can SSH in with tmate until the job times out. The ssh command is in the job log."
          link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          mention: ${{ github.actor }},${{ github.triggering_actor }}
          user-map: ${{ secrets.SLACK_USER_MAP }}
          important-webhook: ${{ secrets.SLACK_IMPORTANT_NOTIFICATION_WEBHOOK }}

      - name: Setup tmate session on failure
        if: failure() && github.actor != 'apicurio-ci'
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3
        with:
          limit-access-to-actor: true

  # Slack: see "Notifications" in .github/workflows/README.md.
  notify:
    name: Notify
    needs: [release-build, release-test, release-post-sync, release-post]
    if: "!cancelled() && github.repository_owner == 'Apicurio'"
    permissions:
      actions: read
    uses: ./.github/workflows/reusable-notify.yaml
    with:
      results: ${{ toJSON(needs) }}
      version: ${{ inputs.tag }}
    secrets:
      SLACK_USER_MAP: ${{ secrets.SLACK_USER_MAP }}
      SLACK_IMPORTANT_NOTIFICATION_WEBHOOK: ${{ secrets.SLACK_IMPORTANT_NOTIFICATION_WEBHOOK }}
      SLACK_GENERAL_NOTIFICATION_WEBHOOK: ${{ secrets.SLACK_GENERAL_NOTIFICATION_WEBHOOK }}
