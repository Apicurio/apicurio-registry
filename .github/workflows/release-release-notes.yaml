name: Release Release Notes
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name'
        required: true
  release:
    types: [ released ]

permissions:
  contents: write

env:
  # The values are extracted from the github.event context,
  # which is only available when the workflow gets triggered by a release event.
  RELEASE_VERSION: ${{ github.event.release.name }}
  BRANCH: ${{ github.event.release.target_commitish }}


jobs:
  generate-release-notes:
    if: github.repository_owner == 'Apicurio' && (github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, '3.'))
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Release Details
        if: github.event_name == 'workflow_dispatch'
        run: |
          touch release.json && curl https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${{ github.event.inputs.tag }} > release.json
          echo "RELEASE_VERSION=$(cat release.json | jq -r '.name')" >> $GITHUB_ENV
          echo "BRANCH=$(cat release.json | jq -r '.target_commitish')" >> $GITHUB_ENV

      - name: Generate Release Notes from Milestone Issues
        run: |
          MILESTONE="${RELEASE_VERSION}"

          # Get all closed issues for this milestone
          gh issue list \
            --repo ${GITHUB_REPOSITORY} \
            --milestone "${MILESTONE}" \
            --state closed \
            --limit 1000 \
            --json number,title,labels \
            > issues.json

          # Generate release notes
          cat > release_notes.md << 'EOF'
          ## What's Changed

          EOF

          # Extract bugs
          echo "### Bug Fixes" >> release_notes.md
          jq -r '.[] | select(.labels[]?.name == "type/bug") | "* \(.title) (#\(.number))"' issues.json >> release_notes.md
          echo "" >> release_notes.md

          # Extract enhancements
          echo "### Enhancements" >> release_notes.md
          jq -r '.[] | select(.labels[]?.name == "type/enhancement") | "* \(.title) (#\(.number))"' issues.json >> release_notes.md
          echo "" >> release_notes.md

          # Extract other issues (not tagged as bug or enhancement)
          echo "### Other Changes" >> release_notes.md
          jq -r '.[] | select(all(.labels[]?.name; . != "type/bug" and . != "type/enhancement")) | "* \(.title) (#\(.number))"' issues.json >> release_notes.md
          echo "" >> release_notes.md

          # Breaking changes and deprecations get their own sections, so they are not lost among
          # the bug/enhancement/other entries above. Each issue can appear in both this section
          # and one of the above: these are a highlight, not a different categorization.
          # The detailed migration steps belong on the version's upgrade page (if one exists for
          # this release), not in these one-line entries, so link to it when present.
          MAJOR_MINOR=$(echo "${RELEASE_VERSION}" | sed -E 's/^([0-9]+)\.([0-9]+).*/\1-\2/')
          UPGRADE_PAGE_PATH="docs/modules/ROOT/pages/getting-started/assembly-upgrading-to-${MAJOR_MINOR}.adoc"
          UPGRADE_PAGE_URL=""
          if gh api "repos/${GITHUB_REPOSITORY}/contents/${UPGRADE_PAGE_PATH}?ref=${BRANCH}" > /dev/null 2>&1; then
            UPGRADE_PAGE_URL="https://github.com/${GITHUB_REPOSITORY}/blob/${BRANCH}/${UPGRADE_PAGE_PATH}"
          fi

          echo "### Breaking Changes & Migration" >> release_notes.md
          if [ -n "${UPGRADE_PAGE_URL}" ]; then
            echo "See the [Upgrading to ${RELEASE_VERSION%.*}](${UPGRADE_PAGE_URL}) page for details." >> release_notes.md
            echo "" >> release_notes.md
          fi
          jq -r '.[] | select(.labels[]?.name == "type/breaking-change") | "* \(.title) (#\(.number))"' issues.json >> release_notes.md
          echo "" >> release_notes.md

          echo "### Deprecations" >> release_notes.md
          jq -r '.[] | select(.labels[]?.name == "type/deprecation") | "* \(.title) (#\(.number))"' issues.json >> release_notes.md
          echo "" >> release_notes.md

          # Update the GitHub release with the generated notes
          gh release edit ${RELEASE_VERSION} \
            --repo ${GITHUB_REPOSITORY} \
            --notes-file release_notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Slack: see "Notifications" in .github/workflows/README.md.
  notify:
    name: Notify
    needs: [generate-release-notes]
    if: "!cancelled() && github.repository_owner == 'Apicurio'"
    permissions:
      actions: read
    uses: ./.github/workflows/reusable-notify.yaml
    with:
      results: ${{ toJSON(needs) }}
      version: ${{ github.event.release.tag_name || inputs.tag }}
    secrets:
      SLACK_USER_MAP: ${{ secrets.SLACK_USER_MAP }}
      SLACK_IMPORTANT_NOTIFICATION_WEBHOOK: ${{ secrets.SLACK_IMPORTANT_NOTIFICATION_WEBHOOK }}
      SLACK_GENERAL_NOTIFICATION_WEBHOOK: ${{ secrets.SLACK_GENERAL_NOTIFICATION_WEBHOOK }}
