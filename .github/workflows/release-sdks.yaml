name: Release SDKs (All Languages)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name'
        required: true
      sdks:
        description: 'SDKs to release (comma-separated: python,go,typescript,all)'
        required: true
        default: 'all'
  release:
    types: [released]

permissions:
  id-token: write
  contents: read

env:
  RELEASE_VERSION: ${{ github.event.release.name }}
  BRANCH: ${{ github.event.release.target_commitish }}

jobs:
  # Prepare release details
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Apicurio' && (github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, '3.'))
    outputs:
      release-version: ${{ steps.version.outputs.version }}
      release-python: ${{ steps.sdks.outputs.python }}
      release-go: ${{ steps.sdks.outputs.go }}
      release-typescript: ${{ steps.sdks.outputs.typescript }}
    steps:
      - name: Fetch Release Details
        if: github.event_name == 'workflow_dispatch'
        run: |
          touch release.json && curl https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${{ github.event.inputs.tag }} > release.json
          echo "RELEASE_VERSION=$(cat release.json | jq -r '.name')" >> $GITHUB_ENV
          echo "BRANCH=$(cat release.json | jq -r '.target_commitish')" >> $GITHUB_ENV

      - name: Set version output
        id: version
        run: echo "version=${{ env.RELEASE_VERSION }}" >> $GITHUB_OUTPUT

      - name: Determine SDKs to release
        id: sdks
        run: |
          SDKS="${{ github.event.inputs.sdks || 'all' }}"
          if [[ "$SDKS" == "all" ]] || [[ "$SDKS" == *"python"* ]]; then
            echo "python=true" >> $GITHUB_OUTPUT
          else
            echo "python=false" >> $GITHUB_OUTPUT
          fi
          if [[ "$SDKS" == "all" ]] || [[ "$SDKS" == *"go"* ]]; then
            echo "go=true" >> $GITHUB_OUTPUT
          else
            echo "go=false" >> $GITHUB_OUTPUT
          fi
          if [[ "$SDKS" == "all" ]] || [[ "$SDKS" == *"typescript"* ]]; then
            echo "typescript=true" >> $GITHUB_OUTPUT
          else
            echo "typescript=false" >> $GITHUB_OUTPUT
          fi

  # Python SDK Release
  release-python-sdk:
    name: Release Python SDK
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.release-python == 'true'
    timeout-minutes: 30
    steps:
      - name: Download Source Code
        run: |
          git config --global user.name "apicurio-ci"
          git config --global user.email "apicurio.ci@gmail.com"
          git clone --branch ${{ needs.prepare.outputs.release-version }} --single-branch https://apicurio-ci:${{ secrets.ACCESS_TOKEN }}@github.com/Apicurio/apicurio-registry.git registry

      # Backward compatibility: ci-settings.xml was added after 3.3.1 (#8556) and may not
      # exist in older release tags. Remove this guard once all supported tags include the file.
      - name: Resolve Maven settings
        run: |
          SETTINGS_FILE="${{ github.workspace }}/registry/.github/ci-settings.xml"
          if [ -f "$SETTINGS_FILE" ]; then
            echo "MVN_SETTINGS=-s $SETTINGS_FILE" >> $GITHUB_ENV
          else
            echo "MVN_SETTINGS=" >> $GITHUB_ENV
          fi

      - name: Verify Project Version
        run: |
          cd registry
          PROJECT_VERSION=$(mvn $MVN_SETTINGS help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [[ $PROJECT_VERSION != ${{ needs.prepare.outputs.release-version }} ]]; then
            echo "ERROR: Project Version '${PROJECT_VERSION}' does not match with Released Version '${{ needs.prepare.outputs.release-version }}'"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15.2'

      - name: Install Poetry
        uses: snok/install-poetry@d45b6d76012debf457ab49dffc7fb7b2efe8071d

      - name: Build Package
        working-directory: registry/python-sdk
        run: poetry build

      - name: Publish to PyPI
        working-directory: registry/python-sdk
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: make publish

      - name: Notify on completion
        if: always()
        run: |
          MESSAGE="Python SDK release for ${{ needs.prepare.outputs.release-version }} completed with status: ${{ job.status }}"
          echo "$MESSAGE"

  # Go SDK Release
  release-go-sdk:
    name: Release Go SDK
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.release-go == 'true'
    timeout-minutes: 30
    steps:
      - name: Download Source Code
        run: |
          git config --global user.name "apicurio-ci"
          git config --global user.email "apicurio.ci@gmail.com"
          git clone --branch ${{ needs.prepare.outputs.release-version }} --single-branch https://apicurio-ci:${{ secrets.ACCESS_TOKEN }}@github.com/Apicurio/apicurio-registry.git registry

      # Backward compatibility: ci-settings.xml was added after 3.3.1 (#8556) and may not
      # exist in older release tags. Remove this guard once all supported tags include the file.
      - name: Resolve Maven settings
        run: |
          SETTINGS_FILE="${{ github.workspace }}/registry/.github/ci-settings.xml"
          if [ -f "$SETTINGS_FILE" ]; then
            echo "MVN_SETTINGS=-s $SETTINGS_FILE" >> $GITHUB_ENV
          else
            echo "MVN_SETTINGS=" >> $GITHUB_ENV
          fi

      - name: Verify Project Version
        run: |
          cd registry
          PROJECT_VERSION=$(mvn $MVN_SETTINGS help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [[ $PROJECT_VERSION != ${{ needs.prepare.outputs.release-version }} ]]; then
            echo "ERROR: Project Version '${PROJECT_VERSION}' does not match with Released Version '${{ needs.prepare.outputs.release-version }}'"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
          cache: false

      - name: Release Go SDK
        working-directory: registry
        run: |
          git tag "v${{ needs.prepare.outputs.release-version }}"
          git tag "go-sdk/v${{ needs.prepare.outputs.release-version }}"
          git push origin "v${{ needs.prepare.outputs.release-version }}"
          git push origin "go-sdk/v${{ needs.prepare.outputs.release-version }}"

      # The Go module proxy can take a while to index a freshly pushed tag.
      - name: Verify Go SDK is available on the module proxy
        uses: Apitomy/apitomy-github-actions/retry@e10e64b8a9ca86982f45a1ea512847219ae2605e # v1.0.1
        env:
          GOPROXY: proxy.golang.org
        with:
          working-directory: registry
          command: go list -m "github.com/apicurio/apicurio-registry/go-sdk/v3@v${{ needs.prepare.outputs.release-version }}"
          max-attempts: 5
          initial-delay: 10

      - name: Notify on completion
        if: always()
        run: |
          MESSAGE="Go SDK release for ${{ needs.prepare.outputs.release-version }} completed with status: ${{ job.status }}"
          echo "$MESSAGE"

  # TypeScript SDK Release
  release-typescript-sdk:
    name: Release TypeScript SDK
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.release-typescript == 'true'
    timeout-minutes: 15
    steps:
      - name: Download Source Code
        run: |
          git config --global user.name "apicurio-ci"
          git config --global user.email "apicurio.ci@gmail.com"
          git clone --branch ${{ needs.prepare.outputs.release-version }} --single-branch https://apicurio-ci:${{ secrets.ACCESS_TOKEN }}@github.com/Apicurio/apicurio-registry.git registry

      # Backward compatibility: ci-settings.xml was added after 3.3.1 (#8556) and may not
      # exist in older release tags. Remove this guard once all supported tags include the file.
      - name: Resolve Maven settings
        run: |
          SETTINGS_FILE="${{ github.workspace }}/registry/.github/ci-settings.xml"
          if [ -f "$SETTINGS_FILE" ]; then
            echo "MVN_SETTINGS=-s $SETTINGS_FILE" >> $GITHUB_ENV
          else
            echo "MVN_SETTINGS=" >> $GITHUB_ENV
          fi

      - name: Verify Project Version
        run: |
          cd registry
          PROJECT_VERSION=$(mvn $MVN_SETTINGS help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [[ $PROJECT_VERSION != ${{ needs.prepare.outputs.release-version }} ]]; then
            echo "ERROR: Project Version '${PROJECT_VERSION}' does not match with Released Version '${{ needs.prepare.outputs.release-version }}'"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.2
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        run: npm install -g npm@latest

      - name: Release Typescript SDK
        working-directory: registry/typescript-sdk
        run: |
          npm install
          npm run generate-sources
          npm run build

      - name: Publish to npmjs.com
        working-directory: registry/typescript-sdk
        run: npm publish --access public

      - name: Notify on completion
        if: always()
        run: |
          MESSAGE="TypeScript SDK release for ${{ needs.prepare.outputs.release-version }} completed with status: ${{ job.status }}"
          echo "$MESSAGE"

  # Slack: see "Notifications" in .github/workflows/README.md.
  notify:
    name: Notify
    needs: [prepare, release-python-sdk, release-go-sdk, release-typescript-sdk]
    if: "!cancelled() && github.repository_owner == 'Apicurio'"
    permissions:
      actions: read
    uses: ./.github/workflows/reusable-notify.yaml
    with:
      results: ${{ toJSON(needs) }}
      version: ${{ github.event.release.tag_name || inputs.tag }}
    secrets:
      SLACK_USER_MAP: ${{ secrets.SLACK_USER_MAP }}
      SLACK_IMPORTANT_NOTIFICATION_WEBHOOK: ${{ secrets.SLACK_IMPORTANT_NOTIFICATION_WEBHOOK }}
      SLACK_GENERAL_NOTIFICATION_WEBHOOK: ${{ secrets.SLACK_GENERAL_NOTIFICATION_WEBHOOK }}
