name: Validate Docs & Playbook

# Builds the published site with the production playbook and its Docker image
# (docs-playbook/_build-all.sh). That playbook takes its content from the
# published branches on GitHub, not from this checkout, so this validates
# changes to the playbook and its build, not a PR's docs content. A PR's docs
# content is checked by verify.yaml's Docs Check job (verify-docs.yaml).

on:
  workflow_call: { }
  pull_request:
    branches: [main, '3.3.x']
    paths:
      - 'docs-playbook/**'

permissions:
  contents: read

jobs:
  validate:
    name: Validate Docs
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Apicurio'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Generate Documentation
        run: |
          cd docs-playbook
          ./_build-all.sh
