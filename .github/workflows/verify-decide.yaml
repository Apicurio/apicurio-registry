name: Verify Decide (reusable)

# Shared decision job for the full-suite workflows (ci.yaml, integration-tests.yaml,
# extras.yaml, verify.yaml). Combines lifecycle-label evaluation (PR readiness) with
# path-based change detection into per-phase boolean outputs, so each top-level
# workflow decides identically without duplicating this logic.

on:
  workflow_call:
    outputs:
      lifecycle-ready:
        value: ${{ jobs.decide.outputs.lifecycle-ready }}
      run-build:
        value: ${{ jobs.decide.outputs.run-build }}
      run-unit-tests:
        value: ${{ jobs.decide.outputs.run-unit-tests }}
      run-scalpel-report:
        value: ${{ jobs.decide.outputs.run-scalpel-report }}
      run-integration:
        value: ${{ jobs.decide.outputs.run-integration }}
      run-extras:
        value: ${{ jobs.decide.outputs.run-extras }}
      run-sdk:
        value: ${{ jobs.decide.outputs.run-sdk }}
      run-cli:
        value: ${{ jobs.decide.outputs.run-cli }}
      run-go-sdk-freshness:
        value: ${{ jobs.decide.outputs.run-go-sdk-freshness }}
      run-operator:
        value: ${{ jobs.decide.outputs.run-operator }}
      run-console-plugin:
        value: ${{ jobs.decide.outputs.run-console-plugin }}
      scalpel-enabled:
        value: ${{ jobs.decide.outputs.scalpel-enabled }}

permissions:
  contents: read

jobs:
  decide:
    name: Decide
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Apicurio'
    outputs:
      lifecycle-ready: ${{ steps.decide.outputs.lifecycle-ready }}
      run-build: ${{ steps.decide.outputs.run-build }}
      run-unit-tests: ${{ steps.decide.outputs.run-unit-tests }}
      run-scalpel-report: ${{ steps.decide.outputs.run-scalpel-report }}
      run-integration: ${{ steps.decide.outputs.run-integration }}
      run-extras: ${{ steps.decide.outputs.run-extras }}
      run-sdk: ${{ steps.decide.outputs.run-sdk }}
      run-cli: ${{ steps.decide.outputs.run-cli }}
      run-go-sdk-freshness: ${{ steps.decide.outputs.run-go-sdk-freshness }}
      run-operator: ${{ steps.decide.outputs.run-operator }}
      run-console-plugin: ${{ steps.decide.outputs.run-console-plugin }}
      scalpel-enabled: ${{ steps.decide.outputs.scalpel-enabled }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect changed paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            java:
              - 'app/**'
              - 'common/**'
              - 'schema-util/**'
              - 'schema-validation/**'
              - 'schema-resolver/**'
              - 'serdes/**'
              - 'config-index/**'
              - 'java-sdk/**'
              - 'mcp/**'
              - 'distro/**'
              - 'integration-tests/src/**'
              - 'integration-tests/pom.xml'
              - 'pom.xml'
            ui:
              - 'ui/**'
            integration:
              - 'app/**'
              - 'common/**'
              - 'integration-tests/**'
              - 'schema-util/**'
              - 'schema-validation/**'
              - 'schema-resolver/**'
              - 'serdes/**'
              - 'distro/**'
              - 'pom.xml'
            sdk:
              - 'java-sdk/**'
              - 'go-sdk/**'
              - 'python-sdk/**'
              - 'typescript-sdk/**'
            go-sdk-gen:
              - 'common/src/main/resources/META-INF/openapi.json'
              - 'common/src/main/resources/META-INF/openapi-v2.json'
              - 'go-sdk/**'
            cli:
              - 'cli/**'
              - 'java-sdk/**'
              - '.github/workflows/verify-cli.yaml'
            operator:
              - 'operator/**'
            console-plugin:
              - 'console-plugin/**'
            ci:
              - '.github/workflows/**'
            ci-operator:
              - '.github/workflows/operator.yaml'

      - name: Evaluate scope and decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EVENT="${{ github.event_name }}"
          ACTION="${{ github.event.action }}"

          # ── Phase 1: Lifecycle scope ──────────────────────────────────
          # Two-tier CI: ci.yaml's fast gate covers PR iteration; the full
          # suite only runs for lifecycle/ready-to-merge (pre-merge gate)
          # and pushes to main.
          run_tests=false

          # workflow_dispatch: the orchestrator only dispatches the downstream
          # workflows (single-build chain) for PRs whose full suite should run —
          # the dispatch itself is the scope signal; no label evaluation here.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            run_tests=true
          elif [ "$EVENT" = "push" ]; then
            run_tests=true
          else
            # Non-lifecycle label events: skip the workflow run entirely.
            # Unlike other PR events, we do NOT need to evaluate lifecycle
            # state here — the workflow already ran (or will run) for the
            # synchronize/opened event on the same SHA, so the gate result
            # from that run is authoritative.
            if [ "$ACTION" = "labeled" ]; then
              LABEL='${{ github.event.label.name }}'
              if [[ "$LABEL" != lifecycle/* ]]; then
                echo "lifecycle-ready=skip" >> "$GITHUB_OUTPUT"
                for out in run-build run-unit-tests run-scalpel-report run-integration run-extras run-sdk run-cli run-operator run-console-plugin run-go-sdk-freshness; do
                  echo "$out=false" >> "$GITHUB_OUTPUT"
                done
                echo "scalpel-enabled=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi

            # Fetch current labels and draft status from the API (event payload
            # can be stale)
            PR_NUMBER='${{ github.event.pull_request.number }}'
            PR_JSON=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '{labels: [.labels[].name], draft: .draft}')
            LABELS=$(echo "$PR_JSON" | jq -c '.labels')
            IS_DRAFT=$(echo "$PR_JSON" | jq -r '.draft')
            has_label() { echo "$LABELS" | jq -e "index(\"$1\")" > /dev/null 2>&1; }

            # Drafts are outside the lifecycle — no CI, regardless of any
            # lifecycle labels left over from before the PR was converted back
            # to draft (the orchestrator strips them, but that races with this).
            if [ "$IS_DRAFT" = "true" ]; then
              echo "lifecycle-ready=skip" >> "$GITHUB_OUTPUT"
              for out in run-build run-unit-tests run-scalpel-report run-integration run-extras run-sdk run-cli run-operator run-console-plugin run-go-sdk-freshness; do
                echo "$out=false" >> "$GITHUB_OUTPUT"
              done
              echo "scalpel-enabled=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Orchestrator-initiated branch update for merge: the full suite
            # MUST run on the rebased SHA. The pre-rebase HEAD only passed the
            # fast gate (two-tier CI), so there is no "already tested" shortcut.

            if has_label "orchestrator/disabled"; then
              if has_label "DO NOT MERGE"; then
                run_tests=false
              else
                run_tests=true
              fi
            else
              # Two-tier CI: PR iteration is covered by the fast gate in ci.yaml
              # (<= 5 min, compile + smoke). The full suite here is the
              # pre-merge gate and only runs once a maintainer marks the PR
              # lifecycle/ready-to-merge. lifecycle/ready-for-review no longer
              # triggers full CI.
              if has_label "lifecycle/ready-to-merge"; then
                run_tests=true
              else
                # lifecycle/new, lifecycle/ready-for-review or no lifecycle label
                run_tests=false
              fi
            fi
          fi

          # ── Phase 2: Read change-detection results ────────────────────
          JAVA='${{ steps.filter.outputs.java }}'
          UI='${{ steps.filter.outputs.ui }}'
          INTEGRATION='${{ steps.filter.outputs.integration }}'
          SDK='${{ steps.filter.outputs.sdk }}'
          CLI='${{ steps.filter.outputs.cli }}'
          OPERATOR='${{ steps.filter.outputs.operator }}'
          CONSOLE_PLUGIN='${{ steps.filter.outputs.console-plugin }}'
          GO_SDK_GEN='${{ steps.filter.outputs.go-sdk-gen }}'
          CI='${{ steps.filter.outputs.ci }}'
          CI_OPERATOR='${{ steps.filter.outputs.ci-operator }}'

          # ── Phase 3: Combine scope + changes into per-phase decisions ─
          # decide <output-name> <scope-flag> <change-flags...>
          # Outputs true when scope is active AND at least one flag is true.
          decide() {
            local name="$1" scope="$2"; shift 2
            if [ "$scope" != "true" ]; then
              echo "$name=false" >> "$GITHUB_OUTPUT"; return
            fi
            for flag in "$@"; do
              if [ "$flag" = "true" ]; then
                echo "$name=true" >> "$GITHUB_OUTPUT"; return
              fi
            done
            echo "$name=false" >> "$GITHUB_OUTPUT"
          }

          # RUN_ALL covers both push-to-main and the orchestrator's workflow_dispatch
          # calls (single-build dispatch chain): both mean "run the full suite
          # unconditionally for this SHA", so change-detection accuracy doesn't matter
          # for those two triggers — path-filter output above may not even reflect the
          # right diff for workflow_dispatch (no PR base to diff against, and the
          # checked-out ref may not have history), and it doesn't need to: the
          # orchestrator only dispatches when it has already decided the suite runs.
          RUN_ALL=$( ([ "$EVENT" = "push" ] || [ "$EVENT" = "workflow_dispatch" ]) && echo true || echo false )

          echo "lifecycle-ready=$run_tests" >> "$GITHUB_OUTPUT"
          decide run-build       "$run_tests" "$RUN_ALL" "$JAVA" "$UI" "$SDK" "$CLI" "$CI"
          decide run-unit-tests  "$run_tests" "$RUN_ALL" "$JAVA" "$CI"
          # Report only when java sources changed: .github-only PRs trip
          # scalpel.disableTriggers and would produce an empty report.
          decide run-scalpel-report "$run_tests" "$JAVA"
          decide run-integration "$run_tests" "$RUN_ALL" "$INTEGRATION" "$CI"
          decide run-extras      "$run_tests" "$RUN_ALL" "$JAVA" "$UI" "$CI"
          decide run-sdk         "$run_tests" "$RUN_ALL" "$SDK" "$JAVA" "$CI"
          decide run-cli         "$run_tests" "$CLI"
          decide run-operator        "$run_tests" "$RUN_ALL" "$OPERATOR" "$CI_OPERATOR"
          decide run-console-plugin  "$run_tests" "$RUN_ALL" "$CONSOLE_PLUGIN" "$CI"
          decide run-go-sdk-freshness "$run_tests" "$GO_SDK_GEN" "$CI"

          # Scalpel (affected-module detection) can be disabled via PR label
          if [ "$EVENT" != "push" ] && has_label "ci/disable-scalpel"; then
            echo "scalpel-enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "scalpel-enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save decision summary
        if: github.event_name == 'pull_request' && steps.decide.outputs.lifecycle-ready != 'skip'
        run: |
          cat > /tmp/verify-decisions.json << 'ARTIFACT_EOF'
          {
            "lifecycle-ready": "${{ steps.decide.outputs.lifecycle-ready }}",
            "run-build": "${{ steps.decide.outputs.run-build }}",
            "run-unit-tests": "${{ steps.decide.outputs.run-unit-tests }}",
            "run-scalpel-report": "${{ steps.decide.outputs.run-scalpel-report }}",
            "run-integration": "${{ steps.decide.outputs.run-integration }}",
            "run-extras": "${{ steps.decide.outputs.run-extras }}",
            "run-sdk": "${{ steps.decide.outputs.run-sdk }}",
            "run-cli": "${{ steps.decide.outputs.run-cli }}",
            "run-operator": "${{ steps.decide.outputs.run-operator }}",
            "run-console-plugin": "${{ steps.decide.outputs.run-console-plugin }}",
            "run-go-sdk-freshness": "${{ steps.decide.outputs.run-go-sdk-freshness }}",
            "scalpel-enabled": "${{ steps.decide.outputs.scalpel-enabled }}"
          }
          ARTIFACT_EOF
          cat > /tmp/verify-changes.json << 'ARTIFACT_EOF'
          {
            "java": "${{ steps.filter.outputs.java }}",
            "ui": "${{ steps.filter.outputs.ui }}",
            "integration": "${{ steps.filter.outputs.integration }}",
            "sdk": "${{ steps.filter.outputs.sdk }}",
            "cli": "${{ steps.filter.outputs.cli }}",
            "go-sdk-gen": "${{ steps.filter.outputs.go-sdk-gen }}",
            "operator": "${{ steps.filter.outputs.operator }}",
            "console-plugin": "${{ steps.filter.outputs.console-plugin }}",
            "ci": "${{ steps.filter.outputs.ci }}"
          }
          ARTIFACT_EOF

      - name: Upload decision summary
        if: github.event_name == 'pull_request' && steps.decide.outputs.lifecycle-ready != 'skip'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verify-decisions
          retention-days: 1
          path: |
            /tmp/verify-decisions.json
            /tmp/verify-changes.json
