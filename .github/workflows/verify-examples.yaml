name: Examples

# Runs every runnable example against the images built for this commit, and compiles the Java
# examples. Called from verify.yaml when Decide sets run-examples.
#
# A runnable example is examples/<name>/ with an executable demo.sh and a Compose file
# (.github/scripts/discover-examples.sh lists them). For each one, in its own job:
#   docker compose up -d   (images missing locally are pulled, with retries)
#   ./demo.sh              must exit 0
#   ./demo.sh              again: an example must be safe to run twice
#   CI_SUITE script        optional (ci.env): the example's own suite, once, after both runs, with the stack still up;
#                          its artifacts are uploaded as example-ci-<name> (see examples/TEMPLATE.md)
#   docker compose down -v
# Compose files select the images under test through REGISTRY_IMAGE, REGISTRY_UI_IMAGE and
# MCP_SERVER_IMAGE (UI_IMAGE is also set for older examples), defaulting to latest-snapshot for
# local runs. Every Apicurio Registry image an example runs must be one built for this commit: the
# job fails if the stack would use any other (for example a published snapshot).
# Optional per-example settings live in examples/<name>/ci.env; see examples/TEMPLATE.md. With
# CI_NEEDS_BUILD=true the job also sets up a JDK and the Maven cache and runs the example's
# build.sh, so demo.sh can run Java clients built from this commit (snapshots are not published).
# CI_TOOLCHAINS also sets up Go, Node.js or Python, for an example with clients in those languages.

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: '21'
      image-tag:
        type: string
        required: true
        description: 'Docker image tag to test (commit SHA)'

permissions:
  contents: read

jobs:
  discover:
    name: Discover Examples
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      examples: ${{ steps.discover.outputs.examples }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: List runnable examples
        id: discover
        run: |
          examples=$(.github/scripts/discover-examples.sh)
          echo "Examples: $examples"
          echo "examples=$examples" >> "$GITHUB_OUTPUT"

  run:
    name: Example ${{ matrix.example.name }}${{ matrix.example.variant && format(' ({0})', matrix.example.variant) || '' }}
    needs: discover
    if: needs.discover.outputs.examples != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.example.timeout }}
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.discover.outputs.examples) }}
    defaults:
      run:
        working-directory: examples/${{ matrix.example.name }}
    env:
      REGISTRY_IMAGE: apicurio/apicurio-registry:${{ inputs.image-tag }}
      REGISTRY_UI_IMAGE: apicurio/apicurio-registry-ui:${{ inputs.image-tag }}
      UI_IMAGE: apicurio/apicurio-registry-ui:${{ inputs.image-tag }}
      # The CI_MATRIX value this job runs, if the example has one (see examples/TEMPLATE.md). It is
      # also the Compose profile: the image check, start, logs and stop steps then cover the
      # variant's services (an example with a matrix puts each variant in a profile of that name).
      CI_VARIANT: ${{ matrix.example.variant }}
      COMPOSE_PROFILES: ${{ matrix.example.variant }}
      MCP_SERVER_IMAGE: apicurio/apicurio-registry-mcp-server:${{ inputs.image-tag }}
      # The re-augmentable ("-mutable") registry image, for examples that add Java providers to it
      REGISTRY_MUTABLE_IMAGE: apicurio/apicurio-registry:${{ inputs.image-tag }}-mutable
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: apicurio/apicurio-github-actions/load-docker-image@bd19cbe33797325a571cd7ffd58f639b62e128a2 # v2
        with:
          artifact-name: apicurio-registry-${{ inputs.image-tag }}.tar
          image-file: /tmp/apicurio-registry-${{ inputs.image-tag }}.tar
          image-name: apicurio/apicurio-registry
          tag: ${{ inputs.image-tag }}

      - uses: apicurio/apicurio-github-actions/load-docker-image@bd19cbe33797325a571cd7ffd58f639b62e128a2 # v2
        with:
          artifact-name: apicurio-registry-ui-${{ inputs.image-tag }}.tar
          image-file: /tmp/apicurio-registry-ui-${{ inputs.image-tag }}.tar
          image-name: apicurio/apicurio-registry-ui
          tag: ${{ inputs.image-tag }}

      - uses: apicurio/apicurio-github-actions/load-docker-image@bd19cbe33797325a571cd7ffd58f639b62e128a2 # v2
        with:
          artifact-name: apicurio-registry-mcp-server-${{ inputs.image-tag }}.tar
          image-file: /tmp/apicurio-registry-mcp-server-${{ inputs.image-tag }}.tar
          image-name: apicurio/apicurio-registry-mcp-server
          tag: ${{ inputs.image-tag }}

      - uses: apicurio/apicurio-github-actions/load-docker-image@bd19cbe33797325a571cd7ffd58f639b62e128a2 # v2
        if: matrix.example.mutableImage
        with:
          artifact-name: apicurio-registry-${{ inputs.image-tag }}-mutable.tar
          image-file: /tmp/apicurio-registry-${{ inputs.image-tag }}-mutable.tar
          image-name: apicurio/apicurio-registry
          tag: ${{ inputs.image-tag }}-mutable

      - name: Set up JDK ${{ inputs.java-version }}
        if: matrix.example.build
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - name: Restore Maven cache
        if: matrix.example.build
        uses: ./.github/actions/setup-maven-cache

      # CI_TOOLCHAINS: clients in other languages (versions as in verify-sdk.yaml)
      - name: Set up Go
        if: contains(matrix.example.toolchains, 'go')
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27.4'
          cache: false

      - name: Set up Node
        if: contains(matrix.example.toolchains, 'node')
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.3'

      - name: Set up Python
        if: contains(matrix.example.toolchains, 'python')
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15.2'

      - name: Build the example's Java parts (build.sh)
        if: matrix.example.build
        env:
          # Maven 3.9+ reads MAVEN_ARGS: the CI mirrors and quieter output
          MAVEN_ARGS: -s ${{ github.workspace }}/.github/ci-settings.xml --no-transfer-progress
        run: ./build.sh

      - name: Apply ci.env
        run: |
          # Every line except comments and the CI_* runner settings becomes job environment.
          if [ -f ci.env ]; then
            sed -E '/^[[:space:]]*(#|$)/d; /^CI_/d' ci.env | tee -a "$GITHUB_ENV"
          fi

      - name: Check that the stack runs this commit's images
        # Without a Compose file, demo.sh deploys REGISTRY_IMAGE and REGISTRY_UI_IMAGE itself
        if: matrix.example.compose
        env:
          TAG: ${{ inputs.image-tag }}
          RELEASED: ${{ matrix.example.releasedImages }}
        run: |
          # An Apicurio Registry image with any other tag (latest-snapshot, a release) would test
          # published code instead of this commit's, and pass while the change is broken (the
          # "-mutable" variant of this commit's image is this commit's too). Released
          # images the example runs on purpose (CI_RELEASED_IMAGES) are exempt.
          # Base images of locally built services (build args) count too
          images=$( (docker compose config --images; docker compose config --format json \
            | jq -r '.services[].build.args // {} | .[]') | sort -u)
          echo "$images"
          stale=$(echo "$images" | grep -E '(^|/)apicurio-registry[a-z-]*:' | grep -vE ":$TAG(-mutable)?\$" \
            | grep -vxF -f <(printf '%s\n' $RELEASED) || true)
          if [ -n "$stale" ]; then
            echo "::error::these images are not built from this commit; select them with REGISTRY_IMAGE, REGISTRY_UI_IMAGE, REGISTRY_MUTABLE_IMAGE or MCP_SERVER_IMAGE (see examples/TEMPLATE.md):"
            echo "$stale"
            exit 1
          fi

      - name: Start the stack
        # A self-managed example starts its own containers in demo.sh
        if: ${{ !matrix.example.selfManaged }}
        run: |
          # Images not built here (Keycloak, Varnish, ...) come from public registries, which can
          # rate-limit or fail transiently; retry before failing the example.
          for attempt in 1 2 3; do
            if docker compose up -d --pull missing; then exit 0; fi
            echo "::warning::docker compose up failed (attempt $attempt of 3); retrying in 20s"
            sleep 20
          done
          echo "::error::the stack did not start"
          exit 1

      - name: Run demo.sh
        run: ./demo.sh

      - name: Run demo.sh again (must be safe to repeat)
        run: ./demo.sh

      # An example's own checks beyond its demo (CI_SUITE in ci.env, see examples/TEMPLATE.md): its unit, lifecycle, scenario and browser
      # suites, run against this commit's images with the example's stack still up. One explicit step per job, after both demo runs.
      # Its exit status is the step's: no continue-on-error.
      - name: Install the browser's system packages
        if: matrix.example.playwrightDir != ''
        timeout-minutes: 15
        env:
          PLAYWRIGHT_DIR: ${{ matrix.example.playwrightDir }}
        run: |
          # The example's locked packages, then the operating system packages its Chromium needs, from the same pinned Playwright. This is
          # the only privileged installation, and it is here: the example's own scripts never install system packages. sudo resets PATH,
          # so the Node.js of the toolchain step is passed through.
          npm ci --prefix "$PLAYWRIGHT_DIR"
          sudo env "PATH=$PATH" "$PLAYWRIGHT_DIR/node_modules/.bin/playwright" install-deps chromium

      - name: Run the example's CI suite
        if: matrix.example.suite != ''
        env:
          CI_SUITE_SCRIPT: ${{ matrix.example.suite }}
          # A new directory per job: the suite refuses a used one, so no result of an earlier run can be mixed in
          CI_ARTIFACT_DIR: ${{ runner.temp }}/example-ci-${{ matrix.example.name }}
          # Podman is also installed on the runner and preferred by the example's scripts; the images of this commit are loaded into Docker
          CONTAINER_RUNTIME: docker
        run: ./"$CI_SUITE_SCRIPT"

      # Also on failure and cancellation: that is when the evidence is needed. Only publish/ leaves the runner: the suite's collector copies
      # into it the files an allowlist names and verification accepts (screenshots, results, failure screenshots and safe traces, a checked
      # report, phase and container logs, a summary), and never a raw run state, a stale file, a link or a file that fails its check. See
      # the example's GUIDE.md, "In CI".
      - name: Upload the example's CI artifacts
        if: always() && matrix.example.suite != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: example-ci-${{ matrix.example.name }}
          path: ${{ runner.temp }}/example-ci-${{ matrix.example.name }}/publish
          if-no-files-found: warn
          retention-days: 14

      # Also on cancelled(): a job that reaches its timeout is cancelled, not failed, and a hang is
      # exactly when the logs are needed.
      - name: Stack logs
        if: (failure() || cancelled()) && matrix.example.compose
        run: docker compose logs --no-color > "$RUNNER_TEMP/compose.log" 2>&1; tail -300 "$RUNNER_TEMP/compose.log"

      - name: Upload stack logs
        if: (failure() || cancelled()) && matrix.example.compose
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: example-logs-${{ matrix.example.name }}${{ matrix.example.variant && format('-{0}', matrix.example.variant) || '' }}
          path: ${{ runner.temp }}/compose.log

      - name: Stop the stack
        if: always() && matrix.example.compose
        run: docker compose down -v

  compile-java:
    name: Compile Java Examples
    runs-on: ubuntu-latest
    timeout-minutes: 30  # longest green run of the former build-examples job, week to 2026-10-01: 13 min
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - name: Restore Maven cache
        uses: ./.github/actions/setup-maven-cache

      - name: Download Build Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: build-artifacts-${{ inputs.image-tag }}
          path: .

      - name: Restore executable permissions
        run: |
          # GitHub Actions artifact upload/download doesn't preserve executable permissions
          # Restore execute permission on protoc binaries
          find . -name "protoc-*" -type f -exec chmod +x {} \; 2>/dev/null || true
          find . -name "*.exe" -path "*/protoc-plugins/*" -type f -exec chmod +x {} \; 2>/dev/null || true

      - uses: apicurio/apicurio-github-actions/load-docker-image@bd19cbe33797325a571cd7ffd58f639b62e128a2 # v2
        with:
          artifact-name: apicurio-registry-${{ inputs.image-tag }}.tar
          image-file: /tmp/apicurio-registry-${{ inputs.image-tag }}.tar
          image-name: apicurio/apicurio-registry
          tag: ${{ inputs.image-tag }}

      # The *-maven-with-references examples register their schemas with the Maven plugin
      # during the build, against this registry on localhost:8080.
      - name: Run Apicurio Registry application
        run: |
          docker run -d -p 8080:8080 apicurio/apicurio-registry:${{ inputs.image-tag }}
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8080/apis/registry/v3/system/info > /dev/null && exit 0
            sleep 2
          done
          echo "::error::the registry did not start"
          exit 1

      - name: Build Apicurio Registry with Examples
        run: |
          # -T 1: single-threaded (overrides .mvn/maven.config's -T 1C to prevent module ordering issues with examples)
          # -Pexamples: activates the examples profile (builds example applications)
          # -Dassembly.skipAssembly=true: skip archive generation (not needed for example compilation)
          # -Daether.syncContext.named.factory=noop: prevent Maven 3.9+ resolver lock deadlocks under -T
          mvn -s ${{ github.workspace }}/.github/ci-settings.xml install -T 1 -DskipTests -Pexamples -Dassembly.skipAssembly=true -Daether.syncContext.named.factory=noop --no-transfer-progress

