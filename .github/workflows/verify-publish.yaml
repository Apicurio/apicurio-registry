name: Publish Images

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      image-tag:
        type: string
        required: true
        description: 'Docker image tag (commit SHA)'
      snapshot-tag:
        type: string
        required: false
        default: 'latest-snapshot'
        description: 'Snapshot tag prefix (e.g. latest-snapshot or 3.3.x-snapshot)'
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_PASSWORD:
        required: true
      QUAY_USERNAME:
        required: true
      QUAY_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  # A retried Verify run can pass after a newer commit was published: publish
  # only a commit newer than the ones the snapshot images were built from
  # (#10380). Every image counts, because the jobs below run in parallel and a
  # newer run can have published some of them and failed on the rest. The
  # caller runs this workflow one at a time per branch.
  guard:
    name: Newer Than Published
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.guard.outputs.publish }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/actions

      - name: Compare with the published commits
        id: guard
        uses: ./.github/actions/newer-than-published
        with:
          images: |
            quay.io/apicurio/apicurio-registry:${{ inputs.snapshot-tag }}
            quay.io/apicurio/apicurio-registry:${{ inputs.snapshot-tag }}-mutable
            quay.io/apicurio/apicurio-registry-mcp-server:${{ inputs.snapshot-tag }}
            quay.io/apicurio/apicurio-registry-ui:${{ inputs.snapshot-tag }}
            quay.io/apicurio/apicurio-registry-gitops-sync:${{ inputs.snapshot-tag }}
            quay.io/apicurio/apicurio-registry-support-chat:${{ inputs.snapshot-tag }}

  publish-app-image:
    name: Publish App Docker Image
    needs: [guard]
    if: needs.guard.outputs.publish == 'true'
    uses: ./.github/workflows/reusable-docker-build.yaml
    with:
      image-name: 'apicurio/apicurio-registry'
      dockerfile: './distro/docker/target/docker/Dockerfile.jvm'
      context: './distro/docker/target/docker'
      tag: ${{ inputs.snapshot-tag }}
      maven-build: false
      download-artifact: 'build-artifacts-${{ inputs.image-tag }}'
      platforms: 'linux/amd64,linux/arm64'
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}

  publish-app-mutable-image:
    name: Publish App Docker Image (mutable)
    needs: [guard]
    if: needs.guard.outputs.publish == 'true'
    uses: ./.github/workflows/reusable-docker-build.yaml
    with:
      image-name: 'apicurio/apicurio-registry'
      dockerfile: './distro/docker/target/docker/Dockerfile.mutable.jvm'
      context: './distro/docker/target/docker'
      tag: '${{ inputs.snapshot-tag }}-mutable'
      maven-build: false
      download-artifact: 'build-artifacts-${{ inputs.image-tag }}'
      platforms: 'linux/amd64,linux/arm64'
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}

  publish-mcp-image:
    name: Publish MCP Server Docker Image
    needs: [guard]
    if: needs.guard.outputs.publish == 'true'
    uses: ./.github/workflows/reusable-docker-build.yaml
    with:
      image-name: 'apicurio/apicurio-registry-mcp-server'
      dockerfile: './mcp/target/docker/Dockerfile.jvm'
      context: './mcp/target/docker'
      tag: ${{ inputs.snapshot-tag }}
      push-to-dockerhub: false
      maven-build: false
      download-artifact: 'build-artifacts-${{ inputs.image-tag }}'
      platforms: 'linux/amd64,linux/arm64'
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}

  publish-ui-image:
    name: Publish UI Docker Image
    needs: [guard]
    if: needs.guard.outputs.publish == 'true'
    uses: ./.github/workflows/reusable-docker-build.yaml
    with:
      image-name: 'apicurio/apicurio-registry-ui'
      dockerfile: './ui/Dockerfile'
      context: './ui'
      tag: ${{ inputs.snapshot-tag }}
      npm-build: true
      npm-build-dir: 'ui'
      platforms: 'linux/amd64,linux/arm64'
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}

  publish-gitops-sync-image:
    name: Publish GitOps Sync Docker Image
    needs: [guard]
    if: needs.guard.outputs.publish == 'true'
    uses: ./.github/workflows/reusable-docker-build.yaml
    with:
      image-name: 'apicurio/apicurio-registry-gitops-sync'
      dockerfile: './distro/gitops/Dockerfile'
      context: './distro/gitops'
      tag: ${{ inputs.snapshot-tag }}
      push-to-dockerhub: false
      platforms: 'linux/amd64,linux/arm64'
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}

  publish-support-chat-image:
    name: Publish Support Chat Docker Image
    needs: [guard]
    if: needs.guard.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build support-chat module
        working-directory: support-chat
        run: mvn -s ${{ github.workspace }}/.github/ci-settings.xml package -DskipTests --no-transfer-progress

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Quay.io Registry
        run: docker login -u "${{ secrets.QUAY_USERNAME }}" -p "${{ secrets.QUAY_PASSWORD }}" quay.io

      - name: Build and Push Image
        uses: Apitomy/apitomy-github-actions/retry@e10e64b8a9ca86982f45a1ea512847219ae2605e # v1.0.1
        with:
          timeout-minutes: 45
          max-attempts: 3
          initial-delay: 30
          command: |
            docker buildx build \
              --push \
              --file ./support-chat/src/main/docker/Dockerfile.jvm \
              --platform linux/amd64,linux/arm64 \
              --label org.opencontainers.image.revision=${{ github.sha }} \
              --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
              --tag quay.io/apicurio/apicurio-registry-support-chat:${{ inputs.snapshot-tag }} \
              ./support-chat
