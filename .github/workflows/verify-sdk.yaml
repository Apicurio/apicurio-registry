name: SDK Verification

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: '21'
      image-tag:
        type: string
        required: true
        description: 'Docker image tag to test'
      build-run-id:
        type: string
        required: true
        description: 'quick-check.yaml run id to download the Docker image from (see verify-await-build.yaml)'

permissions:
  contents: read
  actions: read

jobs:
  verify-python-sdk:
    name: Verify Python SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14.7'

      - name: Install Poetry
        uses: snok/install-poetry@d45b6d76012debf457ab49dffc7fb7b2efe8071d

      - name: Install the package
        working-directory: python-sdk
        run: make install

      - name: Check linting
        working-directory: python-sdk
        run: make lint-check

      - name: Download Docker Image Artifact (cross-run)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: 'apicurio-registry-${{ inputs.image-tag }}.tar'
          path: /tmp
          run-id: ${{ inputs.build-run-id }}
          github-token: ${{ github.token }}

      - uses: apicurio/apicurio-github-actions/load-docker-image@ecae58cc1a9b5eeb810b90f8a9e15d2266a371d3 # v2
        with:
          download: 'false'
          image-file: '/tmp/apicurio-registry-${{ inputs.image-tag }}.tar'
          image-name: 'apicurio/apicurio-registry'
          tag: '${{ inputs.image-tag }}'

      - name: Run the tests
        working-directory: python-sdk
        run: |
          docker run -d -p 8080:8080 apicurio/apicurio-registry:${{ inputs.image-tag }}
          sleep 5
          make test

  verify-go-sdk:
    name: Verify Go SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Go - Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.0'

      - name: Download Docker Image Artifact (cross-run)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: 'apicurio-registry-${{ inputs.image-tag }}.tar'
          path: /tmp
          run-id: ${{ inputs.build-run-id }}
          github-token: ${{ github.token }}

      - uses: apicurio/apicurio-github-actions/load-docker-image@ecae58cc1a9b5eeb810b90f8a9e15d2266a371d3 # v2
        with:
          download: 'false'
          image-file: '/tmp/apicurio-registry-${{ inputs.image-tag }}.tar'
          image-name: 'apicurio/apicurio-registry'
          tag: '${{ inputs.image-tag }}'

      - name: Run the tests
        working-directory: go-sdk
        run: |
          docker run -d -p 8080:8080 apicurio/apicurio-registry:${{ inputs.image-tag }}
          sleep 5
          make test
