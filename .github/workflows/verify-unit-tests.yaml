name: Unit Tests

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: '21'
      image-tag:
        type: string
        required: true
        description: 'Build artifact identifier (commit SHA)'

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          # app-rest used to be a single shard and was the PR critical path at ~35 min
          # (61 classes, 3x the next shard). It is now split three ways: v3 (the bulk),
          # ccompat, and a misc shard for the remaining rest subpackages (v2, mcptools,
          # a2a, root-level classes). app-rest-misc must exclude everything app-rest-v3
          # includes; .github/scripts/verify-test-shards.py enforces the partition.
          - name: app-rest-v3
            modules: "-pl app -am -Dfull -DcliSkipNative"
            test-filter: "-Dtest=io.apicurio.registry.noprofile.rest.v3.**"
            group-filter: ""
            maven-opts: "-Xmx4g -Dassembly.skipAssembly=true"
            surefire-opts: "-Dsurefire.forkCount=2"
          - name: app-ccompat
            modules: "-pl app -am -Dfull -DcliSkipNative"
            test-filter: "-Dtest=io.apicurio.registry.noprofile.ccompat.**"
            group-filter: ""
            maven-opts: "-Xmx4g -Dassembly.skipAssembly=true"
            surefire-opts: ""
          - name: app-rest-misc
            modules: "-pl app -am -Dfull -DcliSkipNative"
            test-filter: "-Dtest=io.apicurio.registry.noprofile.rest.**,!io.apicurio.registry.noprofile.rest.v3.**"
            group-filter: ""
            maven-opts: "-Xmx4g -Dassembly.skipAssembly=true"
            surefire-opts: ""
          - name: app-sql
            modules: "-pl app -am -Dfull -DcliSkipNative"
            test-filter: "-Dtest=io.apicurio.registry.storage.impl.sql.**,io.apicurio.registry.storage.impl.search.**,io.apicurio.registry.storage.impl.polling.**,io.apicurio.registry.storage.impl.readonly.**,io.apicurio.registry.storage.decorator.**,io.apicurio.registry.storage.dto.**,io.apicurio.registry.event.sql.**"
            group-filter: ""
            maven-opts: "-Xmx4g -Dassembly.skipAssembly=true"
          - name: app-kafkasql
            modules: "-pl app -am -Dfull -DcliSkipNative"
            test-filter: "-Dtest=io.apicurio.registry.storage.impl.kafkasql.**,io.apicurio.registry.event.kafkasql.**"
            group-filter: ""
            maven-opts: "-Xmx4g -Dassembly.skipAssembly=true"
          - name: app-gitops
            modules: "-pl app -am -Dfull -DcliSkipNative"
            test-filter: "-Dtest=io.apicurio.registry.storage.impl.gitops.**"
            group-filter: ""
            maven-opts: "-Xmx4g -Dassembly.skipAssembly=true"
          - name: app-kubernetesops
            modules: "-pl app -am -Dfull -DcliSkipNative"
            test-filter: "-Dtest=io.apicurio.registry.storage.impl.kubernetesops.**"
            group-filter: ""
            maven-opts: "-Xmx4g -Dassembly.skipAssembly=true"
          # app-auth / app-transport / app-metrics are carved out of app-other. Each @TestProfile in a
          # shard forces Quarkus to tear down and rebuild the application in the single forked JVM
          # (forkCount=1 with the default reuseForks=true), and app-other had accumulated 42 distinct
          # profiles across 147 classes -- four times the next-densest shard. That is what exhausted the
          # heap and pushed the shard past an hour. These three groups are the profile-dense clusters.
          # See issue #9265.
          #
          # Unlike the other app-* shards, these three select by JUnit @Tag (ApicurioTestTags.AUTH /
          # TRANSPORT / METRICS) instead of a -Dtest= package pattern: the tag lives on the test class
          # itself, so a new test gets the right shard at creation time instead of silently landing in
          # app-other. test-filter stays -Dtest=io.apicurio.registry.** so surefire considers every class
          # in the app test tree a tag-filter candidate, since its default file-name discovery
          # (Test*/*Test/*Tests/*TestCase) would otherwise skip classes named like AuthTestNoRoles before
          # the tag filter ever runs. See issue #9302. The -Dgroups= value lives in its own group-filter
          # key rather than appended to test-filter, so the run step never has to word-split a single
          # matrix value into two -D properties.
          #
          # That same io.apicurio.registry.** wildcard makes surefire discover/classload every class in
          # the app test tree for tag filtering, not just the tagged subset that actually runs -- unlike
          # the other app-* shards, whose test-filter already scopes discovery to one small package. The
          # wider discovery footprint pushed these three shards' forked JVM past the 4g default
          # (app/pom.xml surefire.maxHeap) into OutOfMemoryError: Java heap space. extra-opts raises it
          # to 6g via the -Dsurefire.maxHeap override the pom documents for this; ubuntu-latest runners
          # have 16g RAM, so 4g (MAVEN_OPTS, sizes the Maven process, not the test fork) + 6g (surefire
          # fork) still leaves headroom. See issue #9328.
          - name: app-auth
            modules: "-pl app -am -Dfull -DcliSkipNative"
            test-filter: "-Dtest=io.apicurio.registry.**"
            group-filter: "-Dgroups=auth"
            maven-opts: "-Xmx4g -Dassembly.skipAssembly=true"
            extra-opts: "-Dsurefire.maxHeap=6g"
          - name: app-transport
            modules: "-pl app -am -Dfull -DcliSkipNative"
            test-filter: "-Dtest=io.apicurio.registry.**"
            group-filter: "-Dgroups=transport"
            maven-opts: "-Xmx4g -Dassembly.skipAssembly=true"
            extra-opts: "-Dsurefire.maxHeap=6g"
          - name: app-metrics
            modules: "-pl app -am -Dfull -DcliSkipNative"
            test-filter: "-Dtest=io.apicurio.registry.**"
            group-filter: "-Dgroups=metrics"
            maven-opts: "-Xmx4g -Dassembly.skipAssembly=true"
            extra-opts: "-Dsurefire.maxHeap=6g"
          # Catch-all: stays an exclusion filter so a newly added package lands here rather than in no
          # shard at all. Every exclusion below must correspond to another shard's inclusion.
          - name: app-other
            modules: "-pl app -am -Dfull -DcliSkipNative"
            test-filter: "-Dtest=!io.apicurio.registry.noprofile.rest.**,!io.apicurio.registry.noprofile.ccompat.**,!io.apicurio.registry.storage.impl.sql.**,!io.apicurio.registry.storage.impl.search.**,!io.apicurio.registry.storage.impl.polling.**,!io.apicurio.registry.storage.impl.readonly.**,!io.apicurio.registry.storage.decorator.**,!io.apicurio.registry.storage.dto.**,!io.apicurio.registry.storage.impl.kafkasql.**,!io.apicurio.registry.storage.impl.gitops.**,!io.apicurio.registry.storage.impl.kubernetesops.**,!io.apicurio.registry.event.sql.**,!io.apicurio.registry.event.kafkasql.**,!io.apicurio.registry.auth.**,!io.apicurio.registry.rbac.**,!io.apicurio.registry.limits.**,!io.apicurio.registry.tls.**,!io.apicurio.registry.headers.**,!io.apicurio.registry.cors.**,!io.apicurio.registry.metrics.**,!io.apicurio.registry.search.**"
            group-filter: ""
            maven-opts: "-Xmx4g -Dassembly.skipAssembly=true"
          - name: non-app
            modules: "-Dfull -DcliSkipNative -pl !app,!distro/docker,!docs,!docs/config-generator,!docs/rest-api"
            test-filter: ""
            group-filter: ""
            maven-opts: "-Xmx4g"
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - name: Restore Maven cache
        uses: ./.github/actions/setup-maven-cache

      - name: Download Build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-artifacts-${{ inputs.image-tag }}
          path: .

      - name: Restore executable permissions
        run: |
          find . -name "protoc-*" -type f -exec chmod +x {} \; 2>/dev/null || true
          find . -name "*.exe" -path "*/protoc-plugins/*" -type f -exec chmod +x {} \; 2>/dev/null || true

      - name: Record start time
        id: timer
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run Unit Tests (${{ matrix.shard.name }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_OPTS: ${{ matrix.shard.maven-opts }}
        run: |
          # Each shard compiles the same modules but runs a different subset of tests via -Dtest=
          # and/or -Dgroups= filters (test-filter and group-filter are separate matrix keys, kept
          # apart rather than concatenated into one string, so this line never has to rely on the
          # shell word-splitting a single value into two -D properties).
          # Pre-built artifacts from the Build job are downloaded but Maven still needs to resolve/compile.
          # -Dsurefire.failIfNoSpecifiedTests=false: don't fail if a shard's test filter matches zero tests
          # -Dsurefire.rerunFailingTestsCount=1: automatically retry flaky tests once
          # -Daether.syncContext.named.factory=noop: prevent Maven 3.9+ resolver lock deadlocks under -T
          ./mvnw verify \
            --no-transfer-progress -s ${{ github.workspace }}/.github/ci-settings.xml \
            -Pprod ${{ matrix.shard.modules }} \
            ${{ matrix.shard.test-filter }} \
            ${{ matrix.shard.group-filter }} \
            ${{ matrix.shard.extra-opts }} \
            ${{ matrix.shard.surefire-opts }} \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -DskipCommitIdPlugin=true \
            -Dcheckstyle.skip=true \
            -Dmaven.source.skip=true -Dmaven.javadoc.skip=true \
            -Daether.syncContext.named.factory=noop \
            -Dmaven.wagon.httpconnectionManager.maxTotal=30 \
            -Dmaven.wagon.http.retryHandler.count=5 \
            -Dsurefire.rerunFailingTestsCount=1

      - name: Check shard timing
        if: always()
        env:
          SHARD_NAME: ${{ matrix.shard.name }}
          START_TIME: ${{ steps.timer.outputs.start }}
        run: |
          elapsed=$(( $(date +%s) - START_TIME ))
          threshold=600
          if [ "$elapsed" -gt "$threshold" ]; then
            echo "::warning title=CI timing regression ($SHARD_NAME)::Shard $SHARD_NAME took ${elapsed}s (threshold: ${threshold}s). Investigate: cache miss, runner degradation, or new test overhead. See Discussion #8364."
          else
            echo "Shard $SHARD_NAME completed in ${elapsed}s (threshold: ${threshold}s)"
          fi

      - name: Parse Flaky Tests
        if: always()
        run: |
          python3 .github/scripts/parse-flaky-tests.py --reports-dir . --output-file flaky-tests-${{ matrix.shard.name }}.json

      - name: Upload Flaky Tests Artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flaky-tests-${{ matrix.shard.name }}
          path: flaky-tests-${{ matrix.shard.name }}.json
          retention-days: 1
