name: Verify

# The full test suite: lint, build, unit tests, CLI, SDKs, console plugin,
# integration tests, extra tests, operator tests, and (on push to main) image
# publishing. One Decide job, computed once, shared by every job below via
# needs: — there is exactly one answer to "is the full suite required for this
# SHA" per run, so nothing here can disagree with anything else about it.
#
# Two workflows make up the whole pipeline:
#   - quick-check.yaml — the fast PR gate (Quick Verify, <= 5 min, every push)
#   - verify.yaml (this file) — everything else. Decide runs it immediately
#     for trusted authors (maintainers / configured auto_accept identities,
#     e.g. Renovate) and, for everyone else, once the PR has a current
#     approving review — both native facts evaluated live by Decide, not a
#     bot-applied label, so there is no window where a stale run could
#     mid-flight disagree with a promotion that happened after it started.
#
# There is one Verify run per commit, from the push. When an approval makes
# the full suite required after that run skipped it, the orchestrator re-runs
# the same run (pr-lifecycle.js, maybeRunFullSuite, via review-relay.yaml)
# rather than this workflow starting a second one: a re-run keeps its check
# suite, so the PR shows one set of Verify checks per commit, and an
# approval never repeats a suite that already ran.
#
# The single required check for branch protection is the "Verification Gate"
# commit status, not a job in this file. The orchestrator (pr-lifecycle.yml,
# gate-status job) posts it from the Verify Result job below, taken from the
# newest Verify run for the PR head commit: pending while that run is going
# or while Decide has not required the full suite yet (author not yet
# trusted/reviewed), then success or failure. See the Verify Result job for
# why this is a status rather than the job's own check-run.

on:
  push:
    branches: [main, '3.3.x']
  # No labeled/unlabeled: a label change never alters the SHA, and a run it
  # started cancelled the in-flight suite (the push run for that SHA) and then
  # skipped everything, leaving a failed Verification Gate as the most recent
  # check-run — which re-running could not fix, since the re-run replays the
  # same label event. The one label Decide reads, orchestrator/disabled, is
  # handled by the orchestrator re-running this workflow when a maintainer
  # changes it (see handleLabelChange in pr-lifecycle.js).
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main, '3.3.x']
  # No pull_request_review: a review started a second run on a commit that
  # already had one. For a trusted author that repeated a full suite that had
  # already run, and every commit showed a (pull_request) and a
  # (pull_request_review) set of checks. Reviews reach the orchestrator through
  # review-relay.yaml instead, which re-runs this commit's run when the suite
  # becomes required.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A push supersedes the suite it interrupts — those results describe a SHA
  # nobody is merging, so cancelling them is right. Pushes are now the only
  # thing that starts a PR run here, so this can be unconditional again. It
  # used to exempt review-triggered runs: `pull_request_review: submitted`
  # fires for every reply in a review thread, and with cancellation each reply
  # restarted the whole suite for an unchanged SHA (six replies on #10167, six
  # runs, five cancelled).
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  decide:
    name: Decide
    uses: ./.github/workflows/verify-decide.yaml

  lint-and-validate:
    name: Lint and Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10  # longest green run, week to 2026-10-01: 0 min
    needs: decide
    if: needs.decide.outputs.lifecycle-ready == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run linter
        run: ./scripts/validate-files.sh

      # Fails if any app/ test class is claimed by zero shards (it would never run in CI, and
      # -Dsurefire.failIfNoSpecifiedTests=false means no shard would complain) or by more than
      # one (wasted runner time). Runs here rather than in verify-unit-tests.yaml so it is checked
      # once instead of once per shard, and so it fails fast. See issue #9265.
      - name: Verify unit test shard partition
        run: python3 .github/scripts/verify-test-shards.py

      # The scalpel summary suite runs in the Gate because scripts-tests.yaml
      # alone would leave a red suite non-blocking. It pins the extension
      # version's report schema and the buildAllIfNoChanges setting the
      # summary's projections stand on, and checks that every Scalpel run
      # gets the base branch from Decide.
      # jq is preinstalled on ubuntu-latest, the same assumption
      # scripts-tests.yaml makes.
      - name: Test scalpel summary script
        run: bash .github/scripts/scalpel-summary.test.sh

      - name: Test CI recovery paths
        run: python3 -m unittest discover -s .github/scripts -p 'test_ci_reliability.py' -v

      - name: Test operator catalog automation
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/mikefarah/yq/releases/download/v4.27.5/yq_linux_amd64 \
            --output "$RUNNER_TEMP/catalog-yq"
          chmod +x "$RUNNER_TEMP/catalog-yq"
          YQ="$RUNNER_TEMP/catalog-yq" python3 -m unittest discover -s operator/scripts -p 'test_catalog_automation.py' -v

      # Orchestrator scripts run with repo write permissions under
      # pull_request_target — their logic must be tested before merge.
      - name: Test PR lifecycle scripts
        run: node --test .github/scripts/pr-lifecycle.test.js

      - name: Test performance comparison result parser
        run: python3 -m unittest discover -s perf-comparison-tests/scripts -p 'test_*.py' -v

      - name: Test performance test result parsers
        run: python3 -m unittest discover -s perf-tests/scripts -p 'test_*.py' -v

      - name: Verify docs generation
        run: |
          if [ -n "$(git status --untracked-files=no --porcelain docs)" ]; then
            echo "Docs needs to be regenerated. Run 'mvn clean install -pl docs -am -DskipTests' and commit the resulting files in the 'docs' folder."
            git --no-pager diff docs
            exit 1
          fi

  build-java:
    name: Build Java Application (no tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30  # longest green run, week to 2026-10-01: 5 min
    needs: [decide]
    if: needs.decide.outputs.run-build == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Restore Maven cache
        uses: ./.github/actions/setup-maven-cache

      - name: Build Application (skip tests for speed)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # For downloading Kiota binary.
        run: |
          # -T 0.5C: half a thread per CPU core (overrides .mvn/maven.config's -T 1C for memory-heavy packaging)
          # -Pprod -Dfull: production profile with all optional modules (CLI, serdes, distro, etc.)
          # -DskipCommitIdPlugin=false: generate git commit metadata (needed for the Docker image)
          # -DcliSkipNative: skip GraalVM native-image for CLI (separate verify-cli job handles this)
          # -Daether.syncContext.named.factory=noop: prevent Maven 3.9+ resolver lock deadlocks under -T
          # -Dmaven.wagon.http*: limit concurrent HTTP connections and retry on transient download failures
          ./mvnw clean install -T 0.5C --no-transfer-progress -s ${{ github.workspace }}/.github/ci-settings.xml \
            -Pprod -Dfull -DskipTests -DskipCommitIdPlugin=false -DcliSkipNative \
            -Dmaven.source.skip=true -Dmaven.javadoc.skip=true \
            -Daether.syncContext.named.factory=noop \
            -Dmaven.wagon.httpconnectionManager.maxTotal=30 \
            -Dmaven.wagon.http.retryHandler.count=5

      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "[ERROR] Build produced uncommitted or untracked files. Generated files must either be committed or added to .gitignore as appropriate."
            git --no-pager diff
            git status
            exit 1
          fi

      - name: Build Docker Image
        run: |
          docker build -f ./distro/docker/target/docker/Dockerfile.jvm \
            -t apicurio/apicurio-registry:${{ github.sha }} \
            ./distro/docker/target/docker

      - name: Build Mutable Docker Image
        run: |
          docker build -f ./distro/docker/target/docker/Dockerfile.mutable.jvm \
            -t apicurio/apicurio-registry:${{ github.sha }}-mutable \
            ./distro/docker/target/docker

      - name: Smoke Test Re-augmentation of the Mutable Docker Image
        run: |
          docker run --rm apicurio/apicurio-registry:${{ github.sha }}-mutable /deployments/build.sh --prune

      - name: Save Docker Image
        uses: apicurio/apicurio-github-actions/save-docker-image@ecae58cc1a9b5eeb810b90f8a9e15d2266a371d3 # v2
        with:
          image-name: apicurio/apicurio-registry
          tag: '${{ github.sha }}'
          output-path: '/tmp/apicurio-registry-${{ github.sha }}.tar'
          artifact-name: 'apicurio-registry-${{ github.sha }}.tar'

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-artifacts-${{ github.sha }}
          path: |
            app/target/
            cli/target/
            common/target/
            contracts-rules/target/
            schema-resolver/target/
            config-index/*/target/
            distro/*/target/
            java-sdk/*/target/
            schema-util/*/target/
            schema-validation/*/target/
            serdes/*/*/target/
            utils/*/target/
            mcp/target/docker/
          retention-days: 1

  build-ui:
    name: Build UI Application
    runs-on: ubuntu-latest
    needs: [decide]
    if: needs.decide.outputs.run-build == 'true'
    # npm/vite occasionally hangs on a shared runner with no output; fail fast instead
    # of burning the workflow timeout. The whole job normally finishes in ~4 min.
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.21.0'
          cache: 'npm'
          cache-dependency-path: 'ui/**/package-lock.json'

      - name: Install Dependencies
        working-directory: ui
        run: npm install

      - name: Lint
        working-directory: ui
        run: npm run lint

      - name: Generate TypeScript SDK
        working-directory: typescript-sdk
        run: |
          npm install
          npm run generate-sources

      - name: Test
        working-directory: ui
        run: npm run test

      - name: Build
        working-directory: ui
        run: npm run build

      - name: Package
        working-directory: ui
        run: npm run package

      - name: Install Test Dependencies
        working-directory: ui/tests
        run: npm install

      - name: Lint Tests
        working-directory: ui/tests
        run: npm run lint

      - name: Build UI Docker Image
        working-directory: ui
        run: |
          docker build -t apicurio/apicurio-registry-ui:${{ github.sha }} .

      - name: Save UI Docker Image
        uses: apicurio/apicurio-github-actions/save-docker-image@ecae58cc1a9b5eeb810b90f8a9e15d2266a371d3 # v2
        with:
          image-name: apicurio/apicurio-registry-ui
          tag: '${{ github.sha }}'
          output-path: '/tmp/apicurio-registry-ui-${{ github.sha }}.tar'
          artifact-name: 'apicurio-registry-ui-${{ github.sha }}.tar'

  unit-tests:
    name: Unit Tests
    needs: [decide, build-java]
    if: needs.decide.outputs.run-unit-tests == 'true'
    uses: ./.github/workflows/verify-unit-tests.yaml
    with:
      image-tag: ${{ github.sha }}
      scalpel-enabled: ${{ needs.decide.outputs.scalpel-enabled }}
      scalpel-base-branch: ${{ needs.decide.outputs.scalpel-base-branch }}

  # Scalpel Report (affected-module detection, data collection only).
  # Not in the Gate: a failure here never blocks a PR.
  # See Discussion #8364 for the evaluation results that led to this change.
  # How to read the artifact, and the measured baseline it should be compared
  # against, are in README.md under "Reading the Scalpel report".
  scalpel-report:
    name: Scalpel Report
    needs: [decide]
    if: >-
      github.event_name == 'pull_request'
      && needs.decide.outputs.run-scalpel-report == 'true'
      && needs.decide.outputs.scalpel-enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: Scalpel diffs against the base branch
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Restore Maven cache
        uses: ./.github/actions/setup-maven-cache

      - name: Generate Scalpel report
        env:
          SCALPEL_BASE_BRANCH: ${{ needs.decide.outputs.scalpel-base-branch }}
        run: |
          # Scalpel writes the report at session start, before validate has
          # necessarily created target/ on the root aggregator. Keep this.
          mkdir -p target
          [ -n "$SCALPEL_BASE_BRANCH" ] || echo "::warning::No scalpel-base-branch from Decide, so Scalpel runs without scalpel.baseBranch"
          # CLI flags win over .mvn/maven.config (scalpel.enabled=false there).
          # reportFile restates the documented default so the upload path
          # below cannot drift if upstream changes it.
          # wagon flags: same transient-failure hardening as the other CI jobs.
          ./mvnw validate --no-transfer-progress \
            -s ${{ github.workspace }}/.github/ci-settings.xml \
            -Dscalpel.enabled=true \
            -Dscalpel.mode=report \
            ${SCALPEL_BASE_BRANCH:+"-Dscalpel.baseBranch=$SCALPEL_BASE_BRANCH"} \
            -Dscalpel.reportFile=target/scalpel-report.json \
            -Dmaven.wagon.httpconnectionManager.maxTotal=30 \
            -Dmaven.wagon.http.retryHandler.count=5

      # The report is self-describing from Scalpel 0.4.1 onwards: it carries the
      # build set, reactor and tested-module counts, and its skip shape names the
      # status, reason and trigger file. The script turns that into the run
      # summary and the artifact copy. It lives under .github/scripts so it can
      # be unit tested; see scripts-tests.yaml.
      - name: Summarize Scalpel report
        if: ${{ !cancelled() }}
        run: |
          summary=target/scalpel-report-summary.md
          # This step also runs when Generate failed, so target/ may not exist.
          mkdir -p target
          # Written aside and moved into place. A redirect straight onto the
          # final path truncates it before the script starts, so a script that
          # died partway would upload a header and nothing else. A missing file
          # is the honest outcome, and the upload step only warns on one.
          bash .github/scripts/scalpel-summary.sh \
            target/scalpel-report.json > "$summary.tmp"
          mv "$summary.tmp" "$summary"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"

      # A failed build is when the offline artifact is wanted most: Scalpel
      # writes the report at session start, so it survives a later failure.
      - name: Upload Scalpel report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scalpel-report-pr${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            target/scalpel-report.json
            target/scalpel-report-summary.md
          retention-days: 30
          if-no-files-found: warn

  cli-verify:
    name: CLI Verification
    needs: [decide, build-java]
    if: needs.decide.outputs.run-cli == 'true'
    uses: ./.github/workflows/verify-cli.yaml
    with:
      image-tag: ${{ github.sha }}

  go-sdk-freshness:
    name: Go SDK Freshness
    runs-on: ubuntu-latest
    timeout-minutes: 15  # longest green run, week to 2026-10-01: 0 min
    needs: [decide]
    if: needs.decide.outputs.run-go-sdk-freshness == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'

      - name: Regenerate Go SDK
        run: |
          cd go-sdk
          make generate format

      - name: Check for drift
        run: |
          if ! git diff --exit-code go-sdk/pkg/; then
            echo "::error::Go SDK is out of date. Run 'cd go-sdk && make generate format' and commit the changes."
            exit 1
          fi

  sdk:
    name: SDK Verification
    needs: [decide, build-java]
    if: needs.decide.outputs.run-sdk == 'true'
    uses: ./.github/workflows/verify-sdk.yaml
    with:
      image-tag: ${{ github.sha }}

  console-plugin:
    name: Console Plugin
    needs: [decide]
    if: needs.decide.outputs.run-console-plugin == 'true'
    uses: ./.github/workflows/verify-console-plugin.yaml
    secrets: inherit

  integration-tests:
    name: Integration Tests
    needs: [decide, build-java]
    if: needs.decide.outputs.run-integration == 'true'
    uses: ./.github/workflows/verify-integration-tests.yaml
    with:
      image-tag: ${{ github.sha }}

  extras:
    name: Extra Tests
    needs: [decide, build-java, build-ui]
    if: needs.decide.outputs.run-extras == 'true'
    uses: ./.github/workflows/verify-extras.yaml
    with:
      image-tag: ${{ github.sha }}

  operator:
    name: Operator Tests
    needs: [decide]
    if: needs.decide.outputs.run-operator == 'true'
    uses: ./.github/workflows/operator.yaml
    with:
      publish: ${{ github.event_name == 'push' }}
    secrets: inherit

  # ============================================================================
  # VERIFY RESULT: aggregates every job above
  #
  # Not a required check itself. The required check is the "Verification Gate"
  # commit status, which the orchestrator (pr-lifecycle.yml, gate-status job)
  # posts on the PR head commit from the NEWEST Verify run for that commit,
  # reading this job's conclusion:
  #   success -> Verification Gate success
  #   skipped -> Verification Gate pending (full suite not required yet)
  #   failure -> Verification Gate failure
  # A commit status is replaced in place, so a PR shows exactly one, current
  # Verification Gate however many Verify runs its commit has had. A job's
  # check-run cannot do that: every run is its own check suite, and the PR
  # page kept showing a red Gate from an older run next to the green one.
  #
  # Skipped (not failed) when Decide did not require the full suite, so the
  # PR page shows a neutral "skipped" rather than a red check during review.
  # Being skipped is safe only because this job is no longer the required
  # check; the orchestrator turns "skipped" into a pending status. It still
  # runs, and fails, when Decide itself did not succeed.
  # ============================================================================
  gate:
    name: Verify Result
    if: >-
      always()
      && github.repository_owner == 'Apicurio'
      && (github.event_name == 'push'
          || needs.decide.result != 'success'
          || needs.decide.outputs.lifecycle-ready == 'true')
    needs: [decide, lint-and-validate, build-java, build-ui, unit-tests,
            cli-verify, go-sdk-freshness, sdk, console-plugin,
            integration-tests, extras, operator]
    runs-on: ubuntu-latest
    timeout-minutes: 10  # longest green run, week to 2026-10-01: 0 min
    steps:
      - name: Evaluate jobs
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Job results: $RESULTS"
          FAILED=$(echo "$RESULTS" | jq '[.[] | select(. != "success" and . != "skipped")] | length')
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::One or more Verify jobs failed or were cancelled"
            exit 1
          fi
          echo "All jobs passed or were appropriately skipped"

  # ============================================================================
  # PUBLISH: Push images (only on push to main)
  #
  # always() is required, not cosmetic. gate runs under always() so that it can
  # report on a run in which Decide legitimately skipped some of its needs
  # (cli-verify and go-sdk-freshness are skipped on most pushes, by design).
  # A skipped ancestor propagates "skipped" down to every descendant that does
  # not opt out with always(), so without it this job is skipped on every push
  # to main even when build-java and gate both succeed — which is exactly what
  # happened between 2026-08-22 and 2026-09-03, leaving latest-snapshot stale
  # on quay.io for twelve days and latest-snapshot-mutable never published at
  # all. The explicit result checks below restore the safety property that the
  # implicit success() was providing: publish only a commit that built cleanly
  # and passed Verify Result (the gate job).
  # ============================================================================
  publish:
    name: Publish Images
    needs: [build-java, gate]
    if: >-
      always()
      && github.event_name == 'push'
      && github.repository_owner == 'Apicurio'
      && needs.build-java.result == 'success'
      && needs.gate.result == 'success'
    uses: ./.github/workflows/verify-publish.yaml
    with:
      image-tag: ${{ github.sha }}
      snapshot-tag: ${{ github.ref_name == 'main' && 'latest-snapshot' || format('{0}-snapshot', github.ref_name) }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}

  # ============================================================================
  # NOTIFICATIONS
  # ============================================================================
  notify-slack:
    name: Slack Notification
    needs: [gate, publish, operator]
    if: github.event_name == 'push' && github.repository_owner == 'Apicurio' && always()
    uses: ./.github/workflows/reusable-notify-slack.yaml
    with:
      workflow-name: ${{ github.workflow }}
      job-name: 'verification'
      job-status: ${{ (needs.gate.result == 'failure' || needs.publish.result == 'failure' || needs.operator.result == 'failure') && 'failure' || 'success' }}
    secrets:
      SLACK_NOTIFICATION_WEBHOOK: ${{ secrets.SLACK_NOTIFICATION_WEBHOOK }}
      SLACK_ERROR_WEBHOOK: ${{ secrets.SLACK_ERROR_WEBHOOK }}
