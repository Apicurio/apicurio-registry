name: Verify

# Slim top-level workflow: operator tests, image publishing, and the
# Verification Gate.
#
# The rest of the full suite was split into per-phase top-level workflows:
#   - ci.yaml                  — fast PR gate + unit tier (unit tests, SDKs, CLI, console plugin)
#   - integration-tests.yaml   — integration test matrix
#   - extras.yaml              — additional checks (examples)
# All four share the Decide logic via verify-decide.yaml and only run real work at
# lifecycle/ready-to-merge (and on pushes to main). The Verification Gate below is
# the single required check for branch protection: it waits for the sibling
# workflows' runs on the same SHA and fails if any of them failed.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  decide:
    name: Decide
    uses: ./.github/workflows/verify-decide.yaml

  operator:
    name: Operator Tests
    needs: [decide]
    if: needs.decide.outputs.run-operator == 'true'
    uses: ./.github/workflows/operator.yaml
    with:
      publish: ${{ github.event_name == 'push' }}
    secrets: inherit

  # Push-only: verify-publish downloads the build-artifacts-<sha> artifact from
  # this run, so publishing needs a build in this workflow.
  build:
    name: Build
    needs: [decide]
    if: github.event_name == 'push'
    uses: ./.github/workflows/verify-build.yaml

  # ============================================================================
  # VERIFICATION GATE: single required check for branch protection
  #
  # Aggregates this workflow's jobs AND the sibling full-suite workflows
  # (CI, Integration Tests, Extra Tests) for the same commit. During PR review
  # the full tier is skipped by Decide in every workflow, so all runs complete
  # quickly and the gate passes without blocking iteration.
  # ============================================================================
  verification-gate:
    name: Verification Gate
    if: always() && github.repository_owner == 'Apicurio'
    needs: [decide, operator, build]
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - name: Evaluate own jobs
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Job results: $RESULTS"
          FAILED=$(echo "$RESULTS" | jq '[.[] | select(. != "success" and . != "skipped")] | length')
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::One or more Verify jobs failed or were cancelled"
            exit 1
          fi

      - name: Wait for sibling full-suite workflows
        env:
          GH_TOKEN: ${{ github.token }}
          # PR runs report the branch head SHA; push runs report the commit.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
          # This workflow's OWN Decide job (same reusable verify-decide.yaml, same
          # event/labels) is authoritative for whether the full suite is expected
          # for this SHA: 'true' (ready-to-merge or push) means CI, Integration
          # Tests and Extra Tests must all complete; 'false' (PR review/draft)
          # means only CI's fast gate runs (Integration Tests/Extra Tests skip
          # their own real jobs via Decide but the workflow run itself still
          # completes quickly); 'skip' (non-lifecycle label churn) means nothing
          # meaningful runs at all. Using this instead of a fixed "no sibling
          # after N minutes" guess avoids mistaking "still building" for "will
          # never run".
          FULL_SUITE: ${{ needs.decide.outputs.lifecycle-ready }}
        run: |
          if [ "$FULL_SUITE" = "skip" ]; then
            echo "Non-lifecycle event, nothing to wait for"
            exit 0
          fi

          if [ "$FULL_SUITE" = "true" ]; then
            echo "Full suite required: waiting for CI, Integration Tests and Extra Tests"
          else
            echo "Fast gate only (PR review): waiting for CI"
          fi

          # CI/Integration Tests/Extra Tests all trigger directly on the same
          # pull_request/push events as this workflow, so a single head_sha
          # filter finds all of them.

          # ~200 requests at 60s apart (200 min), comfortably above the full
          # suite's realistic worst case, while still bounded by this job's
          # timeout-minutes so a genuinely hung run is caught rather than
          # polled forever.
          for i in $(seq 1 200); do
            LATEST=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
              --jq "[.workflow_runs | sort_by(.created_at) | reverse | .[] | select(.name == \"CI\" or .name == \"Integration Tests\" or .name == \"Extra Tests\")] | unique_by(.name) | map({name, status, conclusion})")

            echo "Sibling runs (attempt $i):"
            echo "$LATEST" | jq -c '.[]'

            FAILED=$(echo "$LATEST" | jq '[.[] | select(.conclusion != null and .conclusion != "success")] | length')
            if [ "$FAILED" -gt 0 ]; then
              echo "::error::A sibling full-suite workflow failed for $SHA"
              exit 1
            fi

            if [ "$FULL_SUITE" = "true" ]; then
              COUNT=$(echo "$LATEST" | jq 'length')
              PENDING=$(echo "$LATEST" | jq '[.[] | select(.status != "completed")] | length')
              if [ "$COUNT" -eq 3 ] && [ "$PENDING" -eq 0 ]; then
                echo "All sibling workflows completed successfully"
                exit 0
              fi
            else
              # Integration Tests/Extra Tests complete almost instantly in this
              # state (Decide skips their real jobs) — only CI's fast gate
              # actually takes meaningful time, so it alone gates the wait.
              CI_DONE=$(echo "$LATEST" | jq '[.[] | select(.name == "CI" and .status == "completed")] | length')
              if [ "$CI_DONE" -eq 1 ]; then
                echo "CI fast gate completed successfully"
                exit 0
              fi
            fi

            sleep 60
          done

          echo "::error::Timed out waiting for sibling full-suite workflows for $SHA"
          exit 1

  # ============================================================================
  # PUBLISH: Push images (only on push to main)
  # ============================================================================
  publish:
    name: Publish Images
    needs: [build, verification-gate]
    if: github.event_name == 'push' && github.repository_owner == 'Apicurio'
    uses: ./.github/workflows/verify-publish.yaml
    with:
      image-tag: ${{ github.sha }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}

  # ============================================================================
  # NOTIFICATIONS
  # ============================================================================
  notify-slack:
    name: Slack Notification
    needs: [verification-gate, publish, operator]
    if: github.event_name == 'push' && github.repository_owner == 'Apicurio' && always()
    uses: ./.github/workflows/reusable-notify-slack.yaml
    with:
      workflow-name: ${{ github.workflow }}
      job-name: 'verification'
      job-status: ${{ (needs.verification-gate.result == 'failure' || needs.publish.result == 'failure' || needs.operator.result == 'failure') && 'failure' || 'success' }}
    secrets:
      SLACK_NOTIFICATION_WEBHOOK: ${{ secrets.SLACK_NOTIFICATION_WEBHOOK }}
      SLACK_ERROR_WEBHOOK: ${{ secrets.SLACK_ERROR_WEBHOOK }}
