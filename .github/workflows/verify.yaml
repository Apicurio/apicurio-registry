name: Verify

# Slim top-level workflow: operator tests, image publishing, and the
# Verification Gate.
#
# The rest of the full suite was split into per-phase top-level workflows:
#   - quick-check.yaml         — fast PR gate + the sole real Build (Java app + Docker images)
#   - ci.yaml                  — unit tier (unit tests, SDKs, CLI, console plugin)
#   - integration-tests.yaml   — integration test matrix
#   - extras.yaml              — additional checks (examples)
# All five share the Decide logic via verify-decide.yaml and only run real work at
# lifecycle/ready-to-merge (and on pushes to main). The Verification Gate below is
# the single required check for branch protection: it waits for the sibling
# workflows' runs on the same SHA and fails if any of them failed. On push to main,
# publishing reuses quick-check.yaml's Build job artifacts/Docker images (via
# await-build below) instead of rebuilding them again here.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # actions: read is needed for await-build's cross-run artifact download
  # (quick-check.yaml's Build job runs in a separate workflow run) — a
  # reusable workflow's own permissions are capped by what the caller grants.
  actions: read

jobs:
  decide:
    name: Decide
    uses: ./.github/workflows/verify-decide.yaml

  operator:
    name: Operator Tests
    needs: [decide]
    if: needs.decide.outputs.run-operator == 'true'
    uses: ./.github/workflows/operator.yaml
    with:
      publish: ${{ github.event_name == 'push' }}
    secrets: inherit

  # Push-only: verify-publish downloads build-artifacts-<sha> and the app/MCP
  # Docker images from quick-check.yaml's Build job for this SHA (the sole
  # build, same as every other top-level workflow) instead of rebuilding here.
  await-build:
    name: Await Build
    needs: [decide]
    if: github.event_name == 'push'
    uses: ./.github/workflows/verify-await-build.yaml

  # ============================================================================
  # VERIFICATION GATE: single required check for branch protection
  #
  # Aggregates this workflow's jobs AND the sibling full-suite workflows
  # (Quick Check, CI, Integration Tests, Extra Tests) for the same commit.
  # During PR review the full tier is skipped by Decide in every workflow, so
  # all runs complete quickly and the gate passes without blocking iteration.
  # ============================================================================
  verification-gate:
    name: Verification Gate
    if: always() && github.repository_owner == 'Apicurio'
    needs: [decide, operator, await-build]
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - name: Evaluate own jobs
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Job results: $RESULTS"
          FAILED=$(echo "$RESULTS" | jq '[.[] | select(. != "success" and . != "skipped")] | length')
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::One or more Verify jobs failed or were cancelled"
            exit 1
          fi

      - name: Wait for sibling full-suite workflows
        env:
          GH_TOKEN: ${{ github.token }}
          # PR runs report the branch head SHA; push runs report the commit.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Live, direct check of the PR's CURRENT lifecycle state — do NOT
          # trust this run's own Decide output (computed once, from this run's
          # triggering event/label, which can already be stale by the time
          # this step runs — see the sibling-workflow-disagreement comment
          # further down) or assume some other Verify run for this SHA is
          # "authoritative" for a non-lifecycle event. Every invocation of
          # this step re-fetches the PR's actual labels right here, right
          # before deciding, so the answer can never be stale.
          #
          # This matters because both required branch-protection checks
          # (Lint and Validate, and this Gate) are designed to complete near-
          # instantly while the full suite is not required yet (PR review,
          # before lifecycle/ready-to-merge) — skipped jobs count as passing
          # for required-status-check purposes. If this step also reported
          # success in that state, native "Merge pull request" would be
          # unblocked despite the full suite never having actually run.
          # Failing here instead is the correct, honest signal: the check
          # legitimately has not been satisfied yet, and GitHub will show it
          # as failing (not neutral/pending) until the PR is promoted and the
          # full suite genuinely completes — which is expected and not a sign
          # of anything broken.
          if [ "$EVENT_NAME" = "push" ]; then
            echo "Push to main: full suite always required"
          else
            # Mirrors verify-decide.yaml's own lifecycle-scope logic exactly
            # (orchestrator/disabled bypasses the lifecycle label dance unless
            # DO NOT MERGE is also present) so this live check agrees with
            # what Decide itself would compute right now — not a stale
            # snapshot from whenever Decide happened to run earlier.
            READY=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '
              [.labels[].name] as $labels |
              ($labels | index("lifecycle/ready-to-merge") != null) as $readyToMerge |
              ($labels | index("orchestrator/disabled") != null) as $orchestratorDisabled |
              ($labels | index("DO NOT MERGE") != null) as $doNotMerge |
              if $orchestratorDisabled then (if $doNotMerge then false else true end)
              else $readyToMerge
              end')
            if [ "$READY" != "true" ]; then
              echo "::error::PR #$PR_NUMBER is not lifecycle/ready-to-merge yet — the full suite has not run for this SHA. This is expected during PR review, not a failure of anything: promotion happens automatically once the fast gate (Quick Check) passes (immediately for trusted/auto-accepted authors, or after an approving review for everyone else), and this Gate will pass once the full suite subsequently completes for the promoted commit."
              exit 1
            fi
            echo "PR #$PR_NUMBER is lifecycle/ready-to-merge: full suite required"
          fi

          echo "Waiting for Quick Check, CI, Integration Tests and Extra Tests to complete for $SHA"

          # Quick Check/CI/Integration Tests/Extra Tests all trigger directly
          # on the same pull_request/push events as this workflow, so a single
          # head_sha filter finds all of them. Always require all four
          # regardless of what any sibling's own Decide computed: each
          # sibling's own workflow run always completes quickly on its own
          # whether it ran real jobs or skipped them internally, so waiting
          # for all four unconditionally is never a false timeout, and it is
          # the only way to reliably catch a sibling that did run (and
          # failed) even when its own Decide disagreed with this check's
          # live PR-state read above about whether it should have.
          for i in $(seq 1 200); do
            LATEST=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
              --jq "[.workflow_runs | sort_by(.created_at) | reverse | .[] | select(.name == \"Quick Check\" or .name == \"CI\" or .name == \"Integration Tests\" or .name == \"Extra Tests\")] | unique_by(.name) | map({name, status, conclusion})")

            echo "Sibling runs (attempt $i):"
            echo "$LATEST" | jq -c '.[]'

            FAILED=$(echo "$LATEST" | jq '[.[] | select(.conclusion != null and .conclusion != "success")] | length')
            if [ "$FAILED" -gt 0 ]; then
              echo "::error::A sibling full-suite workflow failed for $SHA"
              exit 1
            fi

            COUNT=$(echo "$LATEST" | jq 'length')
            PENDING=$(echo "$LATEST" | jq '[.[] | select(.status != "completed")] | length')
            if [ "$COUNT" -eq 4 ] && [ "$PENDING" -eq 0 ]; then
              echo "All sibling workflows completed successfully"
              exit 0
            fi

            sleep 60
          done

          echo "::error::Timed out waiting for sibling full-suite workflows for $SHA"
          exit 1

  # ============================================================================
  # PUBLISH: Push images (only on push to main)
  # ============================================================================
  publish:
    name: Publish Images
    needs: [await-build, verification-gate]
    if: github.event_name == 'push' && github.repository_owner == 'Apicurio'
    uses: ./.github/workflows/verify-publish.yaml
    with:
      image-tag: ${{ github.sha }}
      build-run-id: ${{ needs.await-build.outputs.run-id }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}

  # ============================================================================
  # NOTIFICATIONS
  # ============================================================================
  notify-slack:
    name: Slack Notification
    needs: [verification-gate, publish, operator]
    if: github.event_name == 'push' && github.repository_owner == 'Apicurio' && always()
    uses: ./.github/workflows/reusable-notify-slack.yaml
    with:
      workflow-name: ${{ github.workflow }}
      job-name: 'verification'
      job-status: ${{ (needs.verification-gate.result == 'failure' || needs.publish.result == 'failure' || needs.operator.result == 'failure') && 'failure' || 'success' }}
    secrets:
      SLACK_NOTIFICATION_WEBHOOK: ${{ secrets.SLACK_NOTIFICATION_WEBHOOK }}
      SLACK_ERROR_WEBHOOK: ${{ secrets.SLACK_ERROR_WEBHOOK }}
