# Quarkus CLI Configuration

# Disable banner (we use our own ASCII art in the help header)
quarkus.banner.enabled=false

# Application version (filtered by Maven)
quarkus.application.version=${project.version}

# Alias for backward compatibility with existing code
version=${project.version}

# Logging - send log output to stderr so stdout is clean for CLI output
quarkus.log.console.stderr=true
quarkus.log.level=OFF



# Native image configuration
# JNA (used by the Windows credential provider) starts a cleaner thread as soon as it is
# initialized, which is not allowed in the image heap, so it has to be initialized at run time.
quarkus.native.additional-build-args=\
  ${jline.native.args}--initialize-at-run-time=io.vertx.ext.auth.impl.jose.JWT,\
  --initialize-at-run-time=org.jline.terminal.impl.ffm,\
  --initialize-at-run-time=org.jline.terminal.impl.jna,\
  --initialize-at-run-time=org.jline.terminal.impl.jna.win,\
  --initialize-at-run-time=org.jline.terminal.impl.jna.linux,\
  --initialize-at-run-time=org.jline.terminal.impl.jna.osx,\
  --initialize-at-run-time=org.jline.terminal.impl.jna.solaris,\
  --initialize-at-run-time=org.jline.terminal.impl.jna.freebsd,\
  --initialize-at-run-time=org.jline.terminal.impl.jansi,\
  --initialize-at-run-time=com.sun.jna,\
  --initialize-at-run-time=com.sun.jna.internal
quarkus.native.enable-https-url-handler=true

# Bundle the JNA dispatch library so the Windows credential provider can load it at run time.
quarkus.native.resources.includes=com/sun/jna/win32-x86-64/jnidispatch.dll

# Include every charset in the native image. JNA reads the platform charset (for example Cp1252
# on Windows) during initialization, and it is not embedded by default.
quarkus.native.add-all-charsets=true

%test.quarkus.log.level=INFO
%test.quarkus.log.category."io.apicurio.registry.cli".level=DEBUG
