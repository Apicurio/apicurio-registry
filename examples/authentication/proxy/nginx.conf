# A minimal authenticating reverse proxy (step 9): nginx checks HTTP basic credentials against
# htpasswd, then forwards the request to registry-proxy with the caller's identity in headers.
# The registry trusts these headers, so it must only be reachable through the proxy (in this
# example, registry-proxy publishes no port).
events {}
http {
  # Groups per user, sent as X-Forwarded-Groups; the registry uses them as roles
  map $remote_user $groups {
    alice   "sr-developer";
    bob     "sr-readonly";
    default "";
  }
  server {
    listen 8080;
    location / {
      auth_basic           "registry";
      auth_basic_user_file /etc/nginx/htpasswd;
      # Never pass on what the client sent: only the proxy sets these headers
      proxy_set_header X-Forwarded-User   $remote_user;
      proxy_set_header X-Forwarded-Email  "$remote_user@example.com";
      proxy_set_header X-Forwarded-Groups $groups;
      proxy_set_header Authorization      "";
      proxy_pass http://registry-proxy:8080;
    }
  }
}
