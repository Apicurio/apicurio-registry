# Kafka Connect worker for demo.sh step 13. Converters are set per connector (see demo.sh), so the
# defaults here only apply to connectors that do not set their own.
bootstrap.servers=kafka:29092
group.id=serdes-connect
listeners=http://0.0.0.0:8083
# Internal topics on a single broker
config.storage.topic=connect-configs
offset.storage.topic=connect-offsets
status.storage.topic=connect-status
config.storage.replication.factor=1
offset.storage.replication.factor=1
status.storage.replication.factor=1
offset.flush.interval.ms=1000
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.storage.StringConverter
# The Apicurio converters (connect-plugin/target/plugins/apicurio) and the FileStream connectors
plugin.path=/opt/connect-plugins,/tmp/plugins
