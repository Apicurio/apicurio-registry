# Kafka serdes example: a Kafka broker, Apicurio Registry and its UI, and (profile "connect") a Kafka
# Connect worker with the Apicurio converters. See README.md; run ./demo.sh to verify.
#
# For local demonstration only: in-memory registry storage, a single-node broker without security.
#
# Host ports default to 9092 (Kafka), 8081 (API), 8888 (UI) and 8083 (Connect); override them with
# KAFKA_PORT, REGISTRY_PORT, UI_PORT and CONNECT_PORT.
services:
  kafka:
    image: apache/kafka:3.8.1
    container_name: kafka-serdes
    environment:
      # Single-node KRaft broker (no ZooKeeper). Two listeners: the host (the Java tour) and the
      # Compose network (the Connect worker) reach the broker under different names.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:${KAFKA_PORT:-9092},INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # One broker, so internal topics cannot be replicated
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Let the tour's consumers start reading immediately
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list > /dev/null"]
      interval: 5s
      timeout: 10s
      retries: 30

  apicurio-registry:
    image: ${REGISTRY_IMAGE:-apicurio/apicurio-registry:latest-snapshot}
    container_name: apicurio-registry-api-serdes
    environment:
      # Let demo.sh delete the previous run's artifacts
      apicurio.rest.deletion.group.enabled: "true"
      apicurio.rest.deletion.artifact.enabled: "true"
      apicurio.rest.deletion.artifact-version.enabled: "true"
      QUARKUS_HTTP_CORS_ORIGINS: "*"
    ports:
      - "${REGISTRY_PORT:-8081}:8080"
    # Health is on the management port, 9000
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health/ready > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  apicurio-registry-ui:
    image: ${REGISTRY_UI_IMAGE:-apicurio/apicurio-registry-ui:latest-snapshot}
    container_name: apicurio-registry-ui-serdes
    environment:
      REGISTRY_API_URL: "http://localhost:${REGISTRY_PORT:-8081}/apis/registry/v3"
    ports:
      - "${UI_PORT:-8888}:8080"
    depends_on:
      apicurio-registry:
        condition: service_healthy

  # Started by demo.sh step 13 (`docker compose --profile connect up -d`), after build.sh has put
  # the Apicurio converters, built from this checkout, in connect-plugin/target/plugins.
  connect:
    image: apache/kafka:3.8.1
    container_name: kafka-connect-serdes
    profiles: ["connect"]
    # The FileStream connectors ship with Kafka but are not on the plugin path by default
    command:
      - sh
      - -c
      - mkdir -p /tmp/plugins/file && cp /opt/kafka/libs/connect-file-*.jar /tmp/plugins/file/
        && exec /opt/kafka/bin/connect-distributed.sh /opt/connect/worker.properties
    volumes:
      - ./connect:/opt/connect
      - ./connect-plugin/target/plugins:/opt/connect-plugins:ro
    ports:
      - "${CONNECT_PORT:-8083}:8083"
    depends_on:
      kafka:
        condition: service_healthy
      apicurio-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/connector-plugins | grep -q FileStreamSink"]
      interval: 5s
      timeout: 5s
      retries: 40
