// Registered ahead of time by the tour (step 7); the serializer then only looks it up (find-latest).
syntax = "proto3";
package com.example.payments;

option java_package = "io.apicurio.registry.examples.serdes.proto";
option java_multiple_files = true;

message Refund {
  string refund_id = 1;
  string payment_id = 2;
}
