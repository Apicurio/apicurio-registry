global:
  smtp_smarthost: mailhog:1025
  smtp_from: 'alertmanager@example.com'
  smtp_require_tls: false


route:
  receiver: root
  group_wait: 5s
  group_interval: 5m
  repeat_interval: 3h
  group_by:
    - alertname
    - service
    - severity

receivers:
  - name: root
    email_configs:
      - to: 'devopsteam@example.com'
        send_resolved: true
