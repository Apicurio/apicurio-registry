# ApicurioRegistry3 Custom Resource with mTLS configuration.
# Uses spec.app.tls so the operator manages HTTPS Service ports, NetworkPolicy, and probes.
apiVersion: registry.apicur.io/v1
kind: ApicurioRegistry3
metadata:
  name: apicurio-registry-mtls
  namespace: apicurio-mtls
spec:
  app:
    tls:
      insecureRequests: disabled
      clientAuth: required
      keystoreSecretRef:
        name: registry-mtls-certs
        key: server-keystore.p12
      keystorePasswordSecretRef:
        name: registry-mtls-certs
        key: keystore-password
      truststoreSecretRef:
        name: registry-mtls-certs
        key: server-truststore.p12
      truststorePasswordSecretRef:
        name: registry-mtls-certs
        key: truststore-password
  ui:
    enabled: false
