# A PostgreSQL database for the postgresql variant. For demonstration only: one pod, no volume
# (data lives as long as the pod), a password in a Secret.
apiVersion: v1
kind: Secret
metadata:
  name: registry-db
stringData:
  password: registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:15
          env:
            - {name: POSTGRES_DB, value: registry}
            - {name: POSTGRES_USER, value: registry}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: registry-db, key: password}}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -U, registry, -d, registry]}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
