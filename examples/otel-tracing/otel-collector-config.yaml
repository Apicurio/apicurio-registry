# OpenTelemetry Collector: receives OTLP from every service, forwards traces to Jaeger and exposes
# the metrics it receives (for example the Registry's HTTP server metrics) in Prometheus format.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    # Short timeout so that demo.sh finds the spans in Jaeger quickly
    timeout: 1s
    send_batch_size: 1024
  # Tag all telemetry with the environment it came from
  resource:
    attributes:
      - key: deployment.environment
        value: docker-compose
        action: upsert

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: otel
  # The Registry also exports its logs (with trace and span IDs); count them, don't print them
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
