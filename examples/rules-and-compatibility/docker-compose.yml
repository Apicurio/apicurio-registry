# Rules and compatibility example. See README.md; run ./demo.sh to verify.
#
# For local demonstration only: in-memory storage, so data is lost when the container stops.
#
# Host ports default to 8081 (API) and 8888 (UI); override them with REGISTRY_PORT and UI_PORT.
services:
  apicurio-registry:
    image: ${REGISTRY_IMAGE:-apicurio/apicurio-registry:latest-snapshot}
    container_name: apicurio-registry-api-rules
    environment:
      # Let demo.sh clean up and re-run
      apicurio.rest.deletion.group.enabled: "true"
      apicurio.rest.deletion.artifact.enabled: "true"
      apicurio.rest.deletion.artifact-version.enabled: "true"
      # Drafts are created without running rules; the rules run when a draft is published (step 10)
      apicurio.rest.mutability.artifact-version-content.enabled: "true"
      QUARKUS_HTTP_CORS_ORIGINS: "*"
    ports:
      - "${REGISTRY_PORT:-8081}:8080"
    # The UI starts once the Registry is ready; health is on the management port, 9000
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health/ready > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  apicurio-registry-ui:
    image: ${REGISTRY_UI_IMAGE:-apicurio/apicurio-registry-ui:latest-snapshot}
    container_name: apicurio-registry-ui-rules
    environment:
      REGISTRY_API_URL: "http://localhost:${REGISTRY_PORT:-8081}/apis/registry/v3"
    ports:
      - "${UI_PORT:-8888}:8080"
    depends_on:
      apicurio-registry:
        condition: service_healthy
