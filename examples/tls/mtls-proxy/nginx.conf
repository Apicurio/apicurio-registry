# The mTLS front of registry-mtls: it requires a client certificate signed by the example CA, then
# forwards the request over TLS to the registry, checking the registry's certificate too.
# (The registry image cannot require client certificates itself: see README.md.)
server {
    listen 8443 ssl;

    ssl_certificate         /certs/server-cert.pem;
    ssl_certificate_key     /certs/server-key.pem;
    ssl_protocols           TLSv1.2 TLSv1.3;

    # Mutual TLS: no certificate, or one not signed by this CA, is refused with 400
    ssl_client_certificate  /certs/ca-cert.pem;
    ssl_verify_client       on;

    client_max_body_size    64m;

    location / {
        # Re-encrypt to the registry, and verify its certificate against the example CA
        proxy_pass                    https://registry-mtls:8443;
        proxy_ssl_trusted_certificate /certs/ca-cert.pem;
        proxy_ssl_verify              on;
        proxy_ssl_name                registry-mtls;
        proxy_ssl_server_name         on;
        proxy_set_header Host               $host;
        proxy_set_header X-Forwarded-Proto  https;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    }
}
