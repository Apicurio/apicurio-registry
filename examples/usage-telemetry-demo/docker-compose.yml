# Usage telemetry example: a registry that records which client applications fetch which schema
# versions, and the console that shows it. demo.sh plays the client applications.
#
# For local demonstration only: no authentication (the usage endpoints are admin endpoints), no TLS.
# Host ports: 8080 (API), 8888 (console); override with REGISTRY_PORT and UI_PORT.
services:
  registry:
    image: ${REGISTRY_IMAGE:-apicurio/apicurio-registry:latest-snapshot}
    container_name: usage-telemetry-registry
    environment:
      # Usage telemetry is experimental
      APICURIO_FEATURES_EXPERIMENTAL_ENABLED: "true"
      APICURIO_USAGE_TELEMETRY_ENABLED: "true"
      # Faster than the defaults (10s and 1h), so the demo does not wait
      APICURIO_USAGE_FLUSH_EVERY: 2s
      APICURIO_USAGE_AGGREGATION_EVERY: 5s
      QUARKUS_HTTP_CORS_ORIGINS: "*"
    ports:
      - "${REGISTRY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health/ready > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60

  ui:
    image: ${REGISTRY_UI_IMAGE:-apicurio/apicurio-registry-ui:latest-snapshot}
    container_name: usage-telemetry-ui
    environment:
      REGISTRY_API_URL: "http://localhost:${REGISTRY_PORT:-8080}/apis/registry/v3"
    ports:
      - "${UI_PORT:-8888}:8080"
    depends_on:
      registry: {condition: service_healthy}
