# Prometheus for the usage monitoring example. It scrapes only the Collector, never the Registry:
#   :8889 the usage metric and one heartbeat gauge per Registry process, as exported by the Registry
#   :8888 the Collector's own count of metric points it accepted or refused, which says whether
#         anything reached the Collector at all
# The `instance` label of every series is therefore the Collector's address. The Registry process is
# identified by the service_instance_id label. This example configures none, so the Registry generates one, a
# random UUID created each time it starts; an ID that is configured is exported unchanged.
global:
  scrape_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: otel-collector-usage
    # Keep the time the Registry measured each sample (the Collector sends it), so the newest
    # sample's age is the age of the last export
    honor_timestamps: true
    static_configs:
      - targets: ["otel-collector:8889"]
    metric_relabel_configs:
      # Instrumentation scope labels the Collector adds to every series; they carry no information here
      - action: labeldrop
        regex: otel_scope_.*

  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: otelcol_receiver_(accepted|refused)_metric_points_total
        action: keep
      - action: labeldrop
        regex: otel_scope_.*
