# v2-to-v3 migration example: an Apicurio Registry 2.6 server with data, and empty 3.x servers to
# migrate it to. demo.sh seeds v2, exports it, imports it into v3 and checks that nothing changed.
#
#   registry-v2        2.6, in-memory: the source
#   registry-v3        3.x: the target, with the IDs kept (the default)
#   registry-v3-renum  3.x: a second target, imported with new IDs
#   registry-v3-copy   3.x: restored from a v3 export of registry-v3 (backup and restore)
#
# Profile kafkasql (demo.sh runs it last): a 2.6 KafkaSQL server, and a 3.x server pointed at the
# same journal topic, which refuses to start on it.
#
# For local demonstration only: no authentication, no TLS.
# Host ports: 8081 (v2), 8082 to 8084 (v3), 9002 (registry-v3 management); override with V2_PORT,
# V3_PORT, V3_RENUM_PORT, V3_COPY_PORT and V3_MANAGEMENT_PORT.
x-registry-v3: &registry-v3
  image: ${REGISTRY_IMAGE:-apicurio/apicurio-registry:latest-snapshot}
  environment: &registry-v3-env
    APICURIO_REST_DELETION_ARTIFACT_ENABLED: "true"
  healthcheck:
    test: ["CMD-SHELL", "curl -sf http://localhost:9000/health/ready > /dev/null"]
    interval: 5s
    timeout: 5s
    retries: 60

services:
  registry-v2:
    image: apicurio/apicurio-registry-mem:2.6.13.Final
    container_name: migration-registry-v2
    ports: ["${V2_PORT:-8081}:8080"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60

  registry-v3:
    <<: *registry-v3
    container_name: migration-registry-v3
    # 9000: the management port, with the health endpoints
    ports: ["${V3_PORT:-8082}:8080", "${V3_MANAGEMENT_PORT:-9002}:9000"]

  registry-v3-renum:
    <<: *registry-v3
    container_name: migration-registry-v3-renum
    ports: ["${V3_RENUM_PORT:-8083}:8080"]

  registry-v3-copy:
    <<: *registry-v3
    container_name: migration-registry-v3-copy
    ports: ["${V3_COPY_PORT:-8084}:8080"]

  # ------------------------------------------------------------------- kafkasql: the journal topic
  kafka:
    image: apache/kafka:3.8.1
    container_name: migration-kafka
    profiles: [kafkasql]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list > /dev/null"]
      interval: 5s
      timeout: 10s
      retries: 30

  # 2.6 on KafkaSQL writes its journal to kafkasql-journal
  registry-v2-kafkasql:
    image: apicurio/apicurio-registry-kafkasql:2.6.13.Final
    container_name: migration-registry-v2-kafkasql
    profiles: [kafkasql]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60

  # 3.x pointed at the same topic: it must refuse the v2 journal, not misread it
  registry-v3-kafkasql:
    <<: *registry-v3
    container_name: migration-registry-v3-kafkasql
    profiles: [kafkasql]
    environment:
      APICURIO_STORAGE_KIND: kafkasql
      APICURIO_KAFKASQL_BOOTSTRAP_SERVERS: kafka:9092
      APICURIO_KAFKASQL_TOPIC: kafkasql-journal
    restart: "no"
    depends_on:
      registry-v2-kafkasql: {condition: service_healthy}
