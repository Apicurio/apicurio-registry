apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../default

# Namespace-scoped variant of the operator Deployment. Without OLM the
# `olm.targetNamespaces` annotation is empty, which makes the operator watch ALL
# namespaces (see operator/README.md "Watched Namespaces"). That would not match
# the namespace-scoped RBAC in rbac/namespaced, so here we pin the watched
# namespaces to the operator's own namespace. The patch is keyed on the env var
# name (a strategic merge), not a positional index, so it stays correct if the
# env order in operator/default/operator.yaml ever changes.
patches:
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: apicurio-registry-operator
      spec:
        template:
          spec:
            containers:
              - name: apicurio-registry-operator
                env:
                  - name: APICURIO_OPERATOR_WATCHED_NAMESPACES
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.namespace
