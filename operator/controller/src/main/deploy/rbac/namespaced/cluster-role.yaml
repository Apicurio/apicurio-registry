apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: apicurio-registry-operator-clusterrole

# Only truly cluster-scoped permissions belong here. Namespace-scoped workload
# permissions live in role.yaml so that single-namespace installs stay least-privilege.
# IMPORTANT: When updating permissions, also update operator/olm-tests/src/test/deploy/olmv1/cluster-role.yaml

rules:

  # The operator watches ApicurioRegistry3 CRs cluster-wide to discover them (informer).
  # Only the parent resource is needed here: there is no list/watch endpoint for the /status
  # subresource (you list/watch the parent), so /status is intentionally omitted from the cluster
  # tier. Mutating verbs (patch/update on the CR and its /status for spec migration, status, and the
  # JOSDK finalizer) are namespace-scoped and live in role.yaml. The operator never creates or
  # deletes the CR.
  - apiGroups:
      - registry.apicur.io
    resources:
      - apicurioregistries3
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
    resourceNames:
      - apicurioregistries3.registry.apicur.io
