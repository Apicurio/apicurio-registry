apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: apicurio-registry-operator-group
  namespace: ${PLACEHOLDER_NAMESPACE}
# An OperatorGroup with no targetNamespaces selects AllNamespaces install mode:
# OLM sets an empty olm.targetNamespaces annotation, so the operator watches all
# namespaces and OLM creates a ClusterRole + ClusterRoleBinding for permissions.
spec: {}
