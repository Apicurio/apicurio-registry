apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: apicurio-registry-operator-installer-clusterrole

rules:

  - apiGroups:
      - ''
    resources:
      - serviceaccounts
    verbs:
      [ create, list, watch ]

  - apiGroups:
      - ''
    resources:
      - serviceaccounts
    verbs:
      [ get, update, patch, delete ]
    resourceNames:
      - apicurio-registry-operator

  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
    verbs:
      [ create, list, watch ]

  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
    verbs:
      [ get, update, patch, delete ]
    resourceNames:
      [ ]  # See note [1] below.
    # - apicurio-registry--37z3ye11ga8b53ub26q89ai1gfsug2ywuf6vk7ggxtc6

  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterrolebindings
    verbs:
      [ create, list, watch ]

  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterrolebindings
    verbs:
      [ get, update, patch, delete ]
    resourceNames:
      [ ] # See note [1] below.
    # - apicurio-registry--37z3ye11ga8b53ub26q89ai1gfsug2ywuf6vk7ggxtc6

  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      [ create, list, watch ]

  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      [ get, update, patch, delete ]
    resourceNames:
      [ ]
    # TODO: Not sure why this is not enough:
    # - apicurioregistries3.registry.apicur.io

  - apiGroups:
      - olm.operatorframework.io
    resources:
      - clusterextensions/finalizers
    verbs:
      - update
    resourceNames:
      - apicurio-registry-operator-ce

    # Operator permissions (transitive):

  # The operator's generated CSV requests cluster-wide `namespaces` get/list/watch because the
  # reconciler watches all namespaces. Under OLM v1 the installer SA can only grant permissions it
  # holds (escalation prevention), so the installer role must carry this rule or the ClusterExtension
  # never reaches Installed: True. This rule is not declared in rbac/namespaced (OLM v1 injects it via
  # AllNamespaces promotion), but RbacInstallerSyncTest asserts it explicitly as a promotion-injected
  # tuple, so it is guarded.
  - apiGroups:
      - ''
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch

  # Kept in sync with the operator's runtime permissions on the parent CR and its /status. OLM v1
  # always installs AllNamespaces (cluster-scoped), so the resolved bundle carries the *cluster*
  # overlay's ClusterRole (controller/src/main/deploy/rbac/cluster/cluster-role.yaml), which grants
  # the full verb set on both apicurioregistries3 and apicurioregistries3/status -- not the narrower
  # namespaced overlay. Under escalation prevention the installer SA can only create that ClusterRole
  # if it holds every verb in it, so this must mirror the cluster overlay's grant, not the namespaced
  # subset. (The productized downstream bundle exposed this: the installer, holding only get/list/
  # patch/update/watch on the CR and patch/update on /status, could not grant the bundle's
  # create/delete on the CR or create/delete/get/list/watch on /status.)
  - apiGroups:
      - registry.apicur.io
    resources:
      - apicurioregistries3
      - apicurioregistries3/status
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  - apiGroups:
      - ''
    resources:
      - configmaps
      - events
      - pods
      - services
      - serviceaccounts
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
      - rolebindings
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
      - networkpolicies
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  - apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  - apiGroups:
      - ''
    resources:
      - secrets
    verbs:
      [ create, get ]

  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - create
      - update
      - patch
      - delete

# NOTES:
# [1] We can't easily limit the permissions only to resources that are used to deploy the operator.
#     OLM v1 adds hash-like suffixes to the resource names, but Kubernetes [does not support wildcards yet](https://github.com/kubernetes/kubernetes/issues/56582).
#     We could try to figure out the hashes ahead of time, but it's complex and error-prone.
