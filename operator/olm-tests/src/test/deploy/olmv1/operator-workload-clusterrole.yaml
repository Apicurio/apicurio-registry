# Models the RBAC a cluster admin must provide for an all-namespace operator install under OLM v1.
#
# OLM v1 has no OperatorGroup, so unlike OLM v0 AllNamespaces it does not promote the CSV
# `permissions` to cluster scope. It only creates the namespace-scoped Role from `permissions` in the
# ClusterExtension's namespace. An operator that watches all namespaces (the default) therefore needs
# the admin to grant its ServiceAccount cluster-wide access to the workloads it reconciles. The OLM v1
# tests apply this ClusterRole + ClusterRoleBinding to model that admin step so the operator can start.
#
# It grants the operator ServiceAccount (not the installer SA) the same rules the CSV grants
# namespace-scoped in `permissions` (controller/src/main/deploy/rbac/namespaced/role.yaml), just at
# cluster scope. Keep the two in sync.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: apicurio-registry-operator-workload-clusterrole
rules:

  - apiGroups:
      - registry.apicur.io
    resources:
      - apicurioregistries3
      - apicurioregistries3/status
    verbs:
      - patch
      - update

  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  - apiGroups:
      - ''
    resources:
      - configmaps
      - events
      - pods
      - services
      - serviceaccounts
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
      - rolebindings
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
      - networkpolicies
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  - apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  - apiGroups:
      - ''
    resources:
      - secrets
    verbs:
      - create
      - get

  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - create
      - update
      - patch
      - delete
