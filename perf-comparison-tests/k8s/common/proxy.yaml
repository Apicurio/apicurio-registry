apiVersion: apps/v1
kind: Deployment
metadata:
  name: benchmark-proxy
spec:
  replicas: 1
  selector:
    matchLabels: { app: benchmark-proxy }
  template:
    metadata:
      labels: { app: benchmark-proxy }
    spec:
      enableServiceLinks: false
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.29.1-alpine
          resources:
            requests: { cpu: "500m", memory: 128Mi }
            limits: { cpu: "2", memory: 256Mi }
          ports:
            - { name: https, containerPort: 8443 }
          volumeMounts:
            - { name: config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf }
            - { name: auth, mountPath: /etc/nginx/auth, readOnly: true }
            - { name: tls, mountPath: /etc/nginx/tls, readOnly: true }
          readinessProbe:
            tcpSocket: { port: https }
            periodSeconds: 2
      volumes:
        - name: config
          configMap: { name: benchmark-proxy }
        - name: auth
          secret: { secretName: benchmark-basic-auth }
        - name: tls
          secret: { secretName: benchmark-tls }
---
apiVersion: v1
kind: Service
metadata:
  name: benchmark-proxy
spec:
  type: NodePort
  selector: { app: benchmark-proxy }
  ports:
    - { name: https, port: 8443, targetPort: https }
