apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
spec:
  replicas: 1
  selector:
    matchLabels: { app: schema-registry }
  template:
    metadata:
      labels: { app: schema-registry }
    spec:
      enableServiceLinks: false
      containers:
        - name: registry
          image: ghcr.io/aiven-open/karapace:6.2.2
          command: [python3, -m, karapace]
          env:
            - { name: KARAPACE_BOOTSTRAP_URI, value: "kafka:9092" }
            - { name: KARAPACE_HOST, value: "0.0.0.0" }
            - { name: KARAPACE_PORT, value: "8081" }
            - { name: KARAPACE_ADVERTISED_HOSTNAME, value: schema-registry }
            - { name: KARAPACE_ADVERTISED_PORT, value: "8081" }
            - { name: KARAPACE_KARAPACE_REGISTRY, value: "true" }
            - { name: KARAPACE_KARAPACE_REST, value: "false" }
            - { name: KARAPACE_REPLICATION_FACTOR, value: "1" }
          resources:
            requests: { cpu: "1", memory: 1Gi }
            limits: { cpu: "2", memory: 2Gi }
          ports:
            - { name: http, containerPort: 8081 }
          readinessProbe:
            httpGet: { path: /_health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: schema-registry
spec:
  selector: { app: schema-registry }
  ports:
    - { name: http, port: 8081, targetPort: http }
