apiVersion: apps/v1
kind: Deployment
metadata:
  name: toxiproxy
  labels:
    app: toxiproxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: toxiproxy
  template:
    metadata:
      labels:
        app: toxiproxy
    spec:
      containers:
        - name: toxiproxy
          image: ghcr.io/shopify/toxiproxy:2.9.0
          # Adds injected network latency in front of the KafkaSQL storage backend, so this
          # scenario resembles a real deployment (a managed/remote Kafka cluster, not a
          # same-node, near-zero-latency broker) - see kafka.yaml for why the broker's
          # KAFKA_ADVERTISED_LISTENERS must point here rather than at itself for this to work.
          #
          # The official image is minimal (no shell), so it runs with its default entrypoint and
          # is configured by the "toxiproxy-config" sidecar below via its HTTP admin API, rather
          # than a startup script in this container.
          ports:
            - name: kafka-proxy
              containerPort: 9094
            - name: admin
              containerPort: 8474
          readinessProbe:
            tcpSocket:
              port: 8474
            initialDelaySeconds: 2
            periodSeconds: 5
        - name: toxiproxy-config
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              until curl -sf http://localhost:8474/version >/dev/null; do sleep 1; done
              curl -sf -X POST http://localhost:8474/proxies -H 'Content-Type: application/json' \
                -d '{"name":"kafka","listen":"0.0.0.0:9094","upstream":"kafka.default.svc:9092"}'
              # Same 15ms +/- 5ms latency profile as the PostgreSQL scenario's toxiproxy, for a
              # like-for-like comparison between the two storage backends.
              curl -sf -X POST http://localhost:8474/proxies/kafka/toxics -H 'Content-Type: application/json' \
                -d '{"name":"kafka_latency","type":"latency","attributes":{"latency":15,"jitter":5}}'
              echo "Toxiproxy configured (kafka -> kafka:9092, +15ms/-5ms latency)"
              sleep infinity
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: toxiproxy
  labels:
    app: toxiproxy
spec:
  ports:
    - name: kafka-proxy
      port: 9094
      targetPort: 9094
    - name: admin
      port: 8474
      targetPort: 8474
  selector:
    app: toxiproxy
