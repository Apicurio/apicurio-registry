apiVersion: apps/v1
kind: Deployment
metadata:
  name: toxiproxy
  labels:
    app: toxiproxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: toxiproxy
  template:
    metadata:
      labels:
        app: toxiproxy
    spec:
      containers:
        - name: toxiproxy
          image: ghcr.io/shopify/toxiproxy:2.9.0
          # Adds a fixed injected network latency between the registry app and PostgreSQL, so
          # this scenario more closely resembles a real deployment (managed DB service on a
          # different node/AZ, connection pooler, TLS termination, etc.) than a same-node
          # Minikube-localhost connection, which has effectively zero network latency and
          # therefore under-represents any benefit virtual threads might have from I/O wait.
          #
          # The official image is minimal (no shell), so it runs with its default entrypoint and
          # is configured by the "toxiproxy-config" sidecar below via its HTTP admin API, rather
          # than a startup script in this container.
          ports:
            - name: postgres-proxy
              containerPort: 5433
            - name: admin
              containerPort: 8474
          readinessProbe:
            tcpSocket:
              port: 8474
            initialDelaySeconds: 2
            periodSeconds: 5
        - name: toxiproxy-config
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              until curl -sf http://localhost:8474/version >/dev/null; do sleep 1; done
              curl -sf -X POST http://localhost:8474/proxies -H 'Content-Type: application/json' \
                -d '{"name":"postgres","listen":"0.0.0.0:5433","upstream":"postgresql.default.svc:5432"}'
              # 15ms +/- 5ms jitter round-trip latency: a reasonable approximation of a managed
              # DB service in the same region/different AZ, not an extreme WAN scenario.
              curl -sf -X POST http://localhost:8474/proxies/postgres/toxics -H 'Content-Type: application/json' \
                -d '{"name":"postgres_latency","type":"latency","attributes":{"latency":15,"jitter":5}}'
              echo "Toxiproxy configured (postgres -> postgresql:5432, +15ms/-5ms latency)"
              sleep infinity
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: toxiproxy
  labels:
    app: toxiproxy
spec:
  ports:
    - name: postgres-proxy
      port: 5433
      targetPort: 5433
    - name: admin
      port: 8474
      targetPort: 8474
  selector:
    app: toxiproxy
