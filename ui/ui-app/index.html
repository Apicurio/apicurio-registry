<!DOCTYPE html>
<html lang="en-US">
  <head>
    <base href="/">
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./public/favicon.svg">
    <link rel="icon" type="image/png" href="./public/favicon.png">
    <meta id="appName" name="application-name" content="Apicurio Registry">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apicurio Registry</title>
    <script type="text/javascript" src="./version.js"></script>
    <script type="text/javascript" src="./config.js"></script>
    <script type="text/javascript">
      (function() {
        try {
          const stored = localStorage.getItem("apicurio-registry.config.theme");
          const isDark = stored === "dark" || (!stored && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) {
            document.documentElement.classList.add("pf-v6-theme-dark");
          } else {
            document.documentElement.classList.remove("pf-v6-theme-dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
